# Goal: Benchmark Prefill Phase Latency/Throughput
# Importance: By constraining output_len to 1 and sweeping across an exponentially 
# increasing input_len, this config measures how efficiently the TPU processes 
# growing context windows during the initial Attention-Prefill phase.

tensor_parallel_size: 4
dtype: bfloat16
max_model_len: 200000
env_vars:
  VLLM_ENABLE_V1_MULTIPROCESSING: '0'
engine_args: {}
sweep_matrix:
  output_len: [1]
  batch_size: [1]
  input_len: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072,
    200000]
  model: [google/gemma-4-12b-it]
