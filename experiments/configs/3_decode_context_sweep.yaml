# Gemma-4 12B Decode Context Length Sweep
model: "google/gemma-4-12b-it"
tensor_parallel_size: 4
dtype: "bfloat16"
max_model_len: 131500

env_vars:
  VLLM_ENABLE_V1_MULTIPROCESSING: "0"

engine_args: {}

sweep_matrix:
  batches: [32]
  inputs: [1024, 2048, 4096, 8192, 16384, 32768, 65536]
  output_len: 64
