apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: standard-rwx
provisioner: filestore.csi.storage.gke.io
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  tier: standard
  network: default
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-vllm-serving
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: standard-rwx
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm-serving
  annotations:
    leaderworkerset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: Qwen3-8B
    llm-d.ai/role: test
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: Qwen3-8B
          llm-d.ai/role: test
      spec:
        nodeSelector:
          cloud.google.com/gke-nodepool: v6e-8-prefill
          cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
          cloud.google.com/gke-tpu-topology: 2x4
        containers:
          - name: vllm-leader
            image: us-east5-docker.pkg.dev/cloud-tpu-inference-test/piv/vllm-tpu-raiden:latest
            imagePullPolicy: Always
            env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: HF_HOME
              value: /usr/vllm
            - name: TPU_MULTIHOST_BACKEND
              value: ray
            - name: SKIP_JAX_PRECOMPILE
              value: "1"
            - name: TPU_NODE_ID
              value: $(LWS_WORKER_INDEX)
            - name: JAX_PLATFORMS
              value: ""
            - name: MODEL_IMPL_TYPE
              value: vllm
            - name: TPU_BACKEND_TYPE
              value: jax
            - name: PJRT_DEVICE
              value: TPU
            - name: USE_MOE_EP_KERNEL
              value: "0"
            - name: VLLM_DISABLE_SHARED_EXPERTS_STREAM
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
            - name: TPU_PROCESS_ADDRESSES
              value: vllm-serving-0.vllm-serving:8476,vllm-serving-0-1.vllm-serving:8476
            - name: TPU_PROCESS_PORT
              value: "8476"
            - name: VLLM_MLA_DISABLE
              value: "1"
            - name: VLLM_ENGINE_CLIENT_STARTUP_TIMEOUT
              value: "1800"
            - name: USE_BATCHED_RPA_KERNEL
              value: "0"
            - name: TPU_OFFLOAD_NUM_CPU_CHUNKS
              value: "8192"
            - name: TPU_OFFLOAD_DECODE_SAVE
              value: "0"
            - name: RAY_RESERVE_CPU_FOR_RAYLET
              value: "1"
            - name: RAY_heartbeat_timeout_milliseconds
              value: "300000" # 5 minutes
            - name: RAY_initial_reconstruction_timeout_milliseconds
              value: "300000"
            - name: RAY_external_storage_heartbeat_timeout_ms
              value: "60000"
            - name: RAY_grpc_server_thread_pool_size
              value: "100"  # Give Ray more threads to handle heartbeats while busy
            - name: RAY_max_pending_lease_requests_per_scheduling_category
              value: "1000"
            - name: RAY_rpc_server_listen_quiet_period_ms
              value: "3600000"
            - name: RAY_gcs_server_request_timeout_seconds
              value: "3600"
            command:
              - sh
              - -c
              - |
                chmod +x /workspace/vllm/examples/ray_serving/multi-node-serving.sh
                bash /workspace/vllm/examples/ray_serving/multi-node-serving.sh leader --ray_cluster_size=$(LWS_GROUP_SIZE) --ray_init_timeout=1800
                vllm serve --seed=42 --model=Qwen/Qwen3-8B --load-format=runai_streamer --max-model-len=10240 --max-num-batched-tokens=8192 --max-num-seqs=512 --enable-prefix-caching --tensor-parallel-size=8 --kv-cache-dtype=fp8 --gpu-memory-utilization=0.70 --async-scheduling --block-size=128 --disable-hybrid-kv-cache-manager --kv-transfer-config '{"kv_connector":"RaidenOffloadConnector","kv_connector_module_path":"tpu_inference.offload.raiden_offload_connector","kv_role":"kv_both"}' || (echo "CONTAINER FAILED - SLEEPING FOR DEBUGGING" && sleep 86400)
            resources:
              limits:
                google.com/tpu: "4"
                memory: "500Gi"
                cpu: "80"
                ephemeral-storage: "40Gi"
              requests:
                google.com/tpu: "4"
                memory: "500Gi"
                cpu: "80"
                ephemeral-storage: "40Gi"
            ports:
              - containerPort: 8000
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: pvc-vllm-vol
                mountPath: "/usr/vllm"
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: pvc-vllm-vol
          persistentVolumeClaim:
            claimName: pvc-vllm-serving
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/inferenceServing: "true"
          llm-d.ai/model: Qwen3-8B
          llm-d.ai/role: test
      spec:
        nodeSelector:
          cloud.google.com/gke-nodepool: v6e-8-prefill
          cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
          cloud.google.com/gke-tpu-topology: 2x4
        containers:
          - name: vllm-worker
            image: us-east5-docker.pkg.dev/cloud-tpu-inference-test/piv/vllm-tpu-raiden:latest
            imagePullPolicy: Always
            command:
              - sh
              - -c
              - |
                chmod +x /workspace/vllm/examples/ray_serving/multi-node-serving.sh
                /workspace/vllm/examples/ray_serving/multi-node-serving.sh worker --ray_address=$(LWS_LEADER_ADDRESS) --ray_init_timeout=1800
            resources:
              limits:
                google.com/tpu: "4"
                memory: "500Gi"
                cpu: "80"
                ephemeral-storage: "40Gi"
              requests:
                google.com/tpu: "4"
                memory: "500Gi"
                cpu: "80"
                ephemeral-storage: "40Gi"
            env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: HF_HOME
              value: /usr/vllm
            - name: TPU_MULTIHOST_BACKEND
              value: ray
            - name: SKIP_JAX_PRECOMPILE
              value: "1"
            - name: TPU_NODE_ID
              value: $(LWS_WORKER_INDEX)
            - name: JAX_PLATFORMS
              value: ""
            - name: MODEL_IMPL_TYPE
              value: vllm
            - name: TPU_BACKEND_TYPE
              value: jax
            - name: PJRT_DEVICE
              value: TPU
            - name: USE_MOE_EP_KERNEL
              value: "0"
            - name: VLLM_DISABLE_SHARED_EXPERTS_STREAM
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: DEBUG
            - name: TPU_PROCESS_ADDRESSES
              value: vllm-serving-0.vllm-serving:8476,vllm-serving-0-1.vllm-serving:8476
            - name: TPU_PROCESS_PORT
              value: "8476"
            - name: VLLM_MLA_DISABLE
              value: "1"
            - name: VLLM_ENGINE_CLIENT_STARTUP_TIMEOUT
              value: "1800"
            - name: USE_BATCHED_RPA_KERNEL
              value: "0"
            - name: TPU_OFFLOAD_NUM_CPU_CHUNKS
              value: "8192"
            - name: TPU_OFFLOAD_DECODE_SAVE
              value: "0"
            - name: RAY_RESERVE_CPU_FOR_RAYLET
              value: "1"
            - name: RAY_heartbeat_timeout_milliseconds
              value: "300000" # 5 minutes
            - name: RAY_initial_reconstruction_timeout_milliseconds
              value: "300000"
            - name: RAY_external_storage_heartbeat_timeout_ms
              value: "60000"
            - name: RAY_grpc_server_thread_pool_size
              value: "100"  # Give Ray more threads to handle heartbeats while busy
            - name: RAY_max_pending_lease_requests_per_scheduling_category
              value: "1000"
            - name: RAY_rpc_server_listen_quiet_period_ms
              value: "3600000"
            - name: RAY_gcs_server_request_timeout_seconds
              value: "3600"
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
              - name: pvc-vllm-vol
                mountPath: "/usr/vllm"
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: pvc-vllm-vol
          persistentVolumeClaim:
            claimName: pvc-vllm-serving
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-serving-service
spec:
  selector:
    llm-d.ai/role: test
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
