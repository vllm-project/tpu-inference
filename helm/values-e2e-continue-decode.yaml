# Values for running tests/e2e/test_continue_decode.py as an offline (in-process)
# pytest job on a single-host TPU v7x-8 slice.
#
# The test builds `vllm.LLM(...)` directly, so no api_server and no HTTP
# benchmark client are rendered -- the whole slice belongs to the test process.
#
# Install from the repo root (the --set-file paths are repo-relative):
#
#   helm install cd-e2e ./helm -f ./helm/values-e2e-continue-decode.yaml \
#     --set-file e2etest.fileContent=tests/e2e/test_continue_decode.py \
#     --set-file e2etest.conftestContent=tests/conftest.py \
#     --set 'e2etest.selector=correctness_DP_torchax'

e2etest:
  enabled: true
  # Injected mode: the file is supplied by --set-file (see the header above), so
  # local edits are picked up. Leave testPaths empty to select this mode.
  testPaths: []
  testFile: "test_continue_decode.py"
  # Leave empty to run every case. WARNING: the full file is 6 correctness
  # cases x 2 sampling_params x 2 engines = 24 engine cold starts.
  selector: ""
  extraArgs:
    - "-x"
    - "--durations=0"
    # Uncomment if repeated LLM() teardown leaves libtpu locked:
    # - "--forked"
  models:
    - "meta-llama/Llama-3.1-8B-Instruct"
    - "Qwen/Qwen1.5-MoE-A2.7B"
  env:
    # test_continue_decode.py sets this in an autouse fixture too, but the job no
    # longer hardcodes it (see helm/templates/jobset.yaml), so be explicit.
    NEW_MODEL_DESIGN: "1"
    JAX_COMPILATION_CACHE_DIR: "/root/.cache/jax"

# All test topologies (tp8xdp1 / tp1xdp8 / tp4xdp2) need exactly 8 devices,
# which is one 2x2x1 tpu7x host -- no Ray / multi-host bootstrap required.
tpu:
  topology: "2x2x1"
  accelerator: "tpu7x"

storage:
  type: "gcs-cache"
  bucketName: "<your-hf-cache-bucket>"
  cacheSubpath: "hf-cache"
  ramCacheLimit: "32Gi"

resources:
  cpu: "32"
  memory: "200Gi"
  tpu: 4

# Weight download + up to 24 engine cold starts: 90 minutes is not enough.
job:
  declaredDurationMinutes: 300
