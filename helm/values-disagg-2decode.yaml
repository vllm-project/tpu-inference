# ==============================================================================
# Disaggregated Llama-3.1-8B-Instruct: Horizontal Decode Replica Scaling
# Prefill: 1x 2x2x1 slice (1 VM, 8 chips, TP=8)
# Decode : 2x 2x2x1 slices (2 independent VMs, TP=8 each, round-robined by Proxy)
# Eliminates multi-host cross-VM KV transfer contention while doubling decode capacity!
# ==============================================================================

mode: "disaggregated"

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  maxModelLen: 4096
  safetensorsLoadStrategy: "prefetch"

disaggregated:
  kvConnector: "TPUConnector"

  prefill:
    replicas: 1
    topology: "2x2x1"
    port: 8400
    resources:
      cpu: "32"
      memory: "72Gi"
      tpu: 4

  decode:
    replicas: 2
    topology: "2x2x1"
    port: 9400
    resources:
      cpu: "32"
      memory: "72Gi"
      tpu: 4

  proxy:
    port: 8000
    resources:
      cpu: "8"
      memory: "16Gi"

storage:
  type: "gcs-cache"
  bucketName: "<your-hf-cache-bucket>"
  cacheSubpath: "hf-cache"
  ramCacheLimit: "32Gi"

benchmark:
  requestRate: 35.0
