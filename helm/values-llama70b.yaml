# Values for multi-host Llama-3.1-70B-Instruct benchmark on TPU v7x-32 (4 VMs)
model:
  name: "meta-llama/Llama-3.1-70B-Instruct"
  maxModelLen: 4096

tpu:
  topology: "2x2x4"
  accelerator: "tpu7x"
  placementPolicy: "tpu7x-32-2x2x4-placement-policy"

storage:
  type: "gcs-cache"
  bucketName: "<your-hf-cache-bucket>"
  cacheSubpath: "hf-cache"
  ramCacheLimit: "160Gi"
  gcsFuse:
    memoryLimit: "180Gi"

resources:
  cpu: "32"
  memory: "200Gi"
  tpu: 4

job:
  declaredDurationMinutes: 90
