  # ---- PP ----

  # PP runs its stages as libtpu processes on one host that exchange device
  # buffers - the "(multi-host)" steps too, whose shape is still one node. On a
  # GKE node libtpu routes that through its tpunetd client (the TPU device
  # plugin's vbar service), which drops the connection mid-transfer
  # ("SocketServer: Connection closed"); with the client off libtpu uses the
  # direct path a bare VM uses. Only these steps turn it off: the Ray slices in
  # the jax and features lanes span hosts and pass with it on.

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Correctness tests for PP (single-host)"
