# The tpu-inference-nightly-image pipeline: its schedule builds main every
# night and publishes the result whatever the nightly tests say. DOCKERHUB_TOKEN
# is a cluster secret whose policy admits this pipeline on main only.
steps:
  - label: ":docker: Publish vllm/vllm-tpu nightly image"
    if: build.branch == "main"
    agents:
      queue: cpu
    secrets:
      - DOCKERHUB_TOKEN
    commands:
      - bash .buildkite/scripts/publish_nightly_image.sh
    plugins:
      - docker-login#v3.0.0:
          username: tpuinference
          password-env: DOCKERHUB_TOKEN
