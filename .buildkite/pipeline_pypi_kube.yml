# pipeline_pypi.yml on the Kueue fleet. Keys match it so the two read side by
# side. Its steps are fixed to tpu_v6e_queue there, so they are v6e here, and
# bootstrap.sh uploads this file once per build rather than per generation:
# its keys carry no generation.

.tpu_step: &tpu_step
  depends_on: "build_docker_tpu6e"
  timeout_in_minutes: 1440
  agents:
    queue: "kube"
  plugins:
    - kubernetes:
        podTemplate: tpu-launcher

x-shape-single: &shape_single "ct6e-standard-1t/1x1"

steps:
  # The bare steps name run_with_pypi.sh, but with USE_PREBUILT_IMAGE=1 that
  # pulls the same CI image as every other step and docker/Dockerfile.pypi is
  # never built, so run.sh's CI image is the match.
  - label: ":kubernetes: PyPI Test Performance benchmarks for meta-llama/Llama-3.1-8B-Instruct"
    key: "pypi_meta-llama_Llama-3_1-8B-Instruct_Benchmark"
    if: build.env("NIGHTLY") == "1"
    env:
      SHAPE: *shape_single
      TPU_VERSION: "tpu6e"
      TEST_MODEL: "meta-llama/Llama-3.1-8B-Instruct"
      TENSOR_PARALLEL_SIZE: "1"
      MINIMUM_THROUGHPUT_THRESHOLD: "10.77"
      INPUT_LEN: "1800"
      OUTPUT_LEN: "128"
      PREFIX_LEN: "0"
      MAX_MODEL_LEN: "2048"
      MAX_NUM_SEQS: "256"
      MAX_NUM_BATCHED_TOKENS: "1024"
    <<: *tpu_step
    commands:
      - .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/benchmark.sh

  - label: ":kubernetes: PyPI Test Performance benchmarks for Qwen/Qwen3-4B"
    key: "pypi_Qwen_Qwen3-4B_Benchmark"
    if: build.env("NIGHTLY") == "1"
    env:
      SHAPE: *shape_single
      TPU_VERSION: "tpu6e"
      TEST_MODEL: "Qwen/Qwen3-4B"
      TENSOR_PARALLEL_SIZE: "1"
      MINIMUM_THROUGHPUT_THRESHOLD: "11.00"
      INPUT_LEN: "1800"
      OUTPUT_LEN: "128"
      PREFIX_LEN: "0"
      MAX_MODEL_LEN: "2048"
      MAX_NUM_SEQS: "94"
      MAX_NUM_BATCHED_TOKENS: "4096"
    <<: *tpu_step
    commands:
      - .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/benchmark.sh
