.docker_build_template: &docker_build_template
  agents:
    queue: cpu_64_core
  retry:
    automatic:
      - exit_status: "*"
        limit: 3
  commands:
    - |
      echo "=== BUILD ATTEMPT: $(( $${BUILDKITE_RETRY_COUNT:-0} + 1 )) (Retry count: $${BUILDKITE_RETRY_COUNT:-0} / 3) ==="
      if [ "$${BUILDKITE_RETRY_COUNT:-0}" -ge 3 ]; then
        echo "🚨 Reached max retries (tried 3 retries) and STILL FAILING! Exiting with status 1."
      else
        echo "⚠️  Attempt failed. Buildkite will trigger retry #$(( $${BUILDKITE_RETRY_COUNT:-0} + 1 ))..."
      fi
      exit 1
    # - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

steps:
  - group: "Build Docker Images"
    key: "build_docker"
    steps:
      - label: ":docker: Build and Push Base Image (tpu6e)"
        key: "build_docker_tpu6e"
        <<: *docker_build_template
        env:
          BM_INFRA: "true"
          TPU_VERSION: "tpu6e"

      - label: ":docker: Build and Push Base Image (tpu7x)"
        key: "build_docker_tpu7x"
        <<: *docker_build_template
        env:
          BM_INFRA: "true"
          TPU_VERSION: "tpu7x"
