# 1P1D disaggregated serving, as one workload admitted against fleet quota.
#
# The launcher supplies name, namespace, queue and image: ${WORKLOAD_NAME} and
# ${IMAGE} are substituted before submission, and a literal dollar is $$.
#
# A workload is admitted against one queue and a queue is one shape, so both
# engines ask for the same one. Together they are eight chips - the whole v7x
# reservation - so this runs alone.
#
# Every container is named `workload`: that is the name the launcher forwards
# step environment into and reads logs from.
#
# No privileged or init containers: PodSecurity `baseline` on the workload
# namespace refuses them.

apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  annotations:
    # Gives every pod below that asks for chips the fleet's caches - /dev/shm,
    # the compilation cache and the model cache, sized for the host it lands
    # on - and the gcsfuse settings that go with them. A pod can still declare
    # a volume of its own; this only adds what it did not.
    tpu-ci.google.com/volumes: standard
spec:
  # Gives each pod a DNS name of its own - <jobset>-<role>-<job>-<pod> under a
  # headless service named for the JobSet - which is how the client finds the
  # engines without a Service to select them.
  network:
    enableDNSHostnames: true
  # The engines serve until told to stop, so the client finishing is what
  # finishes the run; JobSet then tears the engines down.
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - benchmark
  # Long enough for the launcher's last log poll after the client exits.
  ttlSecondsAfterFinished: 300
  replicatedJobs:
    # ---------------------------------------------------------
    # PREFILL ENGINE
    # ---------------------------------------------------------
    - name: prefill
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          # Eleven hours, not the fleet's three-hour default: bring-up of a 480B
          # model on both engines plus the sweep below. A longer
          # DISAGG_CONCURRENCIES list loses its last cells to this.
          activeDeadlineSeconds: 39600
          # Indexed because enableDNSHostnames requires it: the pod index is
          # half of the hostname.
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              annotations:
                # The node looks idle to OPTIMIZE_UTILIZATION, which would
                # consolidate a benchmark that holds it for hours away.
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            spec:
              restartPolicy: Never
              serviceAccountName: tpu-workload
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              tolerations:
                - key: "google.com/tpu"
                  operator: "Equal"
                  value: "present"
                  effect: "NoSchedule"
              containers:
              - name: workload
                image: ${IMAGE}
                command: [ "/bin/bash", "-c", "--" ]
                args:
                  - |
                    set -e
                    # Worker core dumps are several GiB each and overflow the
                    # ephemeral-storage limit; the backtrace in the log is the
                    # useful artifact.
                    ulimit -c 0
                    # What the connector advertises to its peer; stated so a
                    # node with a second interface cannot change which IP.
                    export VLLM_HOST_IP="$${POD_IP}"
                    exec vllm serve \
                      --seed=42 \
                      --model=Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 \
                      --max-model-len=10240 \
                      --max-num-batched-tokens=8192 \
                      --max-num-seqs=512 \
                      --no-enable-prefix-caching \
                      --tensor-parallel-size=8 \
                      --kv-cache-dtype=fp8 \
                      --gpu-memory-utilization=0.70 \
                      --async-scheduling \
                      --enable-expert-parallel \
                      --kv-transfer-config '{"kv_connector":"TPUConnector","kv_connector_module_path":"tpu_inference.distributed.tpu_connector","kv_role":"kv_producer"}'
                # The bound on bring-up. A readiness probe cannot supply one -
                # it never restarts anything - so without this an engine stuck
                # in TPU init is indistinguishable from one still loading and
                # holds its chips until the JobSet's deadline. An hour covers a
                # cold compile with nothing in the fleet's XLA cache.
                startupProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  failureThreshold: 120
                # What the dependsOn clauses below wait on: ready means the
                # server answers, not that the container has started.
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                # HF_TOKEN is not here: the launcher forwards it from Secret
                # Manager, so no copy sits in the namespace between runs.
                - name: HF_HOME
                  value: /cache/hf
                - name: VLLM_LOGGING_LEVEL
                  value: "DEBUG"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: JAX_PLATFORMS
                  value: "tpu,cpu"
                - name: TPU_BACKEND_TYPE
                  value: jax
                - name: PJRT_DEVICE
                  value: TPU
                - name: USE_MOE_EP_KERNEL
                  value: "0"
                - name: MODEL_IMPL_TYPE
                  value: "vllm"
                - name: USE_BATCHED_RPA_KERNEL
                  value: "0"
                # Declared empty to opt out of JobSet's TPU webhook, which
                # injects a MegaScale topology whenever a JobSet has more than
                # one TPU-requesting replicatedJob. libtpu would then read
                # num_slices=2 and block forever in "MegaScale Topology
                # Discovery ... Missing hosts"; these are two independent
                # single-host engines, not two slices of one program. The
                # webhook only adds names the container has not set.
                - name: MEGASCALE_NUM_SLICES
                  value: ""
                - name: MEGASCALE_SLICE_ID
                  value: ""
                - name: MEGASCALE_COORDINATOR_ADDRESS
                  value: ""
                - name: MEGASCALE_PORT
                  value: ""
                - name: TPU_WORKER_ID
                  value: "0"
                - name: TPU_WORKER_HOSTNAMES
                  value: ""
                - name: TPU_PROCESS_ADDRESSES
                  value: ""
                - name: TPU_PROCESS_PORT
                  value: ""
                # Both caches onto the mounted compilation bucket, so a cold
                # compile is paid once rather than per run. VLLM_CACHE_ROOT
                # otherwise defaults under $$HOME, on the node's boot disk,
                # which it does not fit on.
                - name: VLLM_XLA_CACHE_PATH
                  value: "/cache/jax/xla"
                - name: VLLM_CACHE_ROOT
                  value: "/cache/jax/vllm"
                ports:
                - containerPort: 8000
                # No cpu or memory limit on purpose: nothing else lands on this
                # node, and a number here only invites an OOM kill as the model
                # grows. ephemeral-storage must stay well under the node's
                # 43.8Gi allocatable, which it shares with the gcsfuse sidecars.
                resources:
                  limits:
                    google.com/tpu: "4"
                    ephemeral-storage: "20Gi"
                  requests:
                    google.com/tpu: "4"
                    cpu: "180"
                    memory: "700Gi"
                    ephemeral-storage: "20Gi"

    # ---------------------------------------------------------
    # DECODE ENGINE
    # ---------------------------------------------------------
    # Identical to prefill but for the two flags that make it the consumer: it
    # holds the KV cache for the whole generation rather than one prefill, so it
    # is given the memory the prefill engine leaves spare.
    - name: decode
      # Must not start beside prefill: both populate the same Hugging Face cache,
      # and the lock HF takes around a download is a real lock only on a local
      # disk - on the gcsfuse mount it is an ordinary object, so the two race in
      # the model directory and one reads a file whose inode was replaced
      # underneath it (Errno 116, Stale file handle).
      #
      # Ready, not Complete: an engine serves until told to stop, so Complete
      # never arrives.
      dependsOn:
        - name: prefill
          status: Ready
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 39600
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              annotations:
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            spec:
              restartPolicy: Never
              serviceAccountName: tpu-workload
              nodeSelector:
                cloud.google.com/gke-tpu-topology: 2x2x1
                cloud.google.com/gke-tpu-accelerator: tpu7x
              tolerations:
                - key: "google.com/tpu"
                  operator: "Equal"
                  value: "present"
                  effect: "NoSchedule"
              containers:
              - name: workload
                image: ${IMAGE}
                command: [ "/bin/bash", "-c", "--" ]
                args:
                  - |
                    set -e
                    ulimit -c 0
                    export VLLM_HOST_IP="$${POD_IP}"
                    exec vllm serve \
                      --seed=42 \
                      --model=Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8 \
                      --max-model-len=10240 \
                      --max-num-batched-tokens=8192 \
                      --max-num-seqs=512 \
                      --no-enable-prefix-caching \
                      --tensor-parallel-size=8 \
                      --kv-cache-dtype=fp8 \
                      --gpu-memory-utilization=0.90 \
                      --async-scheduling \
                      --enable-expert-parallel \
                      --kv-transfer-config '{"kv_connector":"TPUConnector","kv_connector_module_path":"tpu_inference.distributed.tpu_connector","kv_role":"kv_consumer"}'
                # As on prefill: the bound on bring-up.
                startupProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  failureThreshold: 120
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                env:
                - name: POD_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.podIP
                - name: HF_HOME
                  value: /cache/hf
                - name: VLLM_LOGGING_LEVEL
                  value: "DEBUG"
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: JAX_PLATFORMS
                  value: "tpu,cpu"
                - name: TPU_BACKEND_TYPE
                  value: jax
                - name: PJRT_DEVICE
                  value: TPU
                - name: USE_MOE_EP_KERNEL
                  value: "0"
                - name: MODEL_IMPL_TYPE
                  value: "vllm"
                - name: USE_BATCHED_RPA_KERNEL
                  value: "0"
                # Declared empty to opt out of JobSet's TPU webhook, which
                # injects a MegaScale topology whenever a JobSet has more than
                # one TPU-requesting replicatedJob. libtpu would then read
                # num_slices=2 and block forever in "MegaScale Topology
                # Discovery ... Missing hosts"; these are two independent
                # single-host engines, not two slices of one program. The
                # webhook only adds names the container has not set.
                - name: MEGASCALE_NUM_SLICES
                  value: ""
                - name: MEGASCALE_SLICE_ID
                  value: ""
                - name: MEGASCALE_COORDINATOR_ADDRESS
                  value: ""
                - name: MEGASCALE_PORT
                  value: ""
                - name: TPU_WORKER_ID
                  value: "0"
                - name: TPU_WORKER_HOSTNAMES
                  value: ""
                - name: TPU_PROCESS_ADDRESSES
                  value: ""
                - name: TPU_PROCESS_PORT
                  value: ""
                - name: VLLM_XLA_CACHE_PATH
                  value: "/cache/jax/xla"
                - name: VLLM_CACHE_ROOT
                  value: "/cache/jax/vllm"
                ports:
                - containerPort: 8000
                # As on prefill: ephemeral-storage must stay well under the
                # node's 43.8Gi allocatable, shared with the gcsfuse sidecars.
                resources:
                  limits:
                    google.com/tpu: "4"
                    ephemeral-storage: "20Gi"
                  requests:
                    google.com/tpu: "4"
                    cpu: "180"
                    memory: "700Gi"
                    ephemeral-storage: "20Gi"

    # ---------------------------------------------------------
    # PROXY & BENCHMARK CLIENT
    # ---------------------------------------------------------
    # No accelerator and no cache mounts: this is an HTTP client that reads a
    # tokenizer and writes JSON. Only google.com/tpu is under quota, so it
    # rides along free.
    - name: benchmark
      # Both engines, not just decode: what this role needs is that both answer
      # /health, and inheriting that from decode's own dependency is how a
      # later reordering breaks it silently.
      dependsOn:
        - name: prefill
          status: Ready
        - name: decode
          status: Ready
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          activeDeadlineSeconds: 39600
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              annotations:
                # This node genuinely is nearly idle, and consolidating it away
                # takes the sweep and both engines' hours with it.
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            spec:
              restartPolicy: Never
              serviceAccountName: tpu-workload
              # Keeps this role off a TPU node, where it would spend four chips
              # on a Python process. The class provisions a node sized to the
              # requests below for the life of the run.
              nodeSelector:
                cloud.google.com/compute-class: worker-cpu
              containers:
              - name: workload
                image: ${IMAGE}
                env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                command: ["/bin/bash", "-c"]
                args:
                  - |
                    set -e

                    # JobSet's per-pod DNS, substituted by the launcher and
                    # unique to this run.
                    prefill_host=${WORKLOAD_NAME}-prefill-0-0.${WORKLOAD_NAME}
                    decode_host=${WORKLOAD_NAME}-decode-0-0.${WORKLOAD_NAME}

                    # Every result leaves this pod through this binary, so prove
                    # it works before spending eleven hours and the whole v7x
                    # reservation producing results it cannot deliver. A real
                    # upload, because a version check would clear a missing
                    # binary and still leave a rejected token or an unreachable
                    # endpoint to be found at the end.
                    echo "${WORKLOAD_NAME} $$(date -u +%FT%TZ)" > /tmp/disagg-preflight.txt
                    if ! (cd /tmp && buildkite-agent artifact upload disagg-preflight.txt); then
                      echo "ERROR: this pod cannot publish artifacts; the benchmark's results would be lost."
                      exit 1
                    fi

                    echo "Starting proxy server..."
                    python3 examples/disagg/toy_proxy_server.py \
                      --host 0.0.0.0 \
                      --port 10000 \
                      --prefiller-host "$$prefill_host" \
                      --prefiller-port 8000 \
                      --decoder-host "$$decode_host" \
                      --decoder-port 8000 &
                    proxy_pid=$$!

                    # The proxy is backgrounded, so its death cannot fail the
                    # script by itself; unchecked it surfaces hours later as a
                    # benchmark whose requests all failed.
                    require_proxy() {
                      kill -0 "$$proxy_pid" 2>/dev/null && return 0
                      echo "ERROR: the proxy (pid $$proxy_pid) exited; nothing can reach the engines."
                      exit 1
                    }

                    echo "Waiting for prefill ($$prefill_host) and decode ($$decode_host) servers..."
                    # -f so an error status is not read as healthy, and -m so a
                    # hung connection cannot stretch an iteration past the ten
                    # seconds this count assumes.
                    health_tries=0
                    until curl -fsS -m 10 "http://$$prefill_host:8000/health" && curl -fsS -m 10 "http://$$decode_host:8000/health"; do
                      require_proxy
                      health_tries=$$((health_tries+1))
                      if [ "$$health_tries" -gt 1080 ]; then
                        echo "ERROR: servers not healthy after 3h; failing the benchmark."
                        exit 1
                      fi
                      echo "Waiting for prefill and decode health checks..."
                      sleep 10
                    done

                    echo "Both prefill and decode servers are HEALTHY!"

                    mkdir -p /tmp/benchmark_results
                    model="Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8"
                    publish_failed=0

                    # The pod is deleted the moment the JobSet finishes, so
                    # anything that is to outlive the run has to leave from
                    # here, while it is still alive.
                    publish_result() {
                      local path=$$1
                      [ -f "$$path" ] || return 0
                      local name
                      name=$$(basename "$$path")

                      (cd "$$(dirname "$$path")" && buildkite-agent artifact upload "$$name") \
                        || { echo "WARNING: could not upload $$name"; publish_failed=1; }

                      # A cell with failed requests describes a broken serving
                      # path, not a measurement; stop rather than spend the
                      # remaining hours on the same breakage. The result is
                      # single-line JSON with one top-level "failed", so a grep
                      # is enough.
                      if grep -q -E '"failed": *[1-9]' "$$path"; then
                        echo "ERROR: $$name recorded failed requests: $$(grep -oE '"(completed|failed)": *[0-9]+' "$$path" | tr '\n' ' ')"
                        exit 1
                      fi
                    }

                    # Two names per sweep: a cell writes its own file and is
                    # then appended to the file for the whole input shape, which
                    # is what the result parser reads.
                    #
                    # Publishing is per cell so that a sweep cut short by the
                    # deadline still yields the cells that finished, each under
                    # a name written once and never superseded. c<C>_i<I>_o<O>
                    # is the convention the bare-metal lane publishes under.
                    run_sweep() {
                      local input_len=$$1 output_len=$$2 num_prompts=$$3
                      local combined="/tmp/benchmark_results/$${input_len}_$${output_len}.json"

                      # A cell's wall clock falls as concurrency rises, so a
                      # longer list costs disproportionately more of the v7x
                      # reservation. Set DISAGG_CONCURRENCIES on the build to
                      # vary it - c=1 is the single-stream latency baseline.
                      for concurrency in $${DISAGG_CONCURRENCIES:-16 32 64 256}; do
                        # Fewer prompts at low concurrency: at c=1 the sweep is
                        # serial, and 256 requests of 8192 output tokens each
                        # would be most of the run.
                        local effective=$$num_prompts
                        if [ "$$concurrency" -eq 1 ]; then
                          effective=32
                        elif [ "$$concurrency" -eq 4 ]; then
                          effective=64
                        fi

                        local cell="/tmp/benchmark_results/pd_disagg_c$${concurrency}_i$${input_len}_o$${output_len}.json"

                        echo "Starting benchmark cell: c=$$concurrency, i=$$input_len, o=$$output_len, n=$$effective"
                        vllm bench serve \
                          --model="$$model" \
                          --dataset-name=random \
                          --num-warmups 10 \
                          --random-input-len="$$input_len" \
                          --random-output-len="$$output_len" \
                          --num-prompts="$$effective" \
                          --ignore-eos \
                          --host=localhost \
                          --port=10000 \
                          --max-concurrency="$$concurrency" \
                          --request-rate=inf \
                          --metric-percentiles 90,99 \
                          --append-result \
                          --result-file="$$cell"

                        publish_result "$$cell"

                        # Built here rather than by pointing --append-result at
                        # it, because a cell has to be a file of its own to be
                        # published as one.
                        cat "$$cell" >> "$$combined"
                        sleep 30
                      done
                    }

                    run_sweep 1024 8192 256
                    run_sweep 8192 1024 256

                    echo "Benchmark complete! Results saved in /tmp/benchmark_results."

                    # Everything once more, to pick up any file whose upload
                    # failed the first time; Buildkite keys an artifact by path
                    # and takes the newest, so a repeat is harmless.
                    (cd /tmp/benchmark_results && buildkite-agent artifact upload "*.json") \
                      || echo "WARNING: final result upload failed"

                    if [ "$$publish_failed" -ne 0 ]; then
                      echo "ERROR: the benchmark completed but at least one result was not published."
                      exit 1
                    fi
                resources:
                  requests:
                    cpu: "6"
                    memory: "16Gi"
                    ephemeral-storage: "20Gi"
                  limits:
                    cpu: "14"
                    memory: "48Gi"
                    ephemeral-storage: "20Gi"
