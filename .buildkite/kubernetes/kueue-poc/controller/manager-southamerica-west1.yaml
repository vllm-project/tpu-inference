# First-manager POC resources for ci-test-controller with one worker.
apiVersion: v1
kind: Namespace
metadata:
  name: buildkite
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueCluster
metadata:
  name: ci-test-southamerica-west1-worker
spec:
  clusterSource:
    kubeConfig:
      locationType: Secret
      location: ci-test-southamerica-west1-worker-kubeconfig
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: MultiKueueConfig
metadata:
  name: v6e-workers
spec:
  clusters:
    - ci-test-southamerica-west1-worker
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: multikueue-dispatch
spec:
  controllerName: kueue.x-k8s.io/multikueue
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: MultiKueueConfig
    name: v6e-workers
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default
spec:
  nodeLabels: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: v6e-1
spec:
  nodeLabels:
    cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
    cloud.google.com/gke-tpu-topology: 1x1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: v6e-8
spec:
  nodeLabels:
    cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
    cloud.google.com/gke-tpu-topology: 2x4
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: v6e-1
spec:
  cohortName: v6e-pool
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: buildkite
  admissionChecksStrategy:
    admissionChecks:
      - name: multikueue-dispatch
  resourceGroups:
    - coveredResources:
        - google.com/tpu
        - cpu
        - memory
        - ephemeral-storage
      flavors:
        - name: v6e-1
          resources:
            - name: google.com/tpu
              nominalQuota: 8
            - name: cpu
              nominalQuota: 1000
            - name: memory
              nominalQuota: 1000Gi
            - name: ephemeral-storage
              nominalQuota: 10000Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: v6e-8
spec:
  cohortName: v6e-pool
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: buildkite
  admissionChecksStrategy:
    admissionChecks:
      - name: multikueue-dispatch
  resourceGroups:
    - coveredResources:
        - google.com/tpu
        - cpu
        - memory
        - ephemeral-storage
      flavors:
        - name: v6e-8
          resources:
            - name: google.com/tpu
              nominalQuota: 8
            - name: cpu
              nominalQuota: 1000
            - name: memory
              nominalQuota: 1000Gi
            - name: ephemeral-storage
              nominalQuota: 10000Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: v6e-1
  namespace: buildkite
spec:
  clusterQueue: v6e-1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: v6e-8
  namespace: buildkite
spec:
  clusterQueue: v6e-8
