        .buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/core/test_dp_group_sampling_prefix_cache.py::TestGroupSamplingPrefixCache::test_group_sampling_produces_diverse_outputs

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record correctness test result for group_sampling_prefix_cache"
