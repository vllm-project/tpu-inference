# The P/D disaggregation benchmark on the Kueue fleet, uploaded by bootstrap.sh
# into kube nightly builds. Its engines run on an image of their own, from
# benchmark.Dockerfile, built here once per build.
#
# WORKLOAD_IMAGE is set on each step rather than for the file: this is uploaded
# into a build alongside other files, and both steps read the same tag. One
# immutable tag per build, because imagePullPolicy defaults to IfNotPresent, so
# a reused tag can benchmark another build's push.
# The commands read it as $$WORKLOAD_IMAGE, at run time: the upload interpolates
# a bare $WORKLOAD_IMAGE before any step's env exists, and leaves the tag empty.
x-disagg-image: &disagg_image "us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/tpu-inference-ci/disagg-benchmark:kube-${BUILDKITE_BUILD_NUMBER}"

steps:
  - label: ":docker: Build Disagg Benchmark Image"
    key: "build_kube_disagg_image"
    # Not a build input: a step without depends_on would also wait on
    # nightly_verify.yml's wait above it, until every suite had finished.
    depends_on: "build_docker_tpu7x"
    agents:
      queue: cpu_64_core
    env:
      WORKLOAD_IMAGE: *disagg_image
    commands:
      - gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      # --pull: the base tag is republished daily, and a copy cached on this
      # agent would silently measure an older nightly.
      - docker build --pull -f .buildkite/kubernetes/benchmark.Dockerfile -t "$$WORKLOAD_IMAGE" .buildkite/kubernetes
      - docker push "$$WORKLOAD_IMAGE"

  - label: ":kubernetes: :tpu: Kube P/D Disaggregated Benchmark"
    key: "kube_pd_disagg_benchmark"
    depends_on: "build_kube_disagg_image"
    # Mostly queue time: both engines together are the whole v7x reservation,
    # so this waits out everything else on the fleet before it starts.
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      WORKLOAD_IMAGE: *disagg_image
      # Names the cache namespace the engines share with the single-host steps;
      # disagg_engine.sh refuses to start without it.
      TPU_VERSION: "tpu7x"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      # --env names the variables the launcher forwards into the pods. HF_TOKEN
      # is not in this step's environment: naming it is what makes the launcher
      # fetch it from Secret Manager.
      - >-
        /opt/launcher/launch
        --manifest .buildkite/kubernetes/manifests/workloads/qwen3-coder-480b-1p1d.yaml
        --env TPU_VERSION
        --env DISAGG_CONCURRENCIES
