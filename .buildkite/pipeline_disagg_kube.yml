# P/D disaggregation on the Kueue fleet. Deliberately unscheduled and triggered
# by hand: it shares a reservation with the nightly that measures the same
# benchmark, so the two must not run at once.

env:
  # Named by build number, not by commit: the image is the published nightly
  # plus a binary, so the checkout does not determine its contents. Immutable
  # because the tag is read twice - an overlapping build's push would decide
  # what the first one benchmarks, and a pod landing on a node that already
  # holds the tag would not pull at all, since imagePullPolicy defaults to
  # IfNotPresent for anything but :latest.
  WORKLOAD_IMAGE: "us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/tpu-inference-ci/disagg-benchmark:kube-${BUILDKITE_BUILD_NUMBER}"

steps:
  - label: ":docker: Build Disagg Benchmark Image"
    key: "build_kube_disagg_image"
    agents:
      queue: cpu_64_core
    commands:
      - gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      # --pull, because the tag it is built from is republished daily and a
      # cached copy on this agent would silently measure an older nightly.
      - docker build --pull -f .buildkite/kubernetes/benchmark.Dockerfile -t "$WORKLOAD_IMAGE" .buildkite/kubernetes
      - docker push "$WORKLOAD_IMAGE"

  - label: ":kubernetes: :tpu: Kube P/D Disaggregated Benchmark"
    key: "kube_pd_disagg_benchmark"
    depends_on: "build_kube_disagg_image"
    # Eleven hours for the workload and the rest for it to reach the chips:
    # both engines together are the whole v7x reservation, so this waits out
    # everything else on the fleet before it starts, and a day is what the
    # launcher allows that wait to be.
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      # The launcher owns everything that follows from the hardware - the queue,
      # the namespace, the workload name, the cache volumes - so the step passes
      # a manifest and the names of the variables to forward into it. HF_TOKEN
      # is not one the step has: the launcher reads it from Secret Manager, and
      # naming it here is what asks for it.
      - >-
        /opt/launcher/launch
        --manifest .buildkite/kubernetes/manifests/workloads/qwen3-coder-480b-1p1d.yaml
        --env HF_TOKEN
        --env DISAGG_CONCURRENCIES
        --env BUILDKITE_COMMIT
        --env BUILDKITE_AGENT_ACCESS_TOKEN
        --env BUILDKITE_JOB_ID
        --env BUILDKITE_BUILD_ID
