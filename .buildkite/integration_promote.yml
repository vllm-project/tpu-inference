steps:
  # This file is uploaded before pipeline_integration_gate.yml (Buildkite
  # inserts uploads in reverse order), so `gate_check` is not a resolvable
  # depends_on target yet. The bare wait is equivalent in effect: every gated
  # step soft-fails, gate_check is the one step that hard-fails, and a hard
  # failure is what holds the wait and leaves promote_lkg unrun.
  - wait: ~
  # -----------------------------------------------------------------
  # Checkin LKG
  # -----------------------------------------------------------------
  - label: "Promote to Last Known Good (LKG)"
    key: "promote_lkg"
    agents:
      queue: "cpu"
    commands:
      - |
        VLLM_LKG_HASH=$(buildkite-agent meta-data get "VLLM_COMMIT_HASH")
        bash .buildkite/scripts/update_lkg_version.sh "$$VLLM_LKG_HASH"
        buildkite-agent annotate ":white_check_mark: LKG Updated: $$VLLM_LKG_HASH" --style "success"