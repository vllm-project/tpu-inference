# Dev pipeline: tpu7x-32 smoke test — every host prints jax.devices() and
# one psum runs across all 32 devices. DEV_PIPELINE_FILE=.buildkite/pipeline_dev_smoke.yml

steps:
  - label: "tpu7x-32 smoke: jax.devices() on every host"
    key: tpu7x_32_smoke
    timeout_in_minutes: 60
    env:
      TPU_VERSION: "tpu7x"
      BENCH_SCRIPT: "tests/e2e/tpu_smoke.py"
      BENCH_SCRIPT_ARGS: ""
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - bash .buildkite/scripts/run_allreduce_jax.sh
