  # ---- Speculative_Decoding-_DFlash ----

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Correctness tests for Speculative Decoding: DFlash"
    key: "${TPU_VERSION:-tpu6e}_Speculative_Decoding-_DFlash_CorrectnessTest"
    depends_on: "build_docker_kube"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: *shape_single
      TPU_VERSION: "${TPU_VERSION:-tpu6e}"
    plugins:
      - *kube_plugin
    commands:
      - |
        if [ "${MODEL_IMPL_TYPE:-auto}" = "vllm" ]; then
          echo "DFlash on the vllm (torchax) path is not integrated yet:" \
               "DFlashTorchaxProposer is not wired into the runner and the" \
               "generic torchax draft step does not match the vLLM DFlash" \
