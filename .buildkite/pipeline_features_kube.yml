# The feature-matrix suites on the Kueue fleet: every TPU step under
# features/ that a v6e shape can run. Step keys match the bare-metal files' so
# the lanes read side by side.
#
# features/multi-host.yml is not here: its two steps are fixed to
# tpu_v7x_16_queue, and a two-host v7x slice is not a v6e shape. Five more files
# have no TPU step to migrate at all - their work sits on cpu behind a TODO.
#
# Chips, topology, Kueue queue, caches and deadlines come from the cluster-side
# profile registry in ci-infra; a step names only a shape and a command.
#
# Everything uploads as one file because build_docker_kube's key is not
# parameterised: two uploads into the same build collide on it.
#
# Do not add a pipeline-level `env:` block: a name set there wins over one
# passed to `bk build create --env` and could no longer be overridden per
# build.

x-shape-single: &shape_single "${KUBE_SHAPE_SINGLE:-ct6e-standard-1t/1x1}"
x-shape-multi: &shape_multi "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"

# Carries the launcher and the service account that may submit a workload.
# Repeated per step rather than merged in, because a step's `plugins:` is a list
# and a YAML merge key would replace it wholesale.
x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher

# The timeout covers queueing for chips as well as running, so it is sized to
# the fleet's worst case; a hung test is bounded by activeDeadlineSeconds.
.tpu_step: &tpu_step
  depends_on: "build_docker_kube"
  timeout_in_minutes: 1440
  agents:
    queue: "kube"
  plugins:
    - *kube_plugin

steps:
  # Publishes the tag it pushed as `ci-image` metadata, which run.sh reads back.
  # Exits early when the build names its own image; Buildkite treats a
  # satisfied-but-skipped dependency as met, so the TPU steps still run.
  - label: ":docker: Build and push CI image"
    key: "build_docker_kube"
    timeout_in_minutes: 90
    agents:
      queue: "cpu_64_core"
    env:
      TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      # This pipeline and pipeline_build.yml write the same tag for the same
      # commit, so their build args must match or whichever pushes second
      # replaces the image with one missing google-cloud-cli.
      BM_INFRA: "true"
    commands:
      - |
        if [[ -n "$${CI_IMAGE:-}" ]]; then
          buildkite-agent meta-data set ci-image "$$CI_IMAGE"
          exit 0
        fi
        # setup_docker_env.sh refuses to build without VLLM_COMMIT_HASH, and
        # bootstrap.sh - which sets it for the pipelines it uploads - is not in
        # the path of this one.
        source .buildkite/scripts/configs/pipeline_config.sh
        VLLM_COMMIT_HASH="$${VLLM_COMMIT_HASH:-$$(get_vllm_commit_hash)}"
        buildkite-agent meta-data set "VLLM_COMMIT_HASH" "$$VLLM_COMMIT_HASH"
        source .buildkite/scripts/setup_docker_env.sh
        setup_environment "vllm-tpu" "false" "true"
        buildkite-agent meta-data set ci-image "$$EXPORTED_CI_CACHE_IMAGE"

  # The bare-metal files mark every test soft_fail so the record step after it
  # is still reached. That is not needed here: allow_failure on the record
  # step's own dependency reaches it just the same, and `buildkite-agent step
  # get outcome` reports hard_failed where it used to report soft_failed, which
  # record_step_result.sh already treats alike. The build goes red either way -
  # the recorder exits non-zero on anything but a pass - but the test itself now
  # reads as failed rather than tolerated, which is the question this lane asks.
  #
  # Eight chips, because the offload tests shard across a whole node.
  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Correctness tests for KV Cache Offload"
    key: "${TPU_VERSION:-tpu6e}KV_Cache_Offload_CorrectnessTest"
    env:
      SHAPE: *shape_multi
      TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      USE_V6E8_QUEUE: "True"
    <<: *tpu_step
    commands:
      - .buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/offload/tpu_offload_accuracy_test.py

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record correctness test result for KV Cache Offload"
    key: "${TPU_VERSION:-tpu6e}record_KV_Cache_Offload_CorrectnessTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}KV_Cache_Offload_CorrectnessTest"
        allow_failure: true
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "KV Cache Offload"
      CI_STAGE: "CorrectnessTest"
      CI_CATEGORY: "feature support matrix"
    agents:
      queue: "kube"
    plugins:
      - *kube_plugin
    commands:
      - .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}KV_Cache_Offload_CorrectnessTest

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Performance tests for KV Cache Offload"
    key: "${TPU_VERSION:-tpu6e}KV_Cache_Offload_PerformanceTest"
    env:
      SHAPE: *shape_multi
      TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      USE_V6E8_QUEUE: "True"
    depends_on:
      - "build_docker_kube"
      - "${TPU_VERSION:-tpu6e}record_KV_Cache_Offload_CorrectnessTest"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - .buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/offload/tpu_offload_performance_test.py

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record performance test result for KV Cache Offload"
    key: "${TPU_VERSION:-tpu6e}record_KV_Cache_Offload_PerformanceTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}KV_Cache_Offload_PerformanceTest"
        allow_failure: true
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "KV Cache Offload"
      CI_STAGE: "PerformanceTest"
      CI_CATEGORY: "feature support matrix"
    agents:
      queue: "kube"
