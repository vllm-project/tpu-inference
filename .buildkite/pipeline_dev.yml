# Dev pipeline: ICI collective microbenchmark on tpu7x-32 (2x2x4 chips).
# Measures per-axis collective latency (D2D, size-2 ICI dims, size-4 chain)
# to characterize mesh-vs-torus behavior of sub-cube slices.

steps:

  - label: "tpu7x-32 ICI collective microbenchmark (2x2x4)"
    key: tpu7x_32_ici_bench
    timeout_in_minutes: 150
    env:
      TPU_VERSION: "tpu7x"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - bash .buildkite/scripts/run_ici_bench.sh
