# Read-only occupancy probe for the v7x-32 pod.
#
# Runs directly on the agent (no Docker) so it can see host processes: a
# container without --pid=host would only see its own namespace and would
# report an idle pod even when the host is busy.
#
# The probe never imports jax/libtpu and never opens a TPU device, so it
# cannot disturb a workload that is running or starting up.

steps:
  - label: ":mag: tpu7x-32 occupancy probe (read-only)"
    key: tpu7x_32_occupancy_probe
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - python3 .buildkite/scripts/tpu_occupancy_probe.py
