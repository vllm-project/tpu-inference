# Dev pipeline: validate the v0.33.0 fix for the Gemma 4 MM encoder JIT
# (encoder capture axes) on the torchax path (MODEL_IMPL_TYPE=vllm).

steps:
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x [dev] MM encoder JIT manager unit tests"
    key: tpu7x_dev_mm_jit_unit
    depends_on: tpu7x_build_docker
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          bash -c 'python3 -m pytest -s -v /workspace/tpu_inference/tests/runner/test_mm_encoder_jit_manager.py'

  # Mirrors tpu7x_google_gemma-4-26B-A4B-it_Benchmark
  # (models/google_gemma-4-26B-A4B-it.yml) for MODEL_IMPL_TYPE=vllm, without
  # soft_fail.
  - label: "tpu7x [dev] Performance benchmarks for google/gemma-4-26B-A4B-it (vllm)"
    key: tpu7x_dev_gemma4_26b_bench
    depends_on: tpu7x_build_docker
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "vllm"
      TEST_MODEL: google/gemma-4-26B-A4B-it
      TENSOR_PARALLEL_SIZE: 8
      MINIMUM_THROUGHPUT_THRESHOLD: 1.55
      GPU_MEMORY_UTILIZATION: "0.90"
      COMPILATION_CONFIG: '{"cudagraph_mm_encoder": true}'
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c 'TIMEOUT_SECONDS=2400 BLOCK_SIZE=256 USE_BATCHED_RPA_KERNEL=1 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'

  # Mirrors tpu7x_google_gemma-4-31B-it_Benchmark
  # (models/google_gemma-4-31B-it.yml) for MODEL_IMPL_TYPE=vllm, without
  # soft_fail.
  - label: "tpu7x [dev] Performance benchmarks for google/gemma-4-31B-it (vllm)"
    key: tpu7x_dev_gemma4_31b_bench
    depends_on: tpu7x_build_docker
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "vllm"
      TEST_MODEL: google/gemma-4-31B-it
      TENSOR_PARALLEL_SIZE: 8
      MINIMUM_THROUGHPUT_THRESHOLD: 1.35
      GPU_MEMORY_UTILIZATION: "0.90"
      COMPILATION_CONFIG: '{"cudagraph_mm_encoder": true}'
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c 'TIMEOUT_SECONDS=2400 BLOCK_SIZE=256 USE_BATCHED_RPA_KERNEL=1 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'
