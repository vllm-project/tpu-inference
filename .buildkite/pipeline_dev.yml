# DEV ONLY: read-only disk triage for the v7x-32 pod. Build 814 died with
# "no space left on device" during the head-node docker build, and
# run_multihost.sh's own `docker system prune -a --volumes -f` reclaimed
# 0 B -- so the consumer is outside docker. This step only MEASURES;
# deletions come after, targeted at what it finds.
steps:
  - label: "tpu7x-32 disk triage (read-only) — why did 814 run out of space"
    key: tpu7x_disk_triage
    timeout_in_minutes: 30
    env:
      TPU_VERSION: "tpu7x"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - bash tests/e2e/multihost/pod_disk_triage.sh
