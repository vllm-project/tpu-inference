# Dev pipeline: verify the rotated HF token on specific CI agents.
# In-job checks print only a sha256 prefix of the token and HTTP codes.

steps:
  - label: "hf-token in-job check tpu7x-2-ci-11"
    key: hf_check_v7x2_11
    agents:
      queue: tpu_v7x_2_queue
      hostname: tpu7x-2-ci-11-cicd-us-central1-c
    commands:
      - bash .buildkite/scripts/hf_token_check.sh

  - label: "hf-token in-job check tpu7x-8-ci-17"
    key: hf_check_v7x8_17
    agents:
      queue: tpu_v7x_8_queue
      hostname: tpu7x-8-ci-17-cicd-us-central1-c
    commands:
      - bash .buildkite/scripts/hf_token_check.sh

  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x-8-ci-17 (cold cache) accuracy meta-llama/Llama-3.1-8B-Instruct"
    key: hf_accuracy_v7x8_17
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_8_queue
      hostname: tpu7x-8-ci-17-cicd-us-central1-c
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      TEST_MODEL: meta-llama/Llama-3.1-8B-Instruct
      TENSOR_PARALLEL_SIZE: "8"
      MINIMUM_ACCURACY_THRESHOLD: "0.70"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh
