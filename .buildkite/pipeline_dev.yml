# Dev pipeline for tpu-inference-dev.
# Demo/sample steps showing how to run custom tests on tpu7x.
# Copy and adapt any step for your own experiments.
#
# HOW TO TRIGGER THIS PIPELINE
# ─────────────────────────────
# Option A — Buildkite UI:
#   Go to https://buildkite.com/tpu-commons/tpu-inference-dev
#   Click "New Build", set branch to your branch, click "Create Build".
#
# Option B — Buildkite API (requires BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ─────────────────
# 1. On your branch, edit this file — use any demo step below as a starting point.
# 2. Change the command, model, env vars, or queue as needed.
# 3. Trigger the pipeline — only your branch's file is used.

steps:

  # -----------------------------------------------------------------
  # Build Step (required by all demo steps below)
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  # -----------------------------------------------------------------
  # KV pool warmup reserve: the Kimi-K3 depth slice at the utilization
  # that used to OOM.
  #
  # gs://.../k3-sliced is the released Kimi-K3 checkpoint with only its
  # first 8 decoder layers kept. Every kept tensor is the original bytes
  # and the config keeps every K3-only feature the full model has:
  # MXFP4-packed experts with their scales, fp32 KDA tensors, the
  # LatentMoE projections, the q-LoRA MLA layers, the noaux_tc router
  # over 896 experts, and the compressed-tensors quantization config.
  # This step exercises the LOAD and SERVE path, not output quality --
  # 8 of 93 layers is not a language model, hence --allow-incoherent.
  #
  # This configuration is deliberately the one that failed. At
  # GPU_MEMORY_UTILIZATION 0.8 with no --num-gpu-blocks-override, the
  # pool took 404.09 of 404.11 GiB and warmup died with
  # `HLO temporaries (100.50G) exceeds available HBM (94.74G)`; the
  # same config at 0.6 served. The only change here is that the pool
  # now leaves KV_CACHE_WARMUP_RESERVE_FRACTION of the post-weight
  # budget free, so serving at 0.8 without a hand-pinned block count is
  # the pass condition. The [precompile-mem] lines report XLA's actual
  # per-shape temp/out/alias budget either way.
  #
  # --max-num-batched-tokens 2048 is carried over from the passing run
  # so utilization is the only variable that moved.
  # -----------------------------------------------------------------
  - label: "tpu7x K3 slice, util 0.8, warmup reserve on"
    key: tpu7x_k3_slice_warmup_reserve
    depends_on: tpu7x_build_docker
    timeout_in_minutes: 120
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "flax_nnx"
      NEW_MODEL_DESIGN: "1"
      MODEL: "gs://tpu-commons-ci/moonshootai/kimi/k3-sliced"
      TENSOR_PARALLEL_SIZE: "8"
      MAX_MODEL_LEN: "2048"
      MAX_NUM_SEQS: "16"
      GPU_MEMORY_UTILIZATION: "0.8"
      STARTUP_TIMEOUT_SECONDS: "3600"
      EXTRA_SERVE_FLAGS: >-
        --trust-remote-code
        --no-async-scheduling
        --load-format=runai_streamer
        --no-enable-prefix-caching
        --max-num-batched-tokens 2048
        --additional-config
        {"sharding":{"sharding_strategy":{"tensor_parallelism":1,"expert_parallelism":8,"enable_dp_attention":true}}}
      PROBE_EXTRA_FLAGS: "--allow-incoherent"
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/.buildkite/scripts/run_serving_probe.sh
