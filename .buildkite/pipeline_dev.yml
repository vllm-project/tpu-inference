steps:
  - label: "pip freeze of rebuilt image"
    key: pip_freeze_today
    agents:
      queue: cpu_64_core
    commands:
      - |
        IMG="us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/tpu-inference-ci/vllm-tpu:f9a898c7822c8aa9fd1968c4c5b8ddcedb75e77a-98e4726a147f37666e1e9adc468e673b32373e21-tpu6e"
        docker pull -q "$$IMG"
        echo "PIP_FREEZE_BEGIN"
        docker run --rm --entrypoint pip "$$IMG" list --format=freeze
        echo "PIP_FREEZE_END"
