steps:
  - label: ":docker: Build base image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x Correctness for mistralai/Mistral-Small-4-119B-2603/text-only"
    key: tpu7x_mistral_correctness
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      TEST_MODEL: mistralai/Mistral-Small-4-119B-2603
      TENSOR_PARALLEL_SIZE: "8"
      MINIMUM_ACCURACY_THRESHOLD: "0"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'python3 /workspace/tpu_inference/tests/e2e/mistral_small_4_correctness.py'
