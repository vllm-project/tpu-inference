steps:

  - label: ":docker: Build base image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  # -----------------------------------------------------------------
  # DEV ONLY — gsm8k-collapse bisect probes on the CI software stack
  # (jax 0.11 / libtpu 0.0.44, the pod's runtime). Everything here
  # passed on the local jax 0.10.2 rig; this build checks the CI
  # stack for version-specific divergence:
  #   1. Chunked ragged_conv1d oracle vs a direct causal conv at the
  #      production per-device widths (incl. 1- and 2-token remainder
  #      chunks with state continuation).
  #   2. KDA/conv unit suites.
  #   3. Sliced-K3 gsm8k-shape consistency probe at pod topology
  #      (chunked ~1k prompts, concurrency 8 vs sequential).
  #   4. Weight-integrity fingerprint of the sharded streamer load,
  #      default vs concurrency=64 — over the GCS transport, which
  #      the local rig (disk cache) cannot exercise.
  # -----------------------------------------------------------------
  - label: "tpu7x gsm8k-collapse bisect probes (CI stack)"
    key: tpu7x_gsmbisect
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: flax_nnx
      NEW_MODEL_DESIGN: "1"
      SKIP_JAX_PRECOMPILE: "1"
      VLLM_XLA_CHECK_RECOMPILATION: "0"
      TPU_INFERENCE_UNSAFE_MLA_WITHOUT_DP_ATTENTION: "1"
      KV_CACHE_WARMUP_RESERVE_FRACTION: "0"
      MXFP4_SHARD_THEN_DECODE: "1"
    timeout_in_minutes: 110
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
        set -e
        export MODEL_IMPL_TYPE=flax_nnx NEW_MODEL_DESIGN=1
        export VLLM_XLA_CHECK_RECOMPILATION=0
        export TPU_INFERENCE_UNSAFE_MLA_WITHOUT_DP_ATTENTION=1
        export KV_CACHE_WARMUP_RESERVE_FRACTION=0
        export MXFP4_SHARD_THEN_DECODE=1
        export SKIP_JAX_PRECOMPILE=1
        cd /workspace/tpu_inference
        echo "=== [1/4] conv chunk oracle, production widths ==="
        for DIM in 384 1536 6144 12288; do
          ORACLE_TPU=1 ORACLE_DIM=$$DIM python tools/dev_bisect/conv_chunk_oracle.py | grep RESULT
        done
        echo "=== [2/4] KDA/conv suites ==="
        python -m pytest tests/kernels/kda_reference_test.py tests/layers/common/test_ragged_conv1d.py -q
        echo "=== [3/4] gsm8k-shape consistency probe (pod topology) ==="
        SKIP_JAX_PRECOMPILE=0 PROBE_TAG=ci_779stack python tools/dev_bisect/k3_gsm8k_shape_probe.py
        echo "=== [4/4] streamer fingerprint, GCS transport, conc default vs 64 ==="
        SKIP_JAX_PRECOMPILE=0 python tools/dev_bisect/k3_streamer_conc_check.py | grep streamer-check | tee /tmp/fp_default.txt
        SKIP_JAX_PRECOMPILE=0 PROBE_STREAMER_CONC=64 python tools/dev_bisect/k3_streamer_conc_check.py | grep streamer-check | tee /tmp/fp_conc64.txt
        echo "=== fingerprint diff (empty means identical) ==="
        diff <(sed "s/concdefault/CONC/" /tmp/fp_default.txt) <(sed "s/conc64/CONC/" /tmp/fp_conc64.txt) && echo "FINGERPRINTS IDENTICAL"
        '
