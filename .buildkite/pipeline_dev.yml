steps:

  - label: ":docker: Build base image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  # DEV ONLY — validates the attempt-13i instrumentation on the CI stack
  # before the pod slot is spent: wrong-answer dump script (unit fixture),
  # a served slice at pod topology, the HTTP teacher-forced scoring probe,
  # and the CHURN_TRACE step logging.
  - label: "tpu7x attempt-13i instrumentation validation"
    key: tpu7x_13i_validation
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
    timeout_in_minutes: 90
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/tools/dev_bisect/validate_13i.sh
