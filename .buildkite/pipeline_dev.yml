# Dev pipeline: verify the deferred fused_moe_rs import fixes the
# dp_attention sharding latch (test_eagle3_correctness[True-True] OOM).
# Mirrors the tpu7x "E2E speculative decoding test" CI job.

steps:
  - label: ":docker: Build base image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x E2E speculative decoding test (latch fix)"
    key: tpu7x_spec_decoding_latch_fix
    depends_on: tpu7x_build_docker
    timeout_in_minutes: 180
    agents:
      queue: tpu_v7x_2_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
    commands:
      - |
          export BVT_ONLY=1
          .buildkite/scripts/run_in_docker.sh \
            bash -c 'python3 -m pytest -s -v -x /workspace/tpu_inference/tests/e2e/test_speculative_decoding.py'
