# Dev pipeline for tpu-inference-dev.
#
# HOW TO TRIGGER THIS PIPELINE
# ─────────────────────────────
# Option A — Buildkite UI:
#   Go to https://buildkite.com/tpu-commons/tpu-inference-dev
#   Click "New Build", set branch to your branch, click "Create Build".
#
# Option B — Buildkite API (requires BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"

steps:

  # -----------------------------------------------------------------
  # DEV ONLY (carries the env-gated platform-check downgrade).
  # Kimi-K3 attempt 13f: the cond-fix branch with the pool UNPINNED, on
  # 4 hosts, DP attention OFF, experts split expert=4 x model=8 = 32.
  #
  # Deltas vs attempt 13d (which served pinned at 256 blocks):
  #   * Code base is cuiq-k3-condfix: static decode_only_bucket dispatch
  #     removes the lax.cond state-pool copies, the packing bound is
  #     capped at T + 64*min(num_seqs, T), and the ragged_conv1d
  #     boundary fixup is a gather+mask (correctness fix). 13a/b/c died
  #     in backbone precompile at 118.09G temporaries with the pool
  #     unpinned; both temp families were slot-count-driven, which is
  #     what these commits remove.
  #   * NO --num-gpu-blocks-override: the pool sizes itself at util 0.8.
  #     At --max-num-seqs 64 the per-rank request count stays well under
  #     the ~128/rank knee where per-request fp32 state staging grows to
  #     pool scale, so the compile should fit.
  #   * gsm8k here is the post-conv-fix accuracy number (the 0.976 from
  #     attempt 12b was measured with the conv scatter bug present).
  #   * bench phases unchanged from 13d for comparability: full gsm8k
  #     (210-min cap), BS=1 8k/1k, then the 2x2 matrix {1k/1k, 8k/1k}
  #     x {conc 8/32 prompts, conc 64/128 prompts}, each capped 60 min.
  # -----------------------------------------------------------------
  - label: "tpu7x multi-host (4 hosts) Kimi-K3 attempt 13f: cond fix + pod fix (out_shardings + per-device sizing) + unpinned pool"
    key: tpu7x_k3_attempt13f
    timeout_in_minutes: 420
    env:
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "flax_nnx"
      NEW_MODEL_DESIGN: "1"
      TPU_INFERENCE_UNSAFE_MLA_WITHOUT_DP_ATTENTION: "1"
      # The CI image sets this to 1, which makes any compile at request time
      # fatal. This run serves request shapes the warmup sweep does not
      # cover; allow the compile.
      VLLM_XLA_CHECK_RECOMPILATION: "0"
      # Streaming the checkpoint dominates startup. With the sharded read
      # each host pulls ~0.4 TB instead of 1.45 TB, but keep attempt 12's
      # four-hour health wait so a regression fails with worker-side logs
      # rather than a launcher timeout.
      SERVE_STARTUP_TIMEOUT_SECONDS: "14400"
      # Shard-then-decode MXFP4 (default on, named to self-describe) is
      # also a hard requirement of the sharded expert streaming below.
      MXFP4_SHARD_THEN_DECODE: "1"
      K3_SHARDED_EXPERT_STREAMING: "1"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/moonshootai/kimi/k3 \
            --port 8000 \
            --tensor-parallel-size 32 \
            --trust-remote-code \
            --max-model-len 10240 \
            --max-num-seqs 64 \
            --max-num-batched-tokens 512 \
            --no-async-scheduling \
            --load-format=runai_streamer \
            --no-enable-prefix-caching \
            --gpu-memory-utilization 0.8 \
            --additional-config '{\"enable_continue_decode\":true,\"sharding\":{\"sharding_strategy\":{\"enable_dp_attention\":false,\"tensor_parallelism\":8,\"expert_parallelism\":4}}}'" \
          "python3 /workspace/tpu_inference/tests/e2e/multihost/serving_probe.py \
            --concurrency 4 \
            --long-tokens 256 \
            --needle-tokens 8000 \
          && bash /workspace/tpu_inference/tests/e2e/multihost/k3_acc_bench.sh --full-gsm8k --bs1-bench --matrix-bench"
