# Dev pipeline for tpu-inference-dev.
#
# HOW TO TRIGGER THIS PIPELINE
# ─────────────────────────────
# Option A — Buildkite UI:
#   Go to https://buildkite.com/tpu-commons/tpu-inference-dev
#   Click "New Build", set branch to your branch, click "Create Build".
#
# Option B — Buildkite API (requires BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"

steps:

  # -----------------------------------------------------------------
  # Build Step (feeds the merge gate below)
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  # -----------------------------------------------------------------
  # Merge gate for K3_SHARDED_EXPERT_STREAMING (single host).
  #
  # gs://.../k3-sliced is the released Kimi-K3 checkpoint with only its
  # first 8 decoder layers kept -- original bytes, 96 shard files, and
  # every K3-only load-path feature (MXFP4-packed experts with scales,
  # fp32 KDA tensors, q-LoRA MLA, the 896-expert router, the
  # compressed-tensors quantization config). The tiny random-weight
  # fixtures are NOT servable (single-file checkpoint without tokenizer
  # or index), so the slice is the smallest real end-to-end model.
  #
  # The gate serves it twice through the runai streamer -- flag OFF then
  # flag ON -- with fixed greedy prompts. One host addresses all eight
  # devices, so the needed-expert set is every expert and the filtered
  # read must be a no-op: the [sharded-stream] log line must report
  # kept == total tensors and 0.0 GiB skipped, and the two rounds'
  # completions must be byte-identical. Serve config (tp=1 x ep=8, DP
  # attention on, util 0.6, batched-tokens 2048, NO block override) is
  # verbatim the slice step that passed WITHOUT the KV warmup reserve --
  # this branch does not carry the reserve commit, and at util 0.8 the
  # KV pool leaves too little headroom for warmup's compile temporaries
  # (HLO temporaries 100.50G vs 94.74G available), while the identical
  # config at 0.6 served. Keeping the pre-reserve values makes the
  # streaming flag the only variable under test.
  #
  # Timeout covers TWO full serves of the ~126 GB slice: streaming
  # dominates each round (the second round reuses the persistent JAX
  # compile cache).
  # -----------------------------------------------------------------
  - label: "tpu7x K3 slice: sharded-stream flag no-op merge gate"
    key: tpu7x_k3_sharded_stream_gate
    depends_on: tpu7x_build_docker
    timeout_in_minutes: 150
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "flax_nnx"
      NEW_MODEL_DESIGN: "1"
      MODEL: "gs://tpu-commons-ci/moonshootai/kimi/k3-sliced"
      TENSOR_PARALLEL_SIZE: "8"
      MAX_MODEL_LEN: "2048"
      MAX_NUM_SEQS: "16"
      GPU_MEMORY_UTILIZATION: "0.6"
      STARTUP_TIMEOUT_SECONDS: "3600"
      EXTRA_SERVE_FLAGS: >-
        --trust-remote-code
        --no-async-scheduling
        --load-format=runai_streamer
        --no-enable-prefix-caching
        --max-num-batched-tokens 2048
        --additional-config
        {"sharding":{"sharding_strategy":{"tensor_parallelism":1,"expert_parallelism":8,"enable_dp_attention":true}}}
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/.buildkite/scripts/run_sharded_stream_gate.sh
