# Runs the vllm-torchtpu multi-host slice probe on the tpu7x-32 pod.
#
# It lives here, not on vllm-torchtpu-dev, because that pipeline's repository
# is git@github.com:... and the multi-host agents have no ssh key authorized
# for it -- checkout fails before any command runs. This pipeline's repository
# is https, which works on the same agent, so the step clones vllm-torchtpu
# over https itself. That clone succeeding is also the evidence that pointing
# vllm-torchtpu-dev at the https URL is all that pipeline needs.
#
# The probe is read-only: it never imports jax/torch_tpu and never opens a TPU
# device, so it cannot disturb anything else on the pod.

steps:
  - label: ":mag: tt multi-host slice probe on tpu7x-32 (read-only)"
    key: tt_multihost_probe
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - rm -rf /tmp/tt-probe
      - git clone --depth 1 --branch cuiq-tt-multihost https://github.com/vllm-project/vllm-torchtpu.git /tmp/tt-probe
      - python3 /tmp/tt-probe/.buildkite/scripts/multihost_probe.py
