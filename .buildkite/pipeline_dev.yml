# Dev pipeline for tpu-inference-dev.
# Demo/sample steps showing how to run custom tests on tpu7x.
# Copy and adapt any step for your own experiments.
#
# HOW TO TRIGGER THIS PIPELINE
# ─────────────────────────────
# Option A — Buildkite UI:
#   Go to https://buildkite.com/tpu-commons/tpu-inference-dev
#   Click "New Build", set branch to your branch, click "Create Build".
#
# Option B — Buildkite API (requires BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ─────────────────
# 1. On your branch, edit this file — use any demo step below as a starting point.
# 2. Change the command, model, env vars, or queue as needed.
# 3. Trigger the pipeline — only your branch's file is used.

steps:

  # -----------------------------------------------------------------
  # DEV ONLY. Kimi-Linear-48B on 4 hosts with DP attention OFF and the
  # routed experts split over BOTH axes (expert=4 x model=8 = 32).
  #
  # Purpose: the 48B has known-good behaviour on this rig (build 719,
  # DP attention on, all probes green) AND answers the probe's semantic
  # questions, so it can show whether MLA is CORRECT without DP attention
  # -- which the truncated K3 slice cannot. TPU_INFERENCE_UNSAFE_MLA_WITH
  # OUT_DP_ATTENTION downgrades the platform check to a warning.
  #
  # 48B dims at this split: moe_intermediate 1024/8 = 128 (a multiple of
  # 128, so block-quantization-safe), 32 attention heads / 8 = 4.
  #
  # The KV pool is pinned SMALL on purpose. With DP attention off the
  # attention KV is sharded on BATCH = data x attn_dp x attn_dp_expert = 1,
  # i.e. replicated on every device, so each block costs 32x what it does
  # with DP attention on. 2048 blocks put warmup at 96.07 GB against 94.74
  # available (build 742) even though the weights are only 4.32 GB/device.
  # 512 blocks is ~209k tokens, far more than 8 concurrent x 2048.
  # -----------------------------------------------------------------
  - label: "tpu7x multi-host (4 hosts) 48B, MLA without DP attention"
    key: tpu7x_48b_mla_nodp
    timeout_in_minutes: 90
    env:
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "flax_nnx"
      NEW_MODEL_DESIGN: "1"
      TPU_INFERENCE_UNSAFE_MLA_WITHOUT_DP_ATTENTION: "1"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/moonshootai/kimi/linear-48b \
            --port 8000 \
            --tensor-parallel-size 32 \
            --trust-remote-code \
            --max-model-len 2048 \
            --max-num-seqs 32 \
            --max-num-batched-tokens 2048 \
            --num-gpu-blocks-override 512 \
            --no-async-scheduling \
            --load-format=runai_streamer \
            --no-enable-prefix-caching \
            --gpu-memory-utilization 0.6 \
            --additional-config '{\"sharding\":{\"sharding_strategy\":{\"enable_dp_attention\":false,\"tensor_parallelism\":8,\"expert_parallelism\":4}}}'" \
          "python3 /workspace/tpu_inference/tests/e2e/multihost/serving_probe.py \
            --concurrency 8 \
            --long-tokens 512"
