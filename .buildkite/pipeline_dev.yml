# Dev pipeline for tpu-inference-dev.
# Demo/sample steps showing how to run custom tests on tpu7x.
# Copy and adapt any step for your own experiments.
#
# HOW TO TRIGGER THIS PIPELINE
# ─────────────────────────────
# Option A — Buildkite UI:
#   Go to https://buildkite.com/tpu-commons/tpu-inference-dev
#   Click "New Build", set branch to your branch, click "Create Build".
#
# Option B — Buildkite API (requires BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ─────────────────
# 1. On your branch, edit this file — use any demo step below as a starting point.
# 2. Change the command, model, env vars, or queue as needed.
# 3. Trigger the pipeline — only your branch's file is used.

steps:

  # -----------------------------------------------------------------
  # DEV ONLY (carries the env-gated platform-check downgrade).
  # Kimi-K3 on 4 hosts, DP attention OFF, routed experts split over both
  # axes: expert=4 x model=8 = 32 ways, ~59 GB/device of weights.
  #
  # Weights are now 67.16 GB/device (was 126.38): the KDA parameters are
  # head-sharded on ATTN_HEAD = model(8) x expert(4) = 32, giving 3 of the
  # 96 heads per device. That is what makes 32 devices viable at all --
  # build 747 exhausted HBM at layer 73 of 93 with them replicated.
  #
  # Two memory terms are pinned small on purpose, because with DP
  # attention off BATCH = data x attn_dp x attn_dp_expert = 1, so both
  # the attention KV pool AND the attention activations replicate per
  # device instead of splitting:
  #   * --num-gpu-blocks-override 64 -- the pool. K3's MLA latent KV is
  #     ~3.93 MB/page over 24 layers, so 512 blocks is ~2 GB/device.
  #   * --max-num-batched-tokens 512 -- the program. Builds 741/742 died
  #     on compiled-program size (58.89 GiB and 96.07 G) with tiny weight
  #     footprints, and program size tracks the token budget, so start
  #     low and raise it once it serves.
  # K3 dims at this split: moe_intermediate 3072/8 = 384 and
  # routed_expert_hidden 3584/8 = 448, both multiples of 128, so the
  # block-quantized expert path is safe.
  # -----------------------------------------------------------------
  # ATTEMPT 12 deltas vs the attempt-11 recipe that served (dev 759/760):
  #   * --max-model-len 2048 -> 10240: the 8k-in/1k-out bench and the 8000-
  #     token needle probe need it.
  #   * --num-gpu-blocks-override 64 -> 256: 64 blocks (~26k tokens) holds
  #     ~2-3 concurrent 9k-token requests, so a 32-prompt bench would run
  #     near-serial. 256 holds 8 full 10k requests. Warmup-memory estimate by
  #     linear scaling of attempt 10's failure (100.04 G at 512 blocks):
  #     ~81 G at 256 vs 94.74 available. Fallback ladder on OOM: 128, then 64.
  #   * probe adds --needle-tokens 8000 (long-context retrieval correctness;
  #     also absorbs the first 8k-shape request-time compile so the bench
  #     measures a warmed server).
  #   * after probes: k3_acc_bench.sh = gsm8k --limit 250 (90-min cap) then
  #     vllm bench serve 8192/1024 x 32 prompts (60-min cap), each under its
  #     own `timeout` so a hang fails fast.
  - label: "tpu7x multi-host (4 hosts) Kimi-K3 attempt 12: needle + gsm8k + 8k/1k bench"
    key: tpu7x_k3_nodp
    timeout_in_minutes: 420
    env:
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "flax_nnx"
      NEW_MODEL_DESIGN: "1"
      TPU_INFERENCE_UNSAFE_MLA_WITHOUT_DP_ATTENTION: "1"
      # The CI image sets this to 1, which makes any compile at request time
      # fatal. Builds 743 and 744 both reached a healthy server and then died
      # the moment a probe request arrived -- 744 with "JAX compilation
      # occurred but was forbidden", 743 with an IPC timeout that is the same
      # event seen from the other side. Allow the compile here; a slow first
      # request is the point of a bring-up run.
      VLLM_XLA_CHECK_RECOMPILATION: "0"
      # Build 745 reached layer 59 of 93 in two hours and was still loading
      # when a worker actor died; the MXFP4 decode runs per layer on the host
      # and dominates. Give the health wait four hours, and take the
      # instrumented run_multihost.sh so the next failure says what happened
      # on the WORKER rather than only on the head.
      SERVE_STARTUP_TIMEOUT_SECONDS: "14400"
      # Shard-then-decode: ~15x faster MXFP4 decode (4-5 s/layer vs 60-65),
      # measured A/B on the slice rig in build 748. Default is already on;
      # named here so the run is self-describing.
      MXFP4_SHARD_THEN_DECODE: "1"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/moonshootai/kimi/k3 \
            --port 8000 \
            --tensor-parallel-size 32 \
            --trust-remote-code \
            --max-model-len 10240 \
            --max-num-seqs 8 \
            --max-num-batched-tokens 512 \
            --num-gpu-blocks-override 256 \
            --no-async-scheduling \
            --load-format=runai_streamer \
            --no-enable-prefix-caching \
            --gpu-memory-utilization 0.8 \
            --additional-config '{\"sharding\":{\"sharding_strategy\":{\"enable_dp_attention\":false,\"tensor_parallelism\":8,\"expert_parallelism\":4}}}'" \
          "python3 /workspace/tpu_inference/tests/e2e/multihost/serving_probe.py \
            --concurrency 4 \
            --long-tokens 256 \
            --needle-tokens 8000 \
          && bash /workspace/tpu_inference/tests/e2e/multihost/k3_acc_bench.sh --skip-bench --full-gsm8k"
