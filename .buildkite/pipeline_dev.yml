steps:
  - label: "tpu7x-32 queue smoke: host + TPU visibility"
    key: tpu7x32_smoke
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - hostname
      - echo "--- accel devices on this host:"
      - ls /dev/vfio /dev/accel* 2>/dev/null || true
      - echo "--- chip count via PCI:"
      - lspci 2>/dev/null | grep -ci "google" || true
      - echo "--- worker env:"
      - env | grep -E "TPU|WORKER" || true
      - echo "--- docker available:"
      - docker --version
      - echo "--- disk:"
      - df -h / /mnt/disks/persist 2>/dev/null || df -h /
