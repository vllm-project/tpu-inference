steps:
  - label: "tpu7x-16 disk probe (host {{matrix}})"
    key: tpu7x16_disk_probe
    agents:
      queue: tpu_v7x_16_queue
    matrix: ["a","b","c"]
    commands:
      - hostname
      - df -h / /mnt/disks/persist 2>&1 || true
      - ls /mnt/disks/persist 2>&1 | head -5 || true
      - echo "--- docker root:"
      - docker info 2>/dev/null | grep -i "docker root" || true
