# Dev pipeline for tpu-inference-dev.
# Demo/sample steps showing how to run custom tests on tpu7x.
# Copy and adapt any step for your own experiments.
#
# HOW TO TRIGGER THIS PIPELINE
# ─────────────────────────────
# Option A — Buildkite UI:
#   Go to https://buildkite.com/tpu-commons/tpu-inference-dev
#   Click "New Build", set branch to your branch, click "Create Build".
#
# Option B — Buildkite API (requires BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ─────────────────
# 1. On your branch, edit this file — use any demo step below as a starting point.
# 2. Change the command, model, env vars, or queue as needed.
# 3. Trigger the pipeline — only your branch's file is used.

steps:

  # -----------------------------------------------------------------
  # Build Step (required by all demo steps below)
  # -----------------------------------------------------------------
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  # -----------------------------------------------------------------
  # Kimi-K3 depth slice on ONE host (8 devices).
  #
  # gs://.../k3-sliced is the released Kimi-K3 checkpoint with only its
  # first 8 decoder layers kept (tools/slice_kimi_k3_checkpoint.py). Every
  # kept tensor is the original bytes and the config keeps every K3-only
  # feature the full model has: MXFP4-packed experts with their uint8
  # scales, fp32 KDA tensors, the LatentMoE projections, the q-LoRA MLA
  # layers (1-indexed full_attn_layers [4, 8]), the situ activation, the
  # noaux_tc router over 896 experts, the attention-residual sites, the
  # multimodal language_model./vision_tower. packaging, and the
  # compressed-tensors quantization config. 117 GiB over 11 shards, so it
  # fits on one host where the 1.56 TB original needs four.
  #
  # What this step tests is the LOAD and SERVE path: layout, shapes,
  # dtypes, quantization metadata, sharding, state isolation. It does NOT
  # test output quality -- 8 of 93 layers is not a language model, and its
  # text is meaningless by construction, which is why the probe runs with
  # --allow-incoherent (structural invariants still enforced, text-quality
  # assertions off).
  #
  # Sharding mirrors the full-model 4-host step so a failure here is the
  # same failure there: expert_parallelism = device count (896 routed
  # experts divide evenly), tensor_parallelism 1, dp-attention on for MLA.
  # -----------------------------------------------------------------
  - label: "tpu7x Kimi-K3 slice, composed E2xF4 mesh, no dp-attention"
    key: tpu7x_kimi_k3_sliced_8
    depends_on: tpu7x_build_docker
    timeout_in_minutes: 120
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "flax_nnx"
      NEW_MODEL_DESIGN: "1"
      MODEL: "gs://tpu-commons-ci/moonshootai/kimi/k3-sliced"
      TENSOR_PARALLEL_SIZE: "8"
      MAX_MODEL_LEN: "2048"
      MAX_NUM_SEQS: "16"
      GPU_MEMORY_UTILIZATION: "0.6"
      STARTUP_TIMEOUT_SECONDS: "3600"
      # DEV-ONLY: MLA without DP attention is refused by
      # TPUPlatform.check_and_update_config. That check is the only place the
      # requirement is asserted, and it rules out the composed mesh below.
      TPU_INFERENCE_UNSAFE_MLA_WITHOUT_DP_ATTENTION: "1"
      # --max-num-batched-tokens is load-bearing here, not a tuning nicety.
      # Left at its default the warmup sweep compiles token buckets up to
      # 16384 even though max-model-len is 2048, and one device holds
      # 896/8 = 112 routed experts (against 28 at the full model's
      # expert_parallelism 32), so the MoE temporaries for the large
      # buckets exceed a single chip's HBM before any request is served.
      EXTRA_SERVE_FLAGS: >-
        --trust-remote-code
        --no-async-scheduling
        --load-format=runai_streamer
        --no-enable-prefix-caching
        --max-num-batched-tokens 2048
        --num-gpu-blocks-override 2048
        --additional-config
        {"sharding":{"sharding_strategy":{"tensor_parallelism":4,"expert_parallelism":2,"enable_dp_attention":false}}}
      PROBE_EXTRA_FLAGS: "--allow-incoherent"
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/.buildkite/scripts/run_serving_probe.sh
