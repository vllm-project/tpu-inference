steps:
  - label: ":docker: Build base image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x Accuracy (gsm8k) Kimi-Linear-48B-A3B-Instruct"
    key: tpu7x_kimi48b_accuracy
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_8_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      NEW_MODEL_DESIGN: "1"
      TEST_MODEL: moonshotai/Kimi-Linear-48B-A3B-Instruct
      TENSOR_PARALLEL_SIZE: "8"
      MINIMUM_ACCURACY_THRESHOLD: "0.85"
      ACCURACY_MODEL_ARGS_JSON: '{"pretrained":"moonshotai/Kimi-Linear-48B-A3B-Instruct","tensor_parallel_size":8,"max_model_len":2048,"max_num_seqs":64,"gpu_memory_utilization":0.6,"trust_remote_code":true,"additional_config":{"sharding":{"sharding_strategy":{"tensor_parallelism":1,"expert_parallelism":8,"enable_dp_attention":true}}}}'
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          bash -c 'pip install -q blobfile && bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh'

  - label: "tpu7x Perf baseline Kimi-Linear-48B-A3B-Instruct"
    key: tpu7x_kimi48b_benchmark
    depends_on: tpu7x_kimi48b_accuracy
    agents:
      queue: tpu_v7x_8_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      NEW_MODEL_DESIGN: "1"
      TEST_MODEL: moonshotai/Kimi-Linear-48B-A3B-Instruct
      TENSOR_PARALLEL_SIZE: "8"
      MINIMUM_THROUGHPUT_THRESHOLD: "0.1"
      INPUT_LEN: "1800"
      OUTPUT_LEN: "128"
      PREFIX_LEN: "0"
      MAX_MODEL_LEN: "2048"
      MAX_NUM_SEQS: "64"
      MAX_NUM_BATCHED_TOKENS: "1024"
      CLIENT_TRUST_REMOTE_CODE: "1"
      EXTRA_SERVE_FLAGS: '--trust-remote-code --gpu-memory-utilization 0.60 --additional-config {"sharding":{"sharding_strategy":{"tensor_parallelism":1,"expert_parallelism":8,"enable_dp_attention":true}}}'
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          bash -c 'pip install -q blobfile && bash /workspace/tpu_inference/tests/e2e/benchmarking/benchmark.sh'
