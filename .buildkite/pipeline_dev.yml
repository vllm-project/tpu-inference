# Verify the compress_and_store SMEM fix: kernel unit tests + the exact
# nightly DSv4-Flash MMLU config that hits the SMEM overflow.
steps:
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x compress_and_store kernel tests"
    key: tpu7x_compress_store_tests
    depends_on: tpu7x_build_docker
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - .buildkite/scripts/run_in_docker.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/kernels/deepseek_v4/compress_store_test.py

  - label: "tpu7x DSv4-Flash MMLU (nightly test_37 config)"
    key: tpu7x_dsv4_mmlu
    depends_on: tpu7x_build_docker
    env:
      USE_PREBUILT_IMAGE: "1"
      NEW_MODEL_DESIGN: "1"
      SKIP_ACCURACY_TESTS: "False"
      VLLM_MLA_DISABLE: "0"
      MOE_REQUANTIZE_BLOCK_SIZE: "512"
      MOE_REQUANTIZE_WEIGHT_DTYPE: "fp4"
      MODEL_IMPL_TYPE: "vllm"
      TPU_VERSION: "tpu7x"
    agents:
      queue: tpu_v7x_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/mmlu.sh -m  "gs://tpu-commons-ci/deepseek-v4-flash" -n 14042 -l 4
