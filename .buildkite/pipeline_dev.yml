# Dev pipeline: final verification of the Qwen2.5-VL torchax mm-encoder fix.

steps:
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: ":docker: Build and Push Base Image (tpu6e)"
    key: tpu6e_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu6e"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x vllm-path Qwen2.5-VL-7B mm perf (cudagraph_mm_encoder)"
    key: tpu7x_qwen25vl_perf
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_2_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "vllm"
      TEST_MODEL: Qwen/Qwen2.5-VL-7B-Instruct
      MINIMUM_THROUGHPUT_THRESHOLD: 0.76
      COMPILATION_CONFIG: '{"cudagraph_mm_encoder": true}'
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh

  - label: "tpu6e vllm-path Qwen2.5-VL-7B mm perf (cudagraph_mm_encoder)"
    key: tpu6e_qwen25vl_perf
    depends_on: tpu6e_build_docker
    agents:
      queue: tpu_v6e_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
      MODEL_IMPL_TYPE: "vllm"
      TEST_MODEL: Qwen/Qwen2.5-VL-7B-Instruct
      MINIMUM_THROUGHPUT_THRESHOLD: 0.76
      COMPILATION_CONFIG: '{"cudagraph_mm_encoder": true}'
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh

  - label: "tpu7x jax-path Qwen2.5-VL-7B mm perf (auto impl, flag present)"
    key: tpu7x_qwen25vl_perf_jax
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_2_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      TEST_MODEL: Qwen/Qwen2.5-VL-7B-Instruct
      MINIMUM_THROUGHPUT_THRESHOLD: 0.76
      COMPILATION_CONFIG: '{"cudagraph_mm_encoder": true}'
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh

  - label: "tpu7x vllm-path Qwen2.5-VL-7B accuracy (gsm8k)"
    key: tpu7x_qwen25vl_acc
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_2_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "vllm"
      TEST_MODEL: Qwen/Qwen2.5-VL-7B-Instruct
      TENSOR_PARALLEL_SIZE: "2"
      MINIMUM_ACCURACY_THRESHOLD: 0.72
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh

  - label: "tpu7x unit tests: manager + sdpa + attention_interface + jax qwen2_5_vl"
    key: tpu7x_unit_tests
    depends_on: tpu7x_build_docker
    agents:
      queue: tpu_v7x_2_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'python3 -m pytest -s -v -x --durations=10 /workspace/tpu_inference/tests/runner/test_mm_encoder_jit_manager.py /workspace/tpu_inference/tests/layers/vllm/ops/test_scaled_dot_product_attention.py /workspace/tpu_inference/tests/layers/common/test_attention_interface.py /workspace/tpu_inference/tests/models/jax/test_qwen2_5_vl.py'
  - label: "tpu6e unit tests: manager + sdpa + attention_interface + jax qwen2_5_vl"
    key: tpu6e_unit_tests
    depends_on: tpu6e_build_docker
    agents:
      queue: tpu_v6e_queue
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
    commands:
      - .buildkite/scripts/run_in_docker.sh bash -c 'python3 -m pytest -s -v -x --durations=10 /workspace/tpu_inference/tests/runner/test_mm_encoder_jit_manager.py /workspace/tpu_inference/tests/layers/vllm/ops/test_scaled_dot_product_attention.py /workspace/tpu_inference/tests/layers/common/test_attention_interface.py /workspace/tpu_inference/tests/models/jax/test_qwen2_5_vl.py'
