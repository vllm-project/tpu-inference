# Dev pipeline for tpu-inference-dev.
# Demo/sample steps showing how to run custom tests on tpu7x.
# Copy and adapt any step for your own experiments.
#
# HOW TO TRIGGER THIS PIPELINE
# ─────────────────────────────
# Option A — Buildkite UI:
#   Go to https://buildkite.com/tpu-commons/tpu-inference-dev
#   Click "New Build", set branch to your branch, click "Create Build".
#
# Option B — Buildkite API (requires BUILDKITE_API_TOKEN in your env):
#   curl -s -X POST \
#     -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
#     -H "Content-Type: application/json" \
#     "https://api.buildkite.com/v2/organizations/tpu-commons/pipelines/tpu-inference-dev/builds" \
#     -d "{\"commit\": \"$(git rev-parse HEAD)\", \"branch\": \"$(git rev-parse --abbrev-ref HEAD)\", \"message\": \"my test\"}"
#
# HOW TO CUSTOMIZE
# ─────────────────
# 1. On your branch, edit this file — use any demo step below as a starting point.
# 2. Change the command, model, env vars, or queue as needed.
# 3. Trigger the pipeline — only your branch's file is used.

steps:

  # -----------------------------------------------------------------
  # Kimi-Linear-48B-A3B-Instruct across 4 hosts (32 devices) via Ray —
  # the same serve+probe as the 2-host run, retargeted at the new
  # tpu_v7x_32_queue. run_multihost.sh discovers the full worker list
  # from gcloud metadata, so the extra hosts need no step changes.
  #
  # run_multihost.sh builds and pushes the image itself and pulls it on
  # every node, so this step must NOT set USE_PREBUILT_IMAGE or depend on
  # the docker build step (setup_environment would prepend the registry
  # prefix a second time and the image path would be wrong).
  #
  # Weights are streamed straight from GCS by the RunAI streamer, so no
  # node needs a 92 GiB local copy. MODEL_IMPL_TYPE=flax_nnx selects the
  # JAX-native implementation explicitly: 'auto' resolves a
  # runai_streamer load to the vLLM path for any architecture whose JAX
  # class has no WeightLoader attribute, and this one loads through the
  # LoadableWithIterator mixin instead.
  #
  # Sharding: expert_parallelism=32 splits the routed experts one way
  # across all 32 devices, which also puts attention data-parallelism at
  # 32 (dp-attention is required by MLA), i.e. dp groups spanning three
  # host boundaries.
  # -----------------------------------------------------------------
  - label: "tpu7x multi-host (4 hosts) Kimi-Linear-48B-A3B-Instruct"
    key: tpu7x_kimi48b_multihost_32
    timeout_in_minutes: 135
    env:
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "flax_nnx"
      NEW_MODEL_DESIGN: "1"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/moonshootai/kimi/linear-48b \
            --port 8000 \
            --tensor-parallel-size 32 \
            --trust-remote-code \
            --max-model-len 2048 \
            --max-num-seqs 32 \
            --no-async-scheduling \
            --load-format=runai_streamer \
            --no-enable-prefix-caching \
            --gpu-memory-utilization 0.6 \
            --additional-config '{\"sharding\":{\"sharding_strategy\":{\"tensor_parallelism\":1,\"expert_parallelism\":32,\"enable_dp_attention\":true}}}'" \
          "python3 /workspace/tpu_inference/tests/e2e/multihost/serving_probe.py \
            --concurrency 8 \
            --long-tokens 512"
