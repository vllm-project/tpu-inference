# Pipeline to test GKE TPU autoscaling (scale from 0 nodes) and Kueue Cohort Borrowing/Sharing.
# Total Capacity: 10 TPU chips in v6e-cohort (v6e-1 nominalQuota=2, v6e-8 nominalQuota=8).

.kube_common_env: &kube_common_env
  PYTHONUNBUFFERED: "1"
  VLLM_NO_USAGE_STATS: "1"
  TPU_VERSION: "tpu6e"

.kube_kueue_job_metadata_v6e_1: &kube_kueue_job_metadata_v6e_1
  labels:
    kueue.x-k8s.io/queue-name: "v6e-1-1x1"
    kueue.x-k8s.io/max-exec-time-seconds: "10800"

.kube_kueue_job_metadata_v6e_8: &kube_kueue_job_metadata_v6e_8
  labels:
    kueue.x-k8s.io/queue-name: "v6e-8-2x4"
    kueue.x-k8s.io/max-exec-time-seconds: "10800"

.kube_common_tolerations: &kube_common_tolerations
  - key: "google.com/tpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"

.kube_tpu_v6e_1chip_plugin: &kube_tpu_v6e_1chip_plugin
  kubernetes:
    metadata: *kube_kueue_job_metadata_v6e_1
    pendingTimeout: 0
    jobActiveDeadlineSeconds: 10800
    podSpec:
      terminationGracePeriodSeconds: 5
      metadata:
        labels:
          app: "vllm-tpu-runner"
      tolerations: *kube_common_tolerations
      containers:
        - name: vllm-tpu-runner
          image: "debian:bookworm-slim"
          resources:
            limits:
              google.com/tpu: "1"
            requests:
              google.com/tpu: "1"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

.kube_tpu_v6e_8chip_plugin: &kube_tpu_v6e_8chip_plugin
  kubernetes:
    metadata: *kube_kueue_job_metadata_v6e_8
    pendingTimeout: 0
    jobActiveDeadlineSeconds: 10800
    podSpec:
      terminationGracePeriodSeconds: 5
      metadata:
        labels:
          app: "vllm-tpu-runner"
      tolerations: *kube_common_tolerations
      containers:
        - name: vllm-tpu-runner
          image: "debian:bookworm-slim"
          resources:
            limits:
              google.com/tpu: "8"
            requests:
              google.com/tpu: "8"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

steps:
  # Build 1: Spawn 6 concurrent v6e-1 jobs (2 nominal + 4 borrowed from cohort) for 6 minutes (360s)
  - label: ":kubernetes: Borrowing Test | v6e-1 (1 chip) %n"
    key: "v6e_1_loan_jobs"
    if: "build.env('TEST_TYPE') == 'v6e1' || build.env('TEST_TYPE') == null"
    parallelism: 6
    agents:
      queue: "v6e-1-1x1"
    commands:
      - echo "=== v6e-1 Job $$BUILDKITE_PARALLEL_JOB / $$BUILDKITE_PARALLEL_TOTAL acquired TPU chip. Holding for 360 seconds (6 mins) ==="
      - sleep 360
    plugins:
      - <<: *kube_tpu_v6e_1chip_plugin

  # Build 2: Spawn 1 v6e-8 job (needs 8 chips, reclaims cohort capacity after v6e-1 returns them)
  - label: ":kubernetes: Quota Reclaim Test | v6e-8 (8 chips)"
    key: "v6e_8_reclaim_job"
    if: "build.env('TEST_TYPE') == 'v6e8'"
    agents:
      queue: "v6e-8-2x4"
    commands:
      - echo "=== v6e-8 Job acquired 8 chips after cohort release! Holding for 30 seconds ==="
      - sleep 30
    plugins:
      - <<: *kube_tpu_v6e_8chip_plugin
