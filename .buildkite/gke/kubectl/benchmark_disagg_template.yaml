apiVersion: v1
kind: ConfigMap
metadata:
  name: ${JOB_NAME}-scripts
  namespace: default
data:
  patch_ray_placement.py: |
    import glob, re, textwrap

    code_to_insert = r"""
    def _get_node_sort_key(node):
        labels = node.get("Labels", {}) or {}
        tpu_worker_id = labels.get("ray.io/tpu-worker-id")
        if tpu_worker_id is not None:
            try:
                return (0, int(tpu_worker_id))
            except ValueError:
                pass
        hostname = node.get("NodeManagerHostname", "") or ""
        match = re.search(r"-(\d+)$", hostname)
        if match:
            return (1, int(match.group(1)))
        return (2, node.get("NodeManagerAddress") or node.get("NodeName", ""))

    nodes_with_device.sort(key=_get_node_sort_key)
    logger.info(f"RayDistributedExecutorV2 | Sorted nodes: {[(n.get('NodeManagerHostname'), n.get('NodeManagerAddress'), _get_node_sort_key(n)) for n in nodes_with_device]}")
    placement_group_specs = [{device_str: (node["Resources"][device_str] if pp_size == 1 else self.vllm_config.sharding_config.total_devices), f"node:{node.get('NodeManagerAddress') or node.get('NodeName')}": 0.001} for node in nodes_with_device]
    """

    indented_block = textwrap.indent(textwrap.dedent(code_to_insert).strip(), '        ')

    for p in glob.glob('/workspace/**/ray_distributed_executor*.py', recursive=True) + glob.glob('/usr/local/lib/**/ray_distributed_executor*.py', recursive=True):
        try:
            t = open(p).read()
            if '_get_node_sort_key' not in t:
                t = t.replace('import os', 'import os, re')
                t = re.sub(r' +if pp_size == 1:[\s\S]*?placement_group_specs\[0\]\[f"node:\{current_ip\}"\] = 0\.001', lambda m: indented_block, t)
                open(p, 'w').write(t)
                print('Patched Ray placement pinning in:', p)
        except Exception as e:
            print('Patch error:', e)
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOB_NAME}
  namespace: default
  labels:
    kueue.x-k8s.io/priority-class: medium
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true

  # Success policy: When the benchmark client finishes, terminate all pods and succeed!
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - client

  replicatedJobs:
  # ============================================================================
  # 1. PREFILL SLICE (KV Producer)
  # ============================================================================
  - name: p
    replicas: 1  
    template:
      metadata:
        annotations:
          alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
      spec:
        parallelism: ${PREFILL_NUM_VMS}
        completions: ${PREFILL_NUM_VMS}
        backoffLimit: 2
        template:
          metadata:
            labels:
              declared-duration-minutes: "${JOB_DURATION_MINUTES}"
${GCS_FUSE_ANNOTATIONS}
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: ${PREFILL_TOPOLOGY}
              ${PREFILL_PLACEMENT_LINE}
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            initContainers:
            - name: tpu-node-setup
              image: busybox
              command: ["/bin/sh", "-c"]
              args:
              - |
                sysctl -w vm.max_map_count=33554432 || true
                if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                  echo 8000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit || true
                fi
                if [ -f /sys/kernel/mm/transparent_hugepage/enabled ]; then
                  echo always > /sys/kernel/mm/transparent_hugepage/enabled || true
                fi
              securityContext:
                privileged: true
            containers:
            - name: vllm-tpu
              image: ${IMAGE}
              command: ["/bin/bash", "-c"]
              args:
              - |
                set -e
                unset MEGASCALE_NUM_SLICES MEGASCALE_SLICE_ID MEGASCALE_COORDINATOR_ADDRESS MEGASCALE_PORT
                export NUM_WORKERS=${PREFILL_NUM_VMS}
                export TP_SIZE=${PREFILL_TP_SIZE}
                export PORT=${PREFILL_PORT}
                export VLLM_TARGET_DEVICE="tpu"
                export PJRT_DEVICE="TPU"
                export HF_HUB_DISABLE_DISK_LOCK="1"

                # 0. Single-writer download & sync barrier (only for Hugging Face models)
                if [[ "${MODEL_NAME}" != gs://* ]]; then
                  DONE_FILE="/root/.cache/huggingface/.done_${JOB_NAME}"
                  if [[ "$HOSTNAME" =~ -p-0-0(-[a-z0-9]+)?$ ]] || [ "$JOB_COMPLETION_INDEX" = "0" ]; then
                    mkdir -p /tmp/hf_locks
                    mkdir -p /root/.cache/huggingface/hub
                    rm -rf /root/.cache/huggingface/hub/.locks 2>/dev/null || true
                    ln -sfn /tmp/hf_locks /root/.cache/huggingface/hub/.locks 2>/dev/null || true
                    pip install --no-cache-dir hf-transfer 2>/dev/null || true
                    export HF_XET_HIGH_PERFORMANCE="1"
                    export HF_TOKEN="${HUGGING_FACE_HUB_TOKEN:-$HF_TOKEN}"
                    echo "==== [Prefill] Caching model weights on Pod 0 (Started: $(date '+%Y-%m-%d %H:%M:%S')) ===="
                    START_DOWNLOAD=$(date +%s)
                    python3 -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_NAME}', ignore_patterns=['original/*'], max_workers=8)"
                    END_DOWNLOAD=$(date +%s)
                    echo "==== [Prefill] Model cache ready in $((END_DOWNLOAD - START_DOWNLOAD))s ===="
                    touch "${DONE_FILE}"
                  else
                    echo "==== [Prefill] Worker Pod ${JOB_COMPLETION_INDEX}: Waiting for Pod 0 cache barrier... ===="
                    while [ ! -f "${DONE_FILE}" ]; do sleep 2; done
                    echo "==== [Prefill] Worker Pod ${JOB_COMPLETION_INDEX}: Cache barrier cleared! ===="
                  fi
                fi

                # 1. Multi-host Ray vs Single-host initialization
                if [ "$NUM_WORKERS" -gt 1 ]; then
                  python3 /scripts/patch_ray_placement.py

                  ADDRS=""
                  HOSTS=""
                  for i in $(seq 0 $((NUM_WORKERS - 1))); do
                    POD_DNS="${JOB_NAME}-p-0-${i}.${JOB_NAME}.default.svc.cluster.local"
                    POD_IP=""
                    while [ -z "$POD_IP" ]; do
                      POD_IP=$(python3 -c "import socket; print(socket.gethostbyname('${POD_DNS}'))" 2>/dev/null)
                      if [ -z "$POD_IP" ]; then sleep 1; fi
                    done
                    ADDRS="${ADDRS}${POD_IP}:8471,"
                    HOSTS="${HOSTS}${POD_IP},"
                  done

                  IFS='x' read -r TOPO_X TOPO_Y TOPO_Z <<< "${PREFILL_TOPOLOGY}"
                  TOTAL_CHIPS=$((TOPO_X * TOPO_Y * TOPO_Z))
                  TOTAL_CORES=$((TOTAL_CHIPS * 2))
                  CHIP_X=2; CHIP_Y=2; CHIP_Z=1
                  PROC_X=$(( (TOPO_X + CHIP_X - 1) / CHIP_X ))
                  PROC_Y=$(( (TOPO_Y + CHIP_Y - 1) / CHIP_Y ))
                  PROC_Z=$(( (TOPO_Z + CHIP_Z - 1) / CHIP_Z ))

                  export TPU_PROCESS_ADDRESSES=${ADDRS%,}
                  export TPU_WORKER_HOSTNAMES=${HOSTS%,}
                  export TPU_WORKER_ID=${JOB_COMPLETION_INDEX}
                  export TPU_SKIP_MDS_QUERY="1"
                  export CLOUD_TPU_TASK_ID=${JOB_COMPLETION_INDEX}
                  export TPU_CHIPS_PER_PROCESS_BOUNDS="${CHIP_X},${CHIP_Y},${CHIP_Z}"
                  export TPU_PROCESS_BOUNDS="${PROC_X},${PROC_Y},${PROC_Z}"
                  export TPU_ACCELERATOR_TYPE="${TPU_ACCELERATOR_TYPE:-tpu7x-${TOTAL_CORES}}"
                  export TPU_NAME="${JOB_NAME}-p-0-${JOB_COMPLETION_INDEX}"
                  export TPU_MULTIHOST_BACKEND="ray"
                  export TPU_BACKEND_TYPE="jax"
                  export MODEL_IMPL_TYPE="vllm"
                  export RAY_memory_monitor_refresh_ms=0
                  export RAY_memory_usage_threshold=0.99

                  HEAD_IP=$(python3 -c "import socket; print(socket.gethostbyname('${JOB_NAME}-p-0-0.${JOB_NAME}.default.svc.cluster.local'))")

                  if [ "$JOB_COMPLETION_INDEX" = "0" ]; then
                    echo "==== Starting Prefill Ray Head Node on Pod 0 ===="
                    ray start --head --port=6379 --resources='{"TPU": 4}' --block &

                    python3 -c "import os, ray, time, sys, textwrap; exec(textwrap.dedent('''
                        for _ in range(30):
                            try:
                                ray.init(address='auto')
                                break
                            except Exception:
                                print('Waiting for local Ray daemon to start...')
                                time.sleep(2)
                        else:
                            print('Timeout waiting for local Ray Head to start!')
                            sys.exit(1)

                        num_workers = int(os.environ.get('NUM_WORKERS', 0))
                        for attempt in range(120):
                            alive = [n for n in ray.nodes() if n.get('Alive')]
                            print(f'Waiting: {len(alive)}/{num_workers} Ray nodes connected...')
                            if len(alive) >= num_workers:
                                print('Cluster fully formed!')
                                sys.exit(0)
                            time.sleep(2)
                        print('Timeout waiting for Ray workers!')
                        sys.exit(1)
                    '''))"

                    echo "==== Starting vLLM API Server (PRODUCER / Port: ${PORT}) ===="
                    exec python3 -m vllm.entrypoints.openai.api_server \
                      --host=0.0.0.0 --port=${PORT} \
                      --model=${LOCAL_MODEL_PATH} \
                      --served-model-name=${SERVED_MODEL_NAME} \
                      --tensor-parallel-size=${TP_SIZE} \
                      --max-model-len=4096 \
                      --distributed-executor-backend=ray \
                      --kv-transfer-config "{\"kv_connector\":\"${KV_CONNECTOR}\",\"kv_connector_module_path\":\"${KV_CONNECTOR_MODULE}\",\"kv_role\":\"kv_producer\"}"
                  else
                    while ! python3 -c "import socket; socket.create_connection(('${HEAD_IP}', 6379))" 2>/dev/null; do sleep 3; done
                    ray start --address=${HEAD_IP}:6379 --resources='{"TPU": 4}' --block
                  fi
                else
                  # Single-host execution (1 VM)
                  echo "==== Starting vLLM API Server (PRODUCER / Port: ${PORT}) ===="
                  exec python3 -m vllm.entrypoints.openai.api_server \
                    --host=0.0.0.0 --port=${PORT} \
                    --model=${LOCAL_MODEL_PATH} \
                    --served-model-name=${SERVED_MODEL_NAME} \
                    --tensor-parallel-size=${TP_SIZE} \
                    --max-model-len=4096 \
                    --kv-transfer-config "{\"kv_connector\":\"${KV_CONNECTOR}\",\"kv_connector_module_path\":\"${KV_CONNECTOR_MODULE}\",\"kv_role\":\"kv_producer\"}"
                fi
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              resources:
                limits:
                  google.com/tpu: 4
                  cpu: "32"
                  memory: "${CONTAINER_MEM_LIMIT}"
                requests:
                  cpu: "32"
                  memory: "${CONTAINER_MEM_LIMIT}"
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: scripts-volume
                mountPath: /scripts
${CACHE_VOLUME_MOUNTS}
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: scripts-volume
              configMap:
                name: ${JOB_NAME}-scripts
${CACHE_VOLUMES}
            restartPolicy: Never

  # ============================================================================
  # 2. DECODE SLICE (KV Consumer)
  # ============================================================================
  - name: d
    replicas: ${DECODE_REPLICAS}
    template:
      metadata:
        annotations:
          alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
      spec:
        parallelism: ${DECODE_NUM_VMS}
        completions: ${DECODE_NUM_VMS}
        backoffLimit: 2
        template:
          metadata:
            labels:
              declared-duration-minutes: "${JOB_DURATION_MINUTES}"
${GCS_FUSE_ANNOTATIONS}
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: ${DECODE_TOPOLOGY}
              ${DECODE_PLACEMENT_LINE}
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
            initContainers:
            - name: tpu-node-setup
              image: busybox
              command: ["/bin/sh", "-c"]
              args:
              - |
                sysctl -w vm.max_map_count=33554432 || true
                if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                  echo 8000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit || true
                fi
                if [ -f /sys/kernel/mm/transparent_hugepage/enabled ]; then
                  echo always > /sys/kernel/mm/transparent_hugepage/enabled || true
                fi
              securityContext:
                privileged: true
            containers:
            - name: vllm-tpu
              image: ${IMAGE}
              command: ["/bin/bash", "-c"]
              args:
              - |
                set -e
                unset MEGASCALE_NUM_SLICES MEGASCALE_SLICE_ID MEGASCALE_COORDINATOR_ADDRESS MEGASCALE_PORT
                export NUM_WORKERS=${DECODE_NUM_VMS}
                export TP_SIZE=${DECODE_TP_SIZE}
                export PORT=${DECODE_PORT}
                export VLLM_TARGET_DEVICE="tpu"
                export PJRT_DEVICE="TPU"
                export HF_HUB_DISABLE_DISK_LOCK="1"

                # 0. Single-writer download & sync barrier (Decode waits for Prefill Pod 0 cache)
                if [[ "${MODEL_NAME}" != gs://* ]]; then
                  DONE_FILE="/root/.cache/huggingface/.done_${JOB_NAME}"
                  echo "==== [Decode] Waiting for Prefill Pod 0 cache barrier... ===="
                  while [ ! -f "${DONE_FILE}" ]; do sleep 2; done
                  echo "==== [Decode] Cache barrier cleared! ===="
                fi

                # 1. Multi-host Ray vs Single-host initialization
                if [ "$NUM_WORKERS" -gt 1 ]; then
                  python3 /scripts/patch_ray_placement.py

                  REPLICA_INDEX=$(echo "$HOSTNAME" | sed -E 's/.*-d-([0-9]+)-[0-9]+.*/\1/')
                  if ! [[ "$REPLICA_INDEX" =~ ^[0-9]+$ ]]; then REPLICA_INDEX="0"; fi

                  ADDRS=""
                  HOSTS=""
                  for i in $(seq 0 $((NUM_WORKERS - 1))); do
                    POD_DNS="${JOB_NAME}-d-${REPLICA_INDEX}-${i}.${JOB_NAME}.default.svc.cluster.local"
                    POD_IP=""
                    while [ -z "$POD_IP" ]; do
                      POD_IP=$(python3 -c "import socket; print(socket.gethostbyname('${POD_DNS}'))" 2>/dev/null)
                      if [ -z "$POD_IP" ]; then sleep 1; fi
                    done
                    ADDRS="${ADDRS}${POD_IP}:8471,"
                    HOSTS="${HOSTS}${POD_IP},"
                  done

                  IFS='x' read -r TOPO_X TOPO_Y TOPO_Z <<< "${DECODE_TOPOLOGY}"
                  TOTAL_CHIPS=$((TOPO_X * TOPO_Y * TOPO_Z))
                  TOTAL_CORES=$((TOTAL_CHIPS * 2))
                  CHIP_X=2; CHIP_Y=2; CHIP_Z=1
                  PROC_X=$(( (TOPO_X + CHIP_X - 1) / CHIP_X ))
                  PROC_Y=$(( (TOPO_Y + CHIP_Y - 1) / CHIP_Y ))
                  PROC_Z=$(( (TOPO_Z + CHIP_Z - 1) / CHIP_Z ))

                  export TPU_PROCESS_ADDRESSES=${ADDRS%,}
                  export TPU_WORKER_HOSTNAMES=${HOSTS%,}
                  export TPU_WORKER_ID=${JOB_COMPLETION_INDEX}
                  export TPU_SKIP_MDS_QUERY="1"
                  export CLOUD_TPU_TASK_ID=${JOB_COMPLETION_INDEX}
                  export TPU_CHIPS_PER_PROCESS_BOUNDS="${CHIP_X},${CHIP_Y},${CHIP_Z}"
                  export TPU_PROCESS_BOUNDS="${PROC_X},${PROC_Y},${PROC_Z}"
                  export TPU_ACCELERATOR_TYPE="${TPU_ACCELERATOR_TYPE:-tpu7x-${TOTAL_CORES}}"
                  export TPU_NAME="${JOB_NAME}-d-${REPLICA_INDEX}-${JOB_COMPLETION_INDEX}"
                  export TPU_MULTIHOST_BACKEND="ray"
                  export TPU_BACKEND_TYPE="jax"
                  export MODEL_IMPL_TYPE="vllm"
                  export RAY_memory_monitor_refresh_ms=0
                  export RAY_memory_usage_threshold=0.99

                  HEAD_IP=$(python3 -c "import socket; print(socket.gethostbyname('${JOB_NAME}-d-${REPLICA_INDEX}-0.${JOB_NAME}.default.svc.cluster.local'))")

                  if [ "$JOB_COMPLETION_INDEX" = "0" ]; then
                    echo "==== Starting Decode Ray Head Node on Pod 0 ===="
                    ray start --head --port=6379 --resources='{"TPU": 4}' --block &

                    python3 -c "import os, ray, time, sys, textwrap; exec(textwrap.dedent('''
                        for _ in range(30):
                            try:
                                ray.init(address='auto')
                                break
                            except Exception:
                                print('Waiting for local Ray daemon to start...')
                                time.sleep(2)
                        else:
                            print('Timeout waiting for local Ray Head to start!')
                            sys.exit(1)

                        num_workers = int(os.environ.get('NUM_WORKERS', 0))
                        for attempt in range(120):
                            alive = [n for n in ray.nodes() if n.get('Alive')]
                            print(f'Waiting: {len(alive)}/{num_workers} Ray nodes connected...')
                            if len(alive) >= num_workers:
                                print('Cluster fully formed!')
                                sys.exit(0)
                            time.sleep(2)
                        print('Timeout waiting for Ray workers!')
                        sys.exit(1)
                    '''))"

                    echo "==== Starting vLLM API Server (CONSUMER / Port: ${PORT}) ===="
                    exec python3 -m vllm.entrypoints.openai.api_server \
                      --host=0.0.0.0 --port=${PORT} \
                      --model=${LOCAL_MODEL_PATH} \
                      --served-model-name=${SERVED_MODEL_NAME} \
                      --tensor-parallel-size=${TP_SIZE} \
                      --max-model-len=4096 \
                      --distributed-executor-backend=ray \
                      --kv-transfer-config "{\"kv_connector\":\"${KV_CONNECTOR}\",\"kv_connector_module_path\":\"${KV_CONNECTOR_MODULE}\",\"kv_role\":\"kv_consumer\"}"
                  else
                    while ! python3 -c "import socket; socket.create_connection(('${HEAD_IP}', 6379))" 2>/dev/null; do sleep 3; done
                    ray start --address=${HEAD_IP}:6379 --resources='{"TPU": 4}' --block
                  fi
                else
                  # Single-host execution (1 VM)
                  echo "==== Starting vLLM API Server (CONSUMER / Port: ${PORT}) ===="
                  exec python3 -m vllm.entrypoints.openai.api_server \
                    --host=0.0.0.0 --port=${PORT} \
                    --model=${LOCAL_MODEL_PATH} \
                    --served-model-name=${SERVED_MODEL_NAME} \
                    --tensor-parallel-size=${TP_SIZE} \
                    --max-model-len=4096 \
                    --kv-transfer-config "{\"kv_connector\":\"${KV_CONNECTOR}\",\"kv_connector_module_path\":\"${KV_CONNECTOR_MODULE}\",\"kv_role\":\"kv_consumer\"}"
                fi
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              resources:
                limits:
                  google.com/tpu: 4
                  cpu: "32"
                  memory: "${CONTAINER_MEM_LIMIT}"
                requests:
                  cpu: "32"
                  memory: "${CONTAINER_MEM_LIMIT}"
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: scripts-volume
                mountPath: /scripts
${CACHE_VOLUME_MOUNTS}
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: scripts-volume
              configMap:
                name: ${JOB_NAME}-scripts
${CACHE_VOLUMES}
            restartPolicy: Never

  # ============================================================================
  # 3. PROXY ROUTER (CPU)
  # ============================================================================
  - name: x
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            tolerations:
            - key: "cloud.google.com/gke-nodepool"
              operator: "Exists"
              effect: "NoSchedule"
            containers:
            - name: proxy-server
              image: ${IMAGE}
              command: ["/bin/bash", "-c"]
              args:
              - |
                PREFILL_HOST="${JOB_NAME}-p-0-0.${JOB_NAME}.default.svc.cluster.local"
                PREFILL_PORT=${PREFILL_PORT}
                DECODE_PORT=${DECODE_PORT}
                DECODE_REPLICAS=${DECODE_REPLICAS}

                echo "Waiting for Prefill server (${PREFILL_HOST}:${PREFILL_PORT}) to become healthy..."
                while ! curl -s -f http://${PREFILL_HOST}:${PREFILL_PORT}/health > /dev/null; do sleep 10; done
                echo "Prefill server is ready!"

                DECODE_HOSTS=""
                DECODE_PORTS=""
                for r in $(seq 0 $((DECODE_REPLICAS - 1))); do
                  H="${JOB_NAME}-d-${r}-0.${JOB_NAME}.default.svc.cluster.local"
                  DECODE_HOSTS="${DECODE_HOSTS} ${H}"
                  DECODE_PORTS="${DECODE_PORTS} ${DECODE_PORT}"
                  echo "Waiting for Decode replica ${r} (${H}:${DECODE_PORT}) to become healthy..."
                  while ! curl -s -f http://${H}:${DECODE_PORT}/health > /dev/null; do sleep 10; done
                  echo "Decode replica ${r} is ready!"
                done

                echo "Locating toy_proxy_server.py in container..."
                PROXY_SCRIPT=$(find /workspace /root /usr /home -name toy_proxy_server.py 2>/dev/null | head -n 1)
                if [ -z "$PROXY_SCRIPT" ]; then
                  echo "ERROR: toy_proxy_server.py not found in image ${IMAGE}!"
                  exit 1
                fi
                echo "Found proxy script at: $PROXY_SCRIPT"
                if ! grep -q '"/health"' "$PROXY_SCRIPT"; then
                  echo "Patching /health endpoint into proxy script..."
                  printf '\n@app.get("/health")\nasync def healthcheck():\n    return {"status": "ok"}\n' >> "$PROXY_SCRIPT"
                fi

                echo "Starting Disaggregated Proxy Router on :8000 with ${DECODE_REPLICAS} decode replica(s)..."
                exec python3 $PROXY_SCRIPT \
                  --host 0.0.0.0 --port 8000 \
                  --prefiller-hosts ${PREFILL_HOST} --prefiller-ports ${PREFILL_PORT} \
                  --decoder-hosts ${DECODE_HOSTS} --decoder-ports ${DECODE_PORTS}
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              resources:
                requests:
                  cpu: "8"
                  memory: "16Gi"
                limits:
                  cpu: "16"
                  memory: "32Gi"
            restartPolicy: Never

  # ============================================================================
  # 4. BENCHMARK CLIENT (CPU)
  # ============================================================================
  - name: client
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            tolerations:
            - key: "cloud.google.com/gke-nodepool"
              operator: "Exists"
              effect: "NoSchedule"
            containers:
            - name: benchmark-client
              image: ${IMAGE}
              command: ["/bin/bash", "-c"]
              args:
              - |
                PROXY_POD="${JOB_NAME}-x-0-0.${JOB_NAME}.default.svc.cluster.local"

                echo "Waiting for Proxy Router (http://${PROXY_POD}:8000) to become healthy..."
                while ! curl -s -f http://${PROXY_POD}:8000/health > /dev/null && ! curl -s -f http://${PROXY_POD}:8000/docs > /dev/null; do
                  sleep 5
                done

                echo "============================================================"
                echo " Proxy is healthy! Probing chat completions pipeline..."
                echo "============================================================"

                python3 -c "
                import json, time, urllib.request

                url = 'http://${PROXY_POD}:8000/v1/chat/completions'
                payload = {
                    'model': '${SERVED_MODEL_NAME}',
                    'messages': [{'role': 'user', 'content': 'Hello, probe disaggregated inference pipeline.'}],
                    'max_tokens': 5,
                    'temperature': 0.0
                }
                data = json.dumps(payload).encode('utf-8')
                req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})

                for attempt in range(60):
                    try:
                        with urllib.request.urlopen(req, timeout=15) as resp:
                            if resp.status == 200:
                                print('✅ End-to-end P/D disaggregated pipeline probe SUCCESSFUL!')
                                break
                    except Exception as e:
                        print(f'Waiting for P/D pipeline readiness ({e}). Retrying in 10s...')
                        time.sleep(10)
                "

                echo ""
                echo "============================================================"
                echo " Starting Progressive Multi-Stage Benchmark Suite"
                echo "============================================================"

                TEST_CONFIGS=(
                  "128 128 100"
                  "512 256 100"
                  "1024 512 100"
                  "2048 512 100"
                  "3072 512 100"
                )

                cat << 'EOF' > /tmp/run_bench.py
                import sys
                from vllm.benchmarks.serve import main

                if __name__ == '__main__':
                    sys.argv[0] = 'vllm bench serve'
                    main(sys.argv[1:])
                EOF

                STAGE=1
                TOTAL_STAGES=${#TEST_CONFIGS[@]}

                for config in "${TEST_CONFIGS[@]}"; do
                  read -r IN_LEN OUT_LEN NUM_PROMPTS <<< "$config"
                  echo ""
                  echo "============================================================"
                  echo " [Stage ${STAGE}/${TOTAL_STAGES}] Input=${IN_LEN}, Output=${OUT_LEN} (${NUM_PROMPTS} prompts)"
                  echo " Started at: $(date '+%Y-%m-%d %H:%M:%S')"
                  echo "============================================================"

                  python3 /tmp/run_bench.py \
                    --backend=vllm \
                    --host=${PROXY_POD} \
                    --port=8000 \
                    --model=${SERVED_MODEL_NAME} \
                    --dataset-name=random \
                    --random-input-len=${IN_LEN} \
                    --random-output-len=${OUT_LEN} \
                    ${PREFIX_LEN_FLAG} \
                    --num-prompts=${NUM_PROMPTS} \
                    --request-rate=${REQUEST_RATE} || echo "⚠️ Warning: Stage ${STAGE} exited with non-zero status."

                  echo " Finished Stage ${STAGE} at: $(date '+%Y-%m-%d %H:%M:%S')"
                  STAGE=$((STAGE + 1))
                  sleep 5
                done

                echo ""
                echo "============================================================"
                echo " ✅ All Disaggregated Benchmark Stages Completed Successfully!"
                echo "============================================================"
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              resources:
                requests:
                  cpu: "4"
                  memory: "8Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
            restartPolicy: Never
