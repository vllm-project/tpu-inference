apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOB_NAME}
  namespace: default
  labels:
    kueue.x-k8s.io/priority-class: medium
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true

  successPolicy:
    operator: All
    targetReplicatedJobs:
    - client
    
  replicatedJobs:
  # ==========================================
  # REPLICATED JOB 1: TPU SERVER CLUSTER
  # ==========================================
  - name: server
    replicas: 1  
    template:
      spec:
        parallelism: ${NUM_VMS}
        completions: ${NUM_VMS}
        backoffLimit: 0
        template:
          metadata:
            labels:
              declared-duration-minutes: "50"
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: ${TOPOLOGY}
              cloud.google.com/placement-policy-name: ${PLACEMENT_POLICY}
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
              
            initContainers:
            - name: tpu-node-setup
              image: busybox
              command: ["/bin/sh", "-c"]
              args:
              - |
                sysctl -w vm.max_map_count=33554432 || true
                if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                  echo 8000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit || true
                fi
              securityContext:
                privileged: true
                
            containers:
            - name: vllm-tpu
              image: docker.io/vllm/vllm-tpu:v0.27.0
              command: ["/bin/bash", "-c"]
              args:
              - |
                export NUM_WORKERS=${NUM_VMS}
                export ADDRS=""
                export HOSTS=""
                for i in $(seq 0 $((NUM_WORKERS - 1))); do
                  POD_DNS="${JOB_NAME}-server-0-${i}.${JOB_NAME}.default.svc.cluster.local"
                  
                  POD_IP=""
                  while [ -z "$POD_IP" ]; do
                    POD_IP=$(python3 -c "import socket; print(socket.gethostbyname('${POD_DNS}'))" 2>/dev/null)
                    if [ -z "$POD_IP" ]; then sleep 1; fi
                  done
                  
                  ADDRS="${ADDRS}${POD_IP}:8471,"
                  HOSTS="${HOSTS}${POD_IP},"
                done
                
                export TPU_PROCESS_ADDRESSES=${ADDRS%,}
                export TPU_WORKER_HOSTNAMES=${HOSTS%,}
                export TPU_WORKER_ID=${JOB_COMPLETION_INDEX}
                export TPU_MULTIHOST_BACKEND="ray"
                export TPU_SKIP_MDS_QUERY="1"
                export CLOUD_TPU_TASK_ID=${JOB_COMPLETION_INDEX}
                
                HEAD_IP=$(python3 -c "import socket; print(socket.gethostbyname('${JOB_NAME}-server-0-0.${JOB_NAME}.default.svc.cluster.local'))")
                
                if [ "$JOB_COMPLETION_INDEX" = "0" ]; then
                  echo "==== Starting Ray Head Node on Pod 0 ===="
                  ray start --head --port=6379 --resources='{"TPU": 4}' --block &
                  
                  echo "==== Waiting for Ray cluster to form ===="
                  # FIXED: Added a try/except retry loop for ray.init() to handle the race condition!
                  python3 -c "import os, ray, time, sys, textwrap; exec(textwrap.dedent('''
                      # 1. Wait for the local Ray Head to finish booting
                      for _ in range(30):
                          try:
                              ray.init(address='auto')
                              break
                          except Exception:
                              print('Waiting for local Ray daemon to start...')
                              time.sleep(2)
                      else:
                          print('Timeout waiting for local Ray Head to start!')
                          sys.exit(1)
                      
                      # 2. Wait for the other VMs to join over the network
                      num_workers = int(os.environ.get('NUM_WORKERS', 0))
                      for attempt in range(120):
                          alive = [n for n in ray.nodes() if n.get('Alive')]
                          print(f'Waiting: {len(alive)}/{num_workers} Ray nodes connected...')
                          if len(alive) >= num_workers:
                              print('Cluster fully formed!')
                              sys.exit(0)
                          time.sleep(2)
                      print('Timeout waiting for Ray workers!')
                      sys.exit(1)
                  '''))"
                  
                  echo "==== Starting vLLM API Server ===="
                  python3 -m vllm.entrypoints.openai.api_server \
                    --host=0.0.0.0 \
                    --port=8000 \
                    --model=${MODEL_NAME} \
                    --tensor-parallel-size=${TP_SIZE} \
                    --max-model-len=4096
                else
                  echo "==== Waiting for Ray Head Node ($HEAD_IP) to be reachable ===="
                  while ! python3 -c "import socket; socket.create_connection(('${HEAD_IP}', 6379))" 2>/dev/null; do
                    sleep 3
                  done
                  
                  echo "==== Head node reachable! Starting Ray Worker ===="
                  ray start --address=${HEAD_IP}:6379 --resources='{"TPU": 4}' --block
                fi
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              - name: VLLM_TARGET_DEVICE
                value: "tpu"
              - name: PJRT_DEVICE
                value: "TPU"
              resources:
                limits:
                  google.com/tpu: 4  
                  cpu: "16"
                  memory: "64Gi"
                requests:
                  cpu: "16"
                  memory: "64Gi"
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: torch-compile-cache
                mountPath: /.cache
              - name: triton-cache
                mountPath: /.triton
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: torch-compile-cache
              emptyDir: {}
            - name: triton-cache
              emptyDir: {}
            restartPolicy: Never

  # ==========================================
  # REPLICATED JOB 2: CPU BENCHMARK CLIENT
  # ==========================================
  - name: client
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            containers:
            - name: benchmark-client
              image: docker.io/vllm/vllm-tpu:v0.27.0
              command: ["/bin/bash", "-c"]
              args:
              - |
                HEAD_NODE="${JOB_NAME}-server-0-0.${JOB_NAME}.default.svc.cluster.local"
                
                echo "Waiting for vLLM Server on Head Node to finish TPU XLA compilation..."
                while ! curl -s -f http://${HEAD_NODE}:8000/health > /dev/null; do
                  sleep 10
                done
                
                echo "Server is ready! Starting benchmark..."
                vllm bench serve \
                  --backend=vllm \
                  --host=${HEAD_NODE} \
                  --port=8000 \
                  --model=${MODEL_NAME} \
                  --dataset-name=random \
                  --random-input-len=128 \
                  --random-output-len=128 \
                  --num-prompts=100 \
                  --request-rate=10
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              resources:
                requests:
                  cpu: "4"
                  memory: "8Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
            restartPolicy: Never
