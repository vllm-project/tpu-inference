apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${JOB_NAME}
  namespace: default
  labels:
    kueue.x-k8s.io/priority-class: medium
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true

  successPolicy:
    operator: All
    targetReplicatedJobs:
    - client
    
  replicatedJobs:
  # ==========================================
  # REPLICATED JOB 1: SINGLE-HOST TPU SERVER
  # ==========================================
  - name: server
    replicas: 1  
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              declared-duration-minutes: "${JOB_DURATION_MINUTES}"
${GCS_FUSE_ANNOTATIONS}
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: ${TOPOLOGY}
              # Notice: No placement policy is needed for single-host slices!
            tolerations:
            - key: "google.com/tpu"
              operator: "Exists"
              effect: "NoSchedule"
              
            initContainers:
            - name: tpu-node-setup
              image: busybox
              command: ["/bin/sh", "-c"]
              args:
              - |
                sysctl -w vm.max_map_count=33554432 || true
                if [ -f /sys/module/vfio_iommu_type1/parameters/dma_entry_limit ]; then
                  echo 8000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit || true
                fi
                if [ -f /sys/kernel/mm/transparent_hugepage/enabled ]; then
                  echo always > /sys/kernel/mm/transparent_hugepage/enabled || true
                fi
              securityContext:
                privileged: true
                
            containers:
            - name: vllm-tpu
              image: ${IMAGE}
              command: ["/bin/bash", "-c"]
              args:
              - |
                if [[ "${MODEL_NAME}" != gs://* ]]; then
                  mkdir -p /tmp/hf_locks
                  mkdir -p /root/.cache/huggingface/hub
                  rm -rf /root/.cache/huggingface/hub/.locks 2>/dev/null || true
                  ln -sfn /tmp/hf_locks /root/.cache/huggingface/hub/.locks 2>/dev/null || true
                  pip install --no-cache-dir hf-transfer 2>/dev/null || true
                  export HF_XET_HIGH_PERFORMANCE="1"
                  export HF_HUB_DISABLE_DISK_LOCK="1"
                  export HF_TOKEN="${HUGGING_FACE_HUB_TOKEN:-$HF_TOKEN}"
                  echo "==== Ensuring model weights are cached (Started: $(date '+%Y-%m-%d %H:%M:%S')) ===="
                  START_DOWNLOAD=$(date +%s)
                  python3 -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_NAME}', ignore_patterns=['original/*'], max_workers=8)"
                  END_DOWNLOAD=$(date +%s)
                  DOWNLOAD_DURATION=$((END_DOWNLOAD - START_DOWNLOAD))
                  echo "==== Model cache ready in ${DOWNLOAD_DURATION}s ($(date '+%Y-%m-%d %H:%M:%S')) ===="
                fi
                export VLLM_TARGET_DEVICE="tpu"
                export PJRT_DEVICE="TPU"
                export HF_HUB_DISABLE_DISK_LOCK="1"

                exec python3 -m vllm.entrypoints.openai.api_server \
                  --host=0.0.0.0 \
                  --port=8000 \
                  --model=${LOCAL_MODEL_PATH} \
                  --served-model-name=${SERVED_MODEL_NAME} \
                  --tensor-parallel-size=${TP_SIZE} \
                  --max-model-len=${MAX_MODEL_LEN} \
                  --safetensors-load-strategy=prefetch \
                  ${FEATURE_FLAGS}
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              ports:
              - containerPort: 8000
              resources:
                limits:
                  google.com/tpu: 4  
                  cpu: "32"
                  memory: "${CONTAINER_MEM_LIMIT}"
                requests:
                  cpu: "32"
                  memory: "${CONTAINER_MEM_LIMIT}"
              volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - name: triton-cache
                mountPath: /.triton
${CACHE_VOLUME_MOUNTS}
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: triton-cache
              emptyDir: {}
${CACHE_VOLUMES}
            restartPolicy: Never

  # ==========================================
  # REPLICATED JOB 2: CPU BENCHMARK CLIENT
  # ==========================================
  - name: client
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              declared-duration-minutes: "${JOB_DURATION_MINUTES}"
          spec:
            serviceAccountName: ${SERVICE_ACCOUNT}
            tolerations:
            - key: "cloud.google.com/gke-nodepool"
              operator: "Exists"
              effect: "NoSchedule"
            containers:
            - name: benchmark-client
              image: ${IMAGE}
              command: ["/bin/bash", "-c"]
              args:
              - |
                HEAD_NODE="${JOB_NAME}-server-0-0.${JOB_NAME}.default.svc.cluster.local"
                
                echo "Waiting for vLLM Server to finish TPU XLA compilation..."
                while ! curl -s -f http://${HEAD_NODE}:8000/health > /dev/null; do
                  sleep 10
                done
                
                echo "============================================================"
                echo " Server is ready! Starting Progressive Token Length Suite"
                echo "============================================================"
                
                # List of (input_len, output_len, num_prompts) test stages
                TEST_CONFIGS=(
                  "128 128 100"
                  "512 256 100"
                  "1024 512 100"
                  "2048 512 100"
                  "3072 512 100"
                )
                
                cat << 'EOF' > /tmp/run_bench.py
                import sys
                from vllm.benchmarks.serve import main

                if __name__ == '__main__':
                    sys.argv[0] = 'vllm bench serve'
                    main(sys.argv[1:])
                EOF

                STAGE=1
                TOTAL_STAGES=${#TEST_CONFIGS[@]}
                
                for config in "${TEST_CONFIGS[@]}"; do
                  read -r IN_LEN OUT_LEN NUM_PROMPTS <<< "$config"
                  echo ""
                  echo "============================================================"
                  echo " [Stage ${STAGE}/${TOTAL_STAGES}] Input=${IN_LEN}, Output=${OUT_LEN} (${NUM_PROMPTS} prompts)"
                  echo " Started at: $(date '+%Y-%m-%d %H:%M:%S')"
                  echo "============================================================"
                  
                  python3 /tmp/run_bench.py \
                    --backend=vllm \
                    --host=${HEAD_NODE} \
                    --port=8000 \
                    --model=${SERVED_MODEL_NAME} \
                    --dataset-name=random \
                    --random-input-len=${IN_LEN} \
                    --random-output-len=${OUT_LEN} \
                    ${PREFIX_LEN_FLAG} \
                    --num-prompts=${NUM_PROMPTS} \
                    --request-rate=${REQUEST_RATE} || echo "⚠️ Warning: Stage ${STAGE} exited with non-zero status."
                  
                  echo " Finished Stage ${STAGE} at: $(date '+%Y-%m-%d %H:%M:%S')"
                  STAGE=$((STAGE + 1))
                  sleep 5
                done
                
                echo ""
                echo "============================================================"
                echo " ✅ All Progressive Benchmark Stages Finished!"
                echo "============================================================"
              env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ${HF_TOKEN_SECRET}
                    key: HF_TOKEN
              resources:
                requests:
                  cpu: "4"
                  memory: "8Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
            restartPolicy: Never

