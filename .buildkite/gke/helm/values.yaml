# ==============================================================================
# TPU vLLM Benchmark Helm Chart Configuration (values.yaml)
# ==============================================================================

# Serving Mode:
# - "aggregated"    : Default monolithic serving (1 TPU slice runs both prefill & decode)
# - "disaggregated" : Disaggregated serving (Separate Prefill & Decode TPU slices with Proxy Router)
# - "script"        : Custom test runner (Single TPU Pod directly executes a specified test script e.g. benchmark.sh)
mode: "aggregated"

# Container Image Configuration
# Tag format is strictly: <registry>:<tpuInferenceCommit>-<vllmCommit>-<tpuVersion>
# Matches setup_docker_env.sh and pipeline_build.yml in tpu-inference.
image:
  registry: "us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/tpu-inference-ci/vllm-tpu"
  tpuInferenceCommit: "4b8006086b4493dd6fd4b10ab69b8ed44d7ef538"  # Git commit hash of tpu-inference to test
  vllmCommit: "51da0ca66c8065619c79e35dff97aa99aeaf5644"          # vLLM commit hash (from .buildkite/vllm_lkg.version)
imagePullSecrets: []                      # Optional: Kubernetes imagePullSecrets for private registries (e.g. [{"name": "my-regcred"}])

# On-Demand Image Builder (Docker-in-Docker, CPU-only Helm pre-install hook Job)
# If enabled, checks if <registry>:<tpuInferenceCommit>-<vllmCommit>-<tpuVersion> exists in GAR.
# If already present (e.g. prebuilt by CI with USE_PREBUILT_IMAGE=1), skips build in 2s. If missing, builds and pushes.
#
# The build runs as a Helm pre-install hook (templates/image-builder-job.yaml), NOT as an
# initContainer on the TPU pods. A JobSet is admitted by Kueue as a single Workload, so every
# step's TPU quota would be held -- and exposed to TPU node evictions -- for the whole build.
# The hook completes before the JobSet is created, so no TPU capacity is reserved while building.
#
# Consequence: `helm install` blocks until the build finishes. run_testcase.sh checks the
# registry first and disables the builder on a cache hit so the common case stays instant.
builder:
  enabled: false
  gitRepo: "https://github.com/vllm-project/tpu-inference.git"
  image: "docker:dind"          # Builder container image
  queueName: "default"          # Kueue LocalQueue; must exist or the Job stays suspended forever
  timeout: "90m"                # Passed to `helm install --timeout` by run_testcase.sh
  backoffLimit: 2               # Job-level retries; cheap once the shared cache is warm
  activeDeadlineSeconds: 4800   # Running-time cap (Kueue queueing time does not count)
  cache:
    enabled: true               # false falls back to emptyDir (cpu-np has only ~43.8 GiB free)
    claimName: "vllm-build-cache"  # Created from extras/build-cache-pvc.yaml, shared by all releases
    # Garbage collection, evaluated once per build right before `docker build` and
    # only when the registry fast-path missed (a cache hit prunes nothing).
    # Measured with `df /var/lib/docker`, i.e. real filesystem usage -- that, not
    # `docker system df`, is the number that makes a build fail with ENOSPC.
    # Above highWatermarkPercent: delete images/containers first (free, they are
    # already pushed to the registry), and only if that is not enough, trim the
    # BuildKit cache down to lowWatermarkPercent. Set highWatermarkPercent to 0
    # to disable pruning entirely.
    highWatermarkPercent: 70
    lowWatermarkPercent: 50
  resources:
    # cpu-np nodes are 64 vCPU / 256 GB. Requests stay modest so several builds can
    # coexist, while the limit lets the compile phase burst.
    requests:
      cpu: "8"
      memory: "32Gi"
    limits:
      cpu: "32"
      memory: "64Gi"

# Model Configuration
model:
  name: "meta-llama/Llama-3.1-8B-Instruct"  # HuggingFace repo ID or GCS path (gs://bucket/dir)
  servedName: ""                            # Optional: Custom served model name (inferred from model.name if omitted)
  maxModelLen: 4096                         # Maximum context length supported by the server
  maxNumSeqs: null                          # Optional: Maximum sequences per iteration (--max-num-seqs)
  safetensorsLoadStrategy: "prefetch"       # Strategy for loading safetensors weights
  extraArgs: []                             # Extra CLI flags to pass to vllm serve

# Advanced Inference & Serving Features (Bulk & Low-Latency)
features:
  # Bulk inference optimizations:
  asyncScheduling: true               # Overlap CPU batch scheduling with TPU execution (--async-scheduling)
  kvCacheOffload:
    enabled: false                    # Enable offloading KV cache blocks from TPU HBM to Host DRAM
    connector: "RaidenOffloadConnector" # "RaidenOffloadConnector" or "TPUOffloadConnector"
    numCpuChunks: 1024                # Number of host memory chunks allocated for offloading

  # Prod low-latency optimizations:
  prefixCaching: true                 # Automatic Prefix Caching (APC) for prompt reuse (--enable-prefix-caching)
  chunkedPrefill:
    enabled: true                     # Interleave prefill chunks with decode steps (--enable-chunked-prefill)
    maxNumBatchedTokens: 2048         # Maximum batched tokens per step (--max-num-batched-tokens)

  wideEP:
    enabled: false                    # Wide Expert Parallelism for MoE models (--enable-expert-parallel)
    size: 1                           # Degree of expert parallelism (e.g. 8 or 16)

  speculativeDecoding:
    enabled: false                    # Speculative decoding (e.g. Eagle3)
    method: "eagle3"                  # Speculative decoding method ("eagle3", "ngram", etc.)
    draftModel: ""                    # Draft model repo ID or path (--speculative-model)
    numSpeculativeTokens: 3           # Candidate tokens proposed per step (--num-speculative-tokens)

  structuredOutput:
    enabled: false                    # Grammar-guided structured decoding (JSON schema)
    backend: "auto"                   # Grammar backend engine ("auto", "xgrammar", "outlines")

# Monolithic TPU Hardware Configuration (Active when mode == "aggregated")
tpu:
  accelerator: "tpu7x"                      # TPU accelerator type
  topology: "2x2x1"                         # TPU topology shape: "2x2x1" (1 VM / 8 cores) or "2x2x4" (4 VMs / 32 cores)
  placementPolicy: ""                       # Placement policy (required for multihost topologies)
  chipsPerProcessBounds: ""                 # Chip bounds (e.g. "2,2,1", auto-computed if empty)
  processBounds: ""                         # Process bounds (e.g. "1,1,1" for 2x2x1, "1,1,4" for 2x2x4, auto-computed if empty)
  tensorParallelSize: 0                     # 0 = auto-computed from topology (chips * 2)

# Disaggregated Architecture Configuration (Active when mode == "disaggregated")
disaggregated:
  kvConnector: "TPUConnector"               # "TPUConnector" (vllm-tpu) or "TPURaidenConnector" (torchtpu)
  kvConnectorModule: ""                     # Auto-detected if empty

  # Prefill Slice (KV Producer)
  prefill:
    replicas: 1                             # Number of Prefill slices
    topology: "2x2x1"                       # Prefill TPU topology shape (e.g. 2x2x1)
    port: 8400                              # API server port for prefiller
    placementPolicy: ""                     # Placement policy (if multihost)
    chipsPerProcessBounds: ""               # Auto-computed if empty
    processBounds: ""                       # Auto-computed if empty
    tensorParallelSize: 0                   # Auto-computed if 0
    resources:
      cpu: "32"
      memory: "72Gi"
      tpu: 4

  # Decode Slice (KV Consumer)
  decode:
    replicas: 1                             # Number of Decode slices (e.g. 2 for 2x 2x2x1 horizontal scaling)
    topology: "2x2x2"                       # Decode TPU topology shape (e.g. 2x2x1 symmetric or 2x2x2 asymmetric)
    port: 9400                              # API server port for decoder
    placementPolicy: ""                     # Placement policy (if multihost, e.g. 2x2x2 or 2x2x4)
    chipsPerProcessBounds: ""               # Auto-computed if empty
    processBounds: ""                       # Auto-computed if empty
    tensorParallelSize: 0                   # Auto-computed if 0
    resources:
      cpu: "32"
      memory: "72Gi"
      tpu: 4

  # Disaggregated Proxy Router (CPU)
  proxy:
    port: 8000
    resources:
      cpu: "8"
      memory: "16Gi"

# Storage & Weight Caching (Shared across both modes)
storage:
  type: "gcs-cache"                         # "gcs-cache" (GCS FUSE cache) | "ramdisk" (Pure In-Memory) | "gcs-direct" (Direct GCS Model Mount)
  bucketName: "<your-hf-cache-bucket>"          # GCS Bucket name
  cacheSubpath: "hf-cache"                  # Subfolder in GCS bucket for HuggingFace cache
  ramCacheLimit: "32Gi"                     # EmptyDir memory cache limit for GCS FUSE
  gcsFuse:
    memoryLimit: "72Gi"
    cpuLimit: "8"

# Security & Identity
serviceAccount: "lyle-vllm-ksa"
hfTokenSecret:
  name: "hf-token-secret"
  key: "HF_TOKEN"

# Monolithic Compute Resources (Per TPU Server Node when mode == "aggregated")
resources:
  cpu: "32"
  memory: "200Gi"
  tpu: 4

# Job Duration & Queue Management
job:
  declaredDurationMinutes: 90               # Max declared duration for Kueue scheduling
  priorityClass: "medium"

# Progressive Benchmark Client Configuration
benchmark:
  image: ""                                 # Optional: override benchmark client image
  requestRate: 10.0                         # Benchmark traffic rate in req/s
  randomPrefixLen: 0                        # Length of fixed shared prompt prefix across requests (>0 enables Prefix Caching test)
  stages:
    - inputLen: 128
      outputLen: 128
      numPrompts: 100
    - inputLen: 512
      outputLen: 256
      numPrompts: 100
    - inputLen: 1024
      outputLen: 512
      numPrompts: 100
    - inputLen: 2048
      outputLen: 512
      numPrompts: 100
    - inputLen: 3072
      outputLen: 512
      numPrompts: 100
  resources:
    cpu: "4"
    memory: "8Gi"

# Script Runner Configuration (Active when mode == "script")
# Executes custom test/benchmark scripts on TPU pods via ReplicatedJobs in JobSet.
# Supports one or more jobs in the scriptJobs list.
scriptJobs:
  - name: "benchmark"
    command: "bash /workspace/tpu_inference/tests/e2e/benchmarking/benchmark.sh"
    workingDir: "/workspace/vllm"             # Working directory for script execution
    backoffLimit: 1                           # Number of retries on failure (0 = fail-fast, 1 = retry once)
    git:
      enabled: false                         # Optional: Clone a fresh repo branch at Pod startup
      repo: "https://github.com/vllm-project/tpu-inference.git"
      branch: "main"
      dest: "/workspace/tpu_inference"
    env: {}                                  # Environment variables passed as key-value pairs (e.g. TEST_MODEL: "...", INPUT_LEN: 1800)

