# ==============================================================================
# Shared Docker build cache for the image-builder Job
# ==============================================================================
# Mounted at /var/lib/docker by templates/image-builder-job.yaml so that image
# layers AND the BuildKit pip cache (docker/Dockerfile uses
# `RUN --mount=type=cache,target=/root/.cache/pip` in eight places) survive
# between runs. Without it every build starts from scratch, which is why a single
# eviction used to throw away 30 minutes of work.
#
# Why this lives OUTSIDE the chart
# --------------------------------
# It cannot be a Helm hook resource: the default hook-delete-policy is
# `before-hook-creation`, so Helm would delete and recreate the claim on every
# install and wipe the cache. It also cannot be a normal chart template, because
# those are applied AFTER pre-install hooks run, i.e. too late for the builder.
#
# run_testcase.sh therefore creates it on demand and never touches it again if it
# already exists (so resizing or changing the StorageClass is always a deliberate
# manual action).
#
# Manual operations
# -----------------
#   Create:        kubectl create -f extras/build-cache-pvc.yaml
#   Inspect usage: the builder prints `df /var/lib/docker` before each build and
#                  `docker system df` at the start and end of every run
#   Grow:          kubectl patch pvc vllm-build-cache -p \
#                    '{"spec":{"resources":{"requests":{"storage":"600Gi"}}}}'
#                  (standard-rwo has allowVolumeExpansion: true; shrinking is
#                  impossible, so raise the size in small steps)
#   Wipe:          kubectl delete pvc vllm-build-cache   # next run rebuilds cold
#
# Editing the size here does NOT resize an existing claim: run_testcase.sh only
# creates the claim when it is missing. It does compare the live claim against
# this file and prints the patch command above when they differ.
#
# Automatic cleanup
# -----------------
# The builder checks `df /var/lib/docker` immediately before `docker build` and,
# above builder.cache.highWatermarkPercent (70%), prunes images/containers first
# and then the BuildKit cache down to lowWatermarkPercent (50%). 300Gi therefore
# only has to hold a couple of full builds (~25-40Gi of BuildKit cache plus
# ~10Gi of image each) rather than every build ever run.
#
# Concurrency
# -----------
# ReadWriteOncePod means exactly one pod may mount it at a time. A second
# concurrent build stays Pending until the first finishes, rather than starting a
# second dockerd on the same data root (which would fail with an opaque
# containerd/boltdb lock error). Since image tags are content-addressed
# (<tpuCommit>-<vllmCommit>-<tpuVersion>), the second build usually then hits the
# registry fast-path and exits immediately.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-build-cache
  namespace: default
  labels:
    app.kubernetes.io/component: image-builder
  annotations:
    # Defensive: if this claim is ever pulled into a Helm release, keep it rather
    # than deleting it on uninstall.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
  - ReadWriteOncePod
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 300Gi
