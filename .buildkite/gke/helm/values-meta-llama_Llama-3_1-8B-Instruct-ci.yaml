# ==============================================================================
# GKE TPU vLLM CI Configuration (Transferred from Buildkite)
# Source Buildkite YAML: /usr/local/google/home/dennisyeh/tpu-inference/.buildkite/models/meta-llama_Llama-3_1-8B-Instruct.yml
# Script Jobs Count:     3
# ==============================================================================
image:
  registry: us-central1-docker.pkg.dev/cienet-cmcs/lyle-vllm-images/vllm-tpu
  tpuInferenceCommit: 3a5b4737099fd1ab53aa4e05afcf3576cd30d958
  vllmCommit: 51da0ca66c8065619c79e35dff97aa99aeaf5644
builder:
  enabled: true
  gitRepo: https://github.com/vllm-project/tpu-inference.git
tpu:
  accelerator: tpu7x
  topology: 2x2x1
resources:
  tpu: 4
  cpu: '32'
  memory: 100Gi
scriptJobs:
- name: unittest
  command: bash -c 'python3 -m pytest -s -v -x /workspace/tpu_inference/tests/models/jax/test_llama3.py'
  workingDir: /workspace/vllm
  backoffLimit: 0
  env: {}
- name: accuracy
  command: bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh
  workingDir: /workspace/vllm
  backoffLimit: 0
  env:
    TEST_MODEL: meta-llama/Llama-3.1-8B-Instruct
    TENSOR_PARALLEL_SIZE: '2'
    MINIMUM_ACCURACY_THRESHOLD: '0.75'
- name: benchmark
  command: bash /workspace/tpu_inference/tests/e2e/benchmarking/benchmark.sh
  workingDir: /workspace/vllm
  backoffLimit: 0
  env:
    TEST_MODEL: meta-llama/Llama-3.1-8B-Instruct
    TENSOR_PARALLEL_SIZE: '2'
    MINIMUM_THROUGHPUT_THRESHOLD: '10.77'
    INPUT_LEN: '1800'
    OUTPUT_LEN: '128'
    PREFIX_LEN: '0'
    MAX_MODEL_LEN: '2048'
    MAX_NUM_SEQS: '256'
    MAX_NUM_BATCHED_TOKENS: '1024'
storage:
  type: ramdisk
hfTokenSecret:
  name: dennis-hf-token
  key: token
