# The kube steps for ../runai_model_streamer_loader.yml, with the same keys. See README.md.

steps:
  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Correctness Test | Runai Model Streamer JAX UniProcExecutor"
    key: "${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_jax_uniproc"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_SINGLE:-ct6e-standard-1t/1x1}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - ".buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/e2e/test_runai_model_streamer_loader.py::test_correctness_jax_uni_proc_executor"

  - label: "${TPU_VERSION:-tpu6e} Record Result | Runai Model Streamer JAX UniProcExecutor"
    key: "${TPU_VERSION:-tpu6e}_record_runai_model_streamer_loader_jax_uniproc"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_jax_uniproc"
        allow_failure: true
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "runai_model_streamer_loader"
      CI_STAGE: "CorrectnessTest"
      CI_CATEGORY: "feature support matrix"
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - ".buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_jax_uniproc"

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Correctness Test | Runai Model Streamer Torchax UniProcExecutor"
    key: "${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_torchax_uniproc"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_SINGLE:-ct6e-standard-1t/1x1}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - ".buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/e2e/test_runai_model_streamer_loader.py::test_correctness_torchax_uni_proc_executor"

  - label: "${TPU_VERSION:-tpu6e} Record Result | Runai Model Streamer Torchax UniProcExecutor"
    key: "${TPU_VERSION:-tpu6e}_record_runai_model_streamer_loader_torchax_uniproc"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_torchax_uniproc"
        allow_failure: true
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "runai_model_streamer_loader"
      CI_STAGE: "CorrectnessTest"
      CI_CATEGORY: "feature support matrix"
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - ".buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_torchax_uniproc"

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Correctness Test | Runai Model Streamer Torchax RayDistributedExecutor"
    key: "${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_torchax_ray_distributed"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - ".buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/e2e/test_runai_model_streamer_loader.py::test_correctness_torchax_ray_distributed_executor"

  - label: "${TPU_VERSION:-tpu6e} Record Result | Runai Model Streamer Torchax RayDistributedExecutor"
    key: "${TPU_VERSION:-tpu6e}_record_runai_model_streamer_loader_torchax_ray_distributed"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_torchax_ray_distributed"
        allow_failure: true
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "runai_model_streamer_loader"
      CI_STAGE: "CorrectnessTest"
      CI_CATEGORY: "feature support matrix"
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - ".buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_runai_model_streamer_loader_torchax_ray_distributed"
