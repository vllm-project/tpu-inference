# The kube steps for ../DCN-Based_P-D_disaggregation.yml, with the same keys. See README.md.

steps:
  #
  # Not run_disagg.sh, which the bare-metal file calls: that builds an image,
  # reads Secret Manager and sudo's. The fleet's counterpart is
  # kubernetes/disagg_multi_host.sh, which brings the same two engines up as
  # processes and which the jax lane already runs for the benchmark half. Its
  # correctness half is what TEST_MODE selects.

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Correctness tests for DCN-based P/D disaggregation"
    key: "${TPU_VERSION:-tpu6e}_DCN_based_P-D_disaggregation_CorrectnessTest"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      MODEL: "Qwen/Qwen3-0.6B"
      INPUT_LEN: "100"
      OUTPUT_LEN: "20"
      NUM_PROMPTS: "20"
      TEST_MODE: "2"
    # Exit 75 is disagg_multi_host.sh saying the TPU runtime refused to open
    # a session - never that the test failed - and it exits so expecting one
    # retry, as the jax lane gives it.
    retry:
      automatic:
        - exit_status: 75
          limit: 1
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/.buildkite/kubernetes/disagg_multi_host.sh

  - label: "${TPU_VERSION:-tpu6e} Record correctness test result for DCN-based P/D disaggregation"
    key: "${TPU_VERSION:-tpu6e}_record_DCN_based_P-D_disaggregation_CorrectnessTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_DCN_based_P-D_disaggregation_CorrectnessTest"
        allow_failure: true
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "DCN-based P/D disaggregation"
      CI_STAGE: "CorrectnessTest"
      CI_CATEGORY: "feature support matrix"
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_DCN_based_P-D_disaggregation_CorrectnessTest

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Performance tests for DCN-based P/D disaggregation"
    key: "${TPU_VERSION:-tpu6e}_DCN_based_P-D_disaggregation_PerformanceTest"
    depends_on:
      - "build_docker_${TPU_VERSION:-tpu6e}"
      - "${TPU_VERSION:-tpu6e}_record_DCN_based_P-D_disaggregation_CorrectnessTest"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      MODEL: "Qwen/Qwen3-0.6B"
      INPUT_LEN: "1024"
      OUTPUT_LEN: "1024"
      NUM_PROMPTS: "20"
      RANDOM_SEED: "10"
      MAX_CONCURRENCY: "10"
      TEST_MODE: "1"
    # Exit 75 is disagg_multi_host.sh saying the TPU runtime refused to open
    # a session - never that the test failed - and it exits so expecting one
    # retry, as the jax lane gives it.
    retry:
      automatic:
        - exit_status: 75
          limit: 1
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/.buildkite/kubernetes/disagg_multi_host.sh

  - label: "${TPU_VERSION:-tpu6e} Record performance test result for DCN-based P/D disaggregation"
    key: "${TPU_VERSION:-tpu6e}_record_DCN_based_P-D_disaggregation_PerformanceTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_DCN_based_P-D_disaggregation_PerformanceTest"
        allow_failure: true
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "DCN-based P/D disaggregation"
      CI_STAGE: "PerformanceTest"
      CI_CATEGORY: "feature support matrix"
    agents:
      queue: "kube"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_DCN_based_P-D_disaggregation_PerformanceTest
