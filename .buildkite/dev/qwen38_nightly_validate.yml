# Dev-only validation, not for main: replays the v7x group of the
# MODEL_IMPL_TYPE=vllm nightly for .buildkite/models/Qwen_Qwen3_8-2_4T-A95B.yml
# alone, uploading the file the way upload_models_and_features.sh does.
# Trigger with DEV_PIPELINE_FILE=.buildkite/dev/qwen38_nightly_validate.yml and
# MODEL_IMPL_TYPE=vllm in the build env (the model's steps are gated on it).
steps:
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: build_docker_tpu7x
    agents:
      queue: cpu_64_core
    timeout_in_minutes: 40
    env:
      BM_INFRA: "true"
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: ":pipeline: Upload the Qwen3.8-2.4T nightly steps (v7x group)"
    agents:
      queue: cpu
    timeout_in_minutes: 10
    commands:
      - |
        export TPU_VERSION=tpu7x TPU_QUEUE_SINGLE=tpu_v7x_2_queue TPU_QUEUE_MULTI=tpu_v7x_8_queue
        export TENSOR_PARALLEL_SIZE_SINGLE=2 TENSOR_PARALLEL_SIZE_MULTI=8
        {
          echo "steps:"
          echo "  - group: \"TPU v7x nightly Tests (vllm): Qwen3.8-2.4T only\""
          echo "    key: \"v7x-group\""
          echo "    depends_on: \"build_docker_tpu7x\""
          echo "    steps:"
          grep -v "^steps:" .buildkite/models/Qwen_Qwen3_8-2_4T-A95B.yml | sed 's/^/      /'
        } | buildkite-agent pipeline upload
