# Dev-only: the nightly kube P/D disaggregated benchmark
# (.buildkite/pipeline_disagg_kube.yml), run on the tpu-inference-dev pipeline
# to validate PR #3839 (decode hang on failed KV pull + proxy connection cap).
#
# Trigger with DEV_PIPELINE_FILE=.buildkite/dev/pd_disagg_kube.yml.
#
# One deliberate difference from the nightly: the nightly builds the benchmark
# image FROM vllm/vllm-tpu:nightly, which does not contain this branch's
# tpu_inference. Here it is built FROM the image this build makes from the
# branch, so the engines run the connector fix as well as the proxy fix.
# Manifest, model, engine flags, sweep and watchdog are unchanged.

x-disagg-image: &disagg_image "us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/tpu-inference-ci/disagg-benchmark:kube-dev-${BUILDKITE_BUILD_NUMBER}"

steps:
  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: "build_docker_tpu7x"
    agents:
      queue: cpu_64_core
    timeout_in_minutes: 60
    retry:
      automatic:
        - exit_status: "*"
          limit: 3
    env:
      BM_INFRA: "true"
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: ":docker: Build Disagg Benchmark Image (on branch image)"
    key: "build_kube_disagg_image"
    depends_on: "build_docker_tpu7x"
    agents:
      queue: cpu_64_core
    env:
      WORKLOAD_IMAGE: *disagg_image
    commands:
      - |
        set -euo pipefail
        gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
        BASE_IMAGE="$$(buildkite-agent meta-data get ci-image-tpu7x)"
        echo "--- Base image (this branch): $$BASE_IMAGE"
        docker build --pull --build-arg BASE_IMAGE="$$BASE_IMAGE" \
          -f .buildkite/kubernetes/benchmark.Dockerfile \
          -t "$$WORKLOAD_IMAGE" .buildkite/kubernetes
        echo "--- Verifying the image carries both fixes"
        docker run --rm --entrypoint python3 "$$WORKLOAD_IMAGE" -c \
          "from tpu_inference.distributed.tpu_connector import TPUConnector, TPUConnectorWorker; assert hasattr(TPUConnector, 'get_block_ids_with_load_errors') and hasattr(TPUConnectorWorker, 'get_block_ids_with_load_errors'), 'connector fix missing'; print('connector fix: present')"
        docker run --rm --entrypoint grep "$$WORKLOAD_IMAGE" -q CLIENT_LIMITS /opt/kube/toy_proxy_server.py
        echo "proxy fix: present"
        docker push "$$WORKLOAD_IMAGE"

  - label: ":kubernetes: :tpu: Kube P/D Disaggregated Benchmark"
    key: "kube_pd_disagg_benchmark"
    depends_on: "build_kube_disagg_image"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      WORKLOAD_IMAGE: *disagg_image
      TPU_VERSION: "tpu7x"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - >-
        /opt/launcher/launch
        --manifest .buildkite/kubernetes/manifests/workloads/qwen3-coder-480b-1p1d.yaml
        --env TPU_VERSION
        --env DISAGG_CONCURRENCIES
