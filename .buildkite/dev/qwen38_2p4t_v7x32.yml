# Bring up Qwen/Qwen3.8-2.4T-A95B-FP8 on a v7x-32 slice (4 hosts, 32 devices).
#
# Weights: 2469 GB of parameters (2371 GB of that is the 512 routed experts in
# block-wise fp8) loaded with runai_streamer. At model=8/attn_dp=4 with the
# attention and gated-delta-net projections quantized to fp8 at load time, that
# is ~75.5 GB per device against the 94.74 GB each v7x JAX device reports, i.e.
# ~80% of HBM before any KV cache.
#
# The source is chosen at runtime: qwen38_2p4t_preflight.sh looks for a copy of
# the checkpoint mounted on every host of the slice and, finding one, bind
# mounts it read-only and points MODEL_PATH at it; otherwise the run streams
# from object storage as before.
#
# One server, several legs: a smoke test and a perf benchmark
# (qwen38_2p4t_client.sh), then GPQA/GSM8K/MMLU through either accuracy
# harness -- qwen38_2p4t_eval.sh for this repo's benchmark_serving.py fork, or
# qwen38_2p4t_eval_std.sh for stock lm-evaluation-harness. Loading and
# precompiling costs ~55 min, so everything that needs this model runs against
# the one instance. BENCH_SWEEP selects the perf legs, EVAL_SUITE the fork's
# accuracy ones and STD_EVAL_SUITE lm_eval's; any of the three can be narrowed
# to isolate a variable, and set to "none" to skip that harness entirely.
#
# Each perf leg is bracketed by a /metrics scrape, because the client-visible
# TTFT is `queue_time + prefill_time` fused and cannot attribute a slow first
# token to either. The server splits them, and also exports an exact prefill
# token counter and the per-step token histogram that says whether
# MAX_NUM_BATCHED_TOKENS is actually the binding constraint. METRICS_ENABLE=0
# turns it off; METRICS_SAMPLE_S=0 keeps the endpoints but drops the timeseries.
#
# Trigger with DEV_PIPELINE_FILE=.buildkite/dev/qwen38_2p4t_v7x32.yml
#
# tpu_v7x_32_queue has exactly one agent, so this monopolises the org's only
# 32-chip slice for the duration. No depends_on and no USE_PREBUILT_IMAGE:
# run_multihost.sh builds and pushes its own image and would double the registry
# prefix if setup_environment had already run.
steps:
  - label: ":whale: Qwen3.8-2.4T-A95B-FP8 (v7x-32, memory profile of the 8k/1k steady state)"
    key: qwen38_2p4t_v7x32
    agents:
      queue: tpu_v7x_32_queue
    timeout_in_minutes: 300
    env:
      TPU_VERSION: "tpu7x"        # run_multihost.sh exits 0 silently without this
      MODEL_IMPL_TYPE: "vllm"     # no flax_nnx impl for Qwen3_5MoeForCausalLM
      NEW_MODEL_DESIGN: "1"       # required: sharding.validate() rejects attn_dp>1 without it
      # Health-wait budget. Build tc#943 was killed by the 7200s default with the
      # runai streamer at 63% (180271/287119 tensors) after 1:58:40 and still
      # advancing. MOE_STAGE_WEIGHTS_ON_HOST since cut the load from 3h34m to
      # 33m (tc#951), and AOT precompilation adds ~20 min ahead of /health now
      # that SKIP_JAX_PRECOMPILE is off, so ~55 min is the expectation.
      # Deliberately left at 5h rather than trimmed to fit: the budget exists to
      # bound a pathological run, and a load regression is far more useful as a
      # slow progress tail than as a killed job. timeout_in_minutes above has to
      # exceed it or Buildkite kills the job first.
      # 4h. This build runs one perf leg and no evals: ~33 min load, a
      # precompile that should be warm from #26/#30, and ~10 min of benchmark.
      # The budget covers serve for the whole job, not just bring-up;
      # timeout_in_minutes above has to exceed it.
      VLLM_ENGINE_READY_TIMEOUT_S: "14400"
      # Mirror engine stats into the Buildkite log during the eval leg. Read by
      # run_multihost.sh on the host, so it belongs here rather than in
      # MULTIHOST_ENV_VARS. 120s is coarse enough not to bloat the log over a
      # multi-hour eval and fine enough to pin down when an engine stops
      # retiring requests -- tc#960 sat wedged for two hours indistinguishably
      # from a slow tail because nothing but the client progress bar was visible.
      SERVE_LOG_TAIL_INTERVAL_S: "120"
      # Tail /root/vllm_serve.log into the Buildkite log every 60s while waiting
      # for /health. Read by wait_for_server in run_multihost.sh (on the host,
      # not inside the container, so it belongs here and not in
      # MULTIHOST_ENV_VARS). Without it a multi-hour weight load is
      # indistinguishable from a hang until the job ends.
      VLLM_SERVER_WAIT_LOG_EVERY_S: "60"
      # Append-only build output. The default tty progress renderer redraws the
      # whole step table on every update, which produced 4.9 MB of log in under
      # five minutes on the first attempt and would bury a real serve failure.
      BUILDKIT_PROGRESS: "plain"
    commands:
      - |
        set -euo pipefail
        ART="$$PWD/dev_artifacts"; mkdir -p "$$ART"
        export EXTRA_DOCKER_ARGS="-v $$ART:/workspace/artifacts"

        # Persistent JAX compilation cache on each host's local disk.
        # run_multihost.sh sets up no cache at all (unlike run_in_docker.sh,
        # which rsyncs gs://ullm-ci-cache/jax_cache onto /mnt/disks/persist),
        # so without this every build recompiles from scratch. /tmp is the same
        # disk run_multihost.sh already puts HOST_HF_HOME on, so it is known to
        # exist on all four hosts; /mnt/disks/persist is not assumed here.
        # Bind-mounted rather than left inside the container because the `node`
        # containers are torn down at the end of every build.
        # --ulimit: libstreamer wants ~64 file descriptors per reader thread and
        # aborts with "Increase process fd limit or decrease the concurrency
        # level" if it cannot get them. At RUNAI_STREAMER_CONCURRENCY=64 that is
        # ~4096; 65536 leaves headroom. The serve script raises its own soft
        # limit too, but that only covers the head -- the three Ray workers load
        # weights as well and only get what `docker run` gives them.
        MULTIHOST_DOCKER_ARGS="-v /tmp/jax_cache_tpu7x:/root/jax_cache --ulimit nofile=65536:65536"

        # Ask every host in the slice two questions before committing to a
        # three-hour load: is there a locally-mounted copy of the checkpoint,
        # and is there room for the compilation cache. Both answers are
        # all-or-nothing across the slice -- see the script for why. It only
        # ever prints these three assignments, and defaults here cover the case
        # where it cannot run at all.
        CKPT_MOUNT=""; CACHE_MIN_FREE_MB=0; CACHE_WRITABLE=0
        eval "$$(bash .buildkite/dev/qwen38_2p4t_preflight.sh || true)"

        # A local copy of the weights is bind-mounted read-only at the same path
        # it has on the host, so every rank resolves the same MODEL_PATH. The
        # path is discovered, not written down: this file is public and the disk
        # is attached wherever the operator likes.
        CKPT_ENV=""
        if [ -n "$$CKPT_MOUNT" ]; then
          MULTIHOST_DOCKER_ARGS="$$MULTIHOST_DOCKER_ARGS -v $$CKPT_MOUNT:$$CKPT_MOUNT:ro"
          CKPT_ENV="MODEL_PATH=$$CKPT_MOUNT"
          echo "--- weights: local mount on all hosts ($$CKPT_MOUNT)"
        else
          echo "--- weights: no usable local mount, streaming from object storage"
        fi

        # Compilation-cache disk guard. SKIP_JAX_PRECOMPILE is off from this
        # build on, so the cache now takes an entry per shape bucket instead of
        # the handful the lazy path produced (tc#947: 8 entries, 90 MB). The
        # checkpoint disks are read-only, so the cache has nowhere to live but
        # the host root filesystem, which had 54 GB free on tc#947.
        #
        # MAX_GB makes JAX evict LRU entries itself -- its default is -1,
        # unlimited. MIN_FREE_GB is the point at which caching is abandoned
        # rather than risked: a cold recompile costs minutes, an ENOSPC three
        # hours into a load costs the build. The serve script re-checks both
        # from inside the container and runs a watchdog during the run.
        JAX_CACHE_MAX_GB=20
        JAX_CACHE_MIN_FREE_GB=25
        CACHE_ENV="$$(printf '%s\n' \
          'VLLM_XLA_CACHE_PATH=/root/jax_cache' \
          'JAX_COMPILATION_CACHE_DIR=/root/jax_cache' \
          "JAX_COMPILATION_CACHE_MAX_SIZE=$$((JAX_CACHE_MAX_GB * 1024 * 1024 * 1024))")"
        if [ "$$CACHE_WRITABLE" != "1" ] || [ "$$CACHE_MIN_FREE_MB" -lt "$$((JAX_CACHE_MIN_FREE_GB * 1024))" ]; then
          echo "--- :warning: persistent JAX cache DISABLED cluster-wide (writable=$$CACHE_WRITABLE min_free=$${CACHE_MIN_FREE_MB}MB floor=$$((JAX_CACHE_MIN_FREE_GB * 1024))MB)"
          CACHE_ENV="VLLM_DISABLE_COMPILE_CACHE=1"
        else
          echo "--- jax cache: enabled, cap $${JAX_CACHE_MAX_GB}GB, min free across slice $${CACHE_MIN_FREE_MB}MB"
        fi

        export MULTIHOST_DOCKER_ARGS

        # Memory profile: what is actually in the forward-pass scratch?
        #
        # We have never measured it. Every scratch figure quoted so far came
        # from subtracting an `Init kv-cache` bytes_in_use snapshot from a
        # number scraped out of an XLA OOM string -- 16.21 GiB at aggregate
        # 65536 from #27, 17.90 from #28 for the SAME function with strictly
        # smaller shapes. That contradiction is the whole reason for this
        # build: the inference method is not reliable enough to plan with, and
        # an attempt to decompose it per-buffer was wrong twice (it mistook
        # `input_size` in a ragged_gather_reduce TuningKey, which is the length
        # of an int32 index array, for a materialised activation buffer).
        #
        # Two independent instruments, both new here.
        #
        # 1. memory_analysis() at the precompile hook
        #    (compilation_manager.py, `_log_memory_analysis`). XLA already
        #    computes a buffer assignment for every shape it compiles; this
        #    just logs it. Each bucket now reports
        #      temp / argument / output / alias / generated_code
        #    where `temp` IS the scratch we have been inferring. It costs
        #    nothing, needs no profiler, and covers every compiled bucket
        #    rather than only the one that happened to OOM -- so one build
        #    yields the whole scratch-vs-token-count curve. `argument` and
        #    `alias` are a bonus: they say how much of the program's footprint
        #    is the resident weights and KV being passed in, which is exactly
        #    the term the #27/#28 subtraction was guessing at.
        #
        # 2. PHASED_PROFILING_DIR, which needs no code change at all. The
        #    runner auto-captures a jax.profiler trace on the first
        #    prefill-heavy (>=0.9 of scheduled tokens are prefill),
        #    decode-heavy (<=0.2) and mixed (0.4-0.6) batch it sees, and logs
        #    the batch composition next to each. Pointed inside
        #    /workspace/artifacts so the traces land in dev_artifacts and get
        #    uploaded; without that they die with the container.
        #
        #    ⚠️ It is NOT established that this yields memory data. The capture
        #    is a plain jax.profiler trace with tpu_trace_mode=TRACE_COMPUTE
        #    (runner/utils.py:582-588); nothing memory-specific is requested
        #    and nothing is excluded. Whether tensorboard-plugin-profile's
        #    `memory_viewer` (peak HBM by buffer, with HLO op names -- the
        #    composition we actually want) populates from it is an empirical
        #    question this build answers. If it does not, the fallback is an
        #    XLA buffer-assignment dump via --xla_dump_to, which is certain to
        #    work and merely verbose.
        #
        #    PROFILE_SINGLE_DEVICE=1 traces one chip per task instead of all
        #    eight. The hosts run the same program on the same shapes, so one
        #    chip's trace is representative, and the full-slice version would
        #    be ~8x the bytes for no extra information.
        #
        # SERVE CONFIG IS #26's, reverted from 9bf32a3c9 rather than retyped:
        # model=8 x attn_dp=4, the fp8 requantization at block 512,
        # MAX_NUM_SEQS=64 (256 concurrent), NUM_GPU_BLOCKS_OVERRIDE=19456,
        # MAX_NUM_BATCHED_TOKENS=2048, MAX_MODEL_LEN=40960. #26 is the
        # best-throughput configuration we have and #30 confirmed it costs no
        # accuracy, so it is the one whose memory behaviour is worth
        # characterising. Reproducing Init model 75.87 / Init kv-cache 87.19 is
        # the cheap check that the revert worked.
        #
        # BENCH_SWEEP=256:512 -- one leg, at the max fitted batch, 2 full
        # waves. No conc-8 control and no sweep: this build measures memory,
        # not throughput, and #26 already has the perf numbers at both ends of
        # the curve. 512 prompts is enough for the phased profiler to encounter
        # all three batch compositions (wave boundaries are prefill-heavy, the
        # long middle of a wave is decode-heavy, the transitions are mixed) and
        # short enough that profiling overhead does not dominate the job.
        #
        # STD_EVAL_SUITE=none and EVAL_SUITE=none. #30 just measured accuracy
        # on this exact configuration -- GPQA 0.8990, GSM8K 0.9788, MMLU 0.8928,
        # all inside half a sigma of the stock baseline -- so there is nothing
        # to re-establish and ~90 min to save.
        #
        # Expect ~50 min: 33 min load, a precompile that should be warm from
        # #26/#30 (5.34 s per shape rather than 50-105 s), and ~10 min of
        # benchmark. VLLM_ENGINE_READY_TIMEOUT_S is cut to 4h accordingly.
        #
        # Container environment for the head *and* all three workers. Env vars
        # inlined into the serve command would only reach the head process;
        # USE_BATCHED_RPA_KERNEL in particular is read at import time by
        # runner/kv_cache.py to pick the kernel module, so it has to be in the
        # environment of every Ray worker container. USE_BATCHED_RPA_SEQ_ON_LANE
        # matters doubly here: it selects KVLayout.SEQ_ALONG_LANE, which is what
        # makes the per-device page 65,536 B instead of 131,072 B, and it is
        # also the flag that tells the attn_dp heuristic to divide by 8.
        export MULTIHOST_ENV_VARS="$$(printf '%s\n' \
          'MODEL_IMPL_TYPE=vllm' \
          'NEW_MODEL_DESIGN=1' \
          'USE_BATCHED_RPA_KERNEL=1' \
          'USE_BATCHED_RPA_SEQ_ON_LANE=1' \
          'USE_MOE_EP_KERNEL=0' \
          'VLLM_INCREMENTAL_FP8_LOADING=1' \
          'MOE_STAGE_WEIGHTS_ON_HOST=1' \
          'VLLM_XLA_CHECK_RECOMPILATION=0' \
          'SKIP_JAX_PRECOMPILE=0' \
          'RUNAI_STREAMER_CONCURRENCY=64' \
          'RUNAI_STREAMER_MEMORY_LIMIT=128000000000' \
          'RUNAI_STREAMER_LOG_LEVEL=INFO' \
          'RUNAI_STREAMER_LOG_TO_STDERR=1' \
          'PHASED_PROFILING_DIR=/workspace/artifacts/profiles' \
          'PROFILE_SINGLE_DEVICE=1' \
          'TPU_WEIGHT_LOAD_PROFILE=1' \
          'TPU_WEIGHT_LOAD_PROFILE_EVERY=10000' \
          'QUANTIZE_BF16_LINEAR_PATTERNS=re:.*self_attn\..*,re:.*linear_attn.(in_proj_qkv|in_proj_z|in_proj_b|in_proj_a|out_proj)$$' \
          'QUANTIZE_BF16_LINEAR_BLOCK_SIZE=512' \
          'TENSOR_PARALLEL_SIZE=32' \
          'ATTN_DP_SIZE=4' \
          'MAX_MODEL_LEN=40960' \
          'MAX_NUM_SEQS=64' \
          'NUM_GPU_BLOCKS_OVERRIDE=19456' \
          'MAX_NUM_BATCHED_TOKENS=2048' \
          'GPU_MEMORY_UTILIZATION=0.92' \
          'BLOCK_SIZE=128' \
          'KV_CACHE_DTYPE=fp8' \
          'INPUT_LEN=8192' \
          'OUTPUT_LEN=1024' \
          'NUM_PROMPTS=512' \
          'MAX_CONCURRENCY=256' \
          'BENCH_SWEEP=256:512' \
          'NUM_WARMUPS=32' \
          'EVAL_SUITE=none' \
          'STD_EVAL_SUITE=none' \
          'GSM8K_REASONING_EFFORT=low' \
          'GSM8K_CONCURRENCY=64' \
          'GSM8K_MAX_TOKENS=1024' \
          'GSM8K_TIMEOUT_S=7200' \
          'BENCH_REQUEST_TIMEOUT_S=7200' \
          "JAX_CACHE_MAX_GB=$$JAX_CACHE_MAX_GB" \
          "JAX_CACHE_MIN_FREE_GB=$$JAX_CACHE_MIN_FREE_GB" \
          $$CACHE_ENV \
          $$CKPT_ENV)"
        echo "--- effective MULTIHOST_ENV_VARS"; printf '%s\n' "$$MULTIHOST_ENV_VARS"
        echo "--- effective MULTIHOST_DOCKER_ARGS: $$MULTIHOST_DOCKER_ARGS"

        # Three client legs against one server: perf, then each accuracy
        # harness. `&&`, not `;` -- if the perf leg cannot get a completion out
        # of the server there is nothing for the evals to score, and each eval
        # leg records its own per-dataset failures internally rather than
        # aborting on the first. The fork-based leg stays in the chain even
        # though EVAL_SUITE=none makes it a no-op here: it exits 0 immediately,
        # and leaving it wired up means flipping one variable brings the old
        # harness back for a side-by-side without editing the command.
        #
        # The run's exit status is stashed instead of propagated so the artifact
        # upload below still happens; without that, a failure here means no
        # serve log, no bench.json and no eval output to diagnose it with. The
        # last command in this step re-raises it.
        set +e
        .buildkite/scripts/run_multihost.sh \
          "bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_serve.sh" \
          "bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_client.sh && bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_eval.sh && bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_eval_std.sh"
        echo $$? > "$$PWD/dev_artifacts/.run_rc"
        set -e
      - sudo -n chown -R "$$(id -u):$$(id -g)" dev_artifacts 2>/dev/null || sudo -n chmod -R a+rX dev_artifacts || true
      - buildkite-agent artifact upload "dev_artifacts/**/*"
      - exit "$$(cat dev_artifacts/.run_rc 2>/dev/null || echo 1)"
