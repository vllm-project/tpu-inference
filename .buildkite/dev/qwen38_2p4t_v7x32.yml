# Bring up Qwen/Qwen3.8-2.4T-A95B-FP8 on a v7x-32 slice (4 hosts, 32 devices).
#
# Weights: 2469 GB of parameters (2371 GB of that is the 512 routed experts in
# block-wise fp8) loaded with runai_streamer. At model=16/attn_dp=2 that is
# ~79.7 GB per device against the 96 GB each v7x JAX device sees, i.e. ~83% of
# HBM before any KV cache.
#
# The source is chosen at runtime: qwen38_2p4t_preflight.sh looks for a copy of
# the checkpoint mounted on every host of the slice and, finding one, bind
# mounts it read-only and points MODEL_PATH at it; otherwise the run streams
# from object storage as before.
#
# One server, several legs: a smoke test and a perf benchmark
# (qwen38_2p4t_client.sh), then GPQA/GSM8K/MMLU through either accuracy
# harness -- qwen38_2p4t_eval.sh for this repo's benchmark_serving.py fork, or
# qwen38_2p4t_eval_std.sh for stock lm-evaluation-harness. Loading and
# precompiling costs ~55 min, so everything that needs this model runs against
# the one instance. BENCH_SWEEP selects the perf legs, EVAL_SUITE the fork's
# accuracy ones and STD_EVAL_SUITE lm_eval's; any of the three can be narrowed
# to isolate a variable, and set to "none" to skip that harness entirely.
#
# Each perf leg is bracketed by a /metrics scrape, because the client-visible
# TTFT is `queue_time + prefill_time` fused and cannot attribute a slow first
# token to either. The server splits them, and also exports an exact prefill
# token counter and the per-step token histogram that says whether
# MAX_NUM_BATCHED_TOKENS is actually the binding constraint. METRICS_ENABLE=0
# turns it off; METRICS_SAMPLE_S=0 keeps the endpoints but drops the timeseries.
#
# Trigger with DEV_PIPELINE_FILE=.buildkite/dev/qwen38_2p4t_v7x32.yml
#
# tpu_v7x_32_queue has exactly one agent, so this monopolises the org's only
# 32-chip slice for the duration. No depends_on and no USE_PREBUILT_IMAGE:
# run_multihost.sh builds and pushes its own image and would double the registry
# prefix if setup_environment had already run.
steps:
  - label: ":whale: Qwen3.8-2.4T-A95B-FP8 (v7x-32, model=16 x attn_dp=2, EP=32)"
    key: qwen38_2p4t_v7x32
    agents:
      queue: tpu_v7x_32_queue
    timeout_in_minutes: 660
    env:
      TPU_VERSION: "tpu7x"        # run_multihost.sh exits 0 silently without this
      MODEL_IMPL_TYPE: "vllm"     # no flax_nnx impl for Qwen3_5MoeForCausalLM
      NEW_MODEL_DESIGN: "1"       # required: sharding.validate() rejects attn_dp>1 without it
      # Health-wait budget. Build tc#943 was killed by the 7200s default with the
      # runai streamer at 63% (180271/287119 tensors) after 1:58:40 and still
      # advancing. MOE_STAGE_WEIGHTS_ON_HOST since cut the load from 3h34m to
      # 33m (tc#951), and AOT precompilation adds ~20 min ahead of /health now
      # that SKIP_JAX_PRECOMPILE is off, so ~55 min is the expectation.
      # Deliberately left at 5h rather than trimmed to fit: the budget exists to
      # bound a pathological run, and a load regression is far more useful as a
      # slow progress tail than as a killed job. timeout_in_minutes above has to
      # exceed it or Buildkite kills the job first.
      # Raised 5h -> 10h for the xhigh eval leg. Measured on tc#959: at
      # reasoning_effort=xhigh, GPQA requests retire at ~122s each at conc 32,
      # i.e. ~3900s of latency per request, because most of them run the 32768
      # output cap to exhaustion rather than stopping on EOS. 198 of those is
      # ~6.7h, against the ~35 min the low-effort run took. This budget covers
      # serve for the whole job, not just bring-up, so it has to span the evals.
      VLLM_ENGINE_READY_TIMEOUT_S: "36000"
      # Mirror engine stats into the Buildkite log during the eval leg. Read by
      # run_multihost.sh on the host, so it belongs here rather than in
      # MULTIHOST_ENV_VARS. 120s is coarse enough not to bloat the log over a
      # multi-hour eval and fine enough to pin down when an engine stops
      # retiring requests -- tc#960 sat wedged for two hours indistinguishably
      # from a slow tail because nothing but the client progress bar was visible.
      SERVE_LOG_TAIL_INTERVAL_S: "120"
      # Tail /root/vllm_serve.log into the Buildkite log every 60s while waiting
      # for /health. Read by wait_for_server in run_multihost.sh (on the host,
      # not inside the container, so it belongs here and not in
      # MULTIHOST_ENV_VARS). Without it a multi-hour weight load is
      # indistinguishable from a hang until the job ends.
      VLLM_SERVER_WAIT_LOG_EVERY_S: "60"
      # Append-only build output. The default tty progress renderer redraws the
      # whole step table on every update, which produced 4.9 MB of log in under
      # five minutes on the first attempt and would bury a real serve failure.
      BUILDKIT_PROGRESS: "plain"
    commands:
      - |
        set -euo pipefail
        ART="$$PWD/dev_artifacts"; mkdir -p "$$ART"
        export EXTRA_DOCKER_ARGS="-v $$ART:/workspace/artifacts"

        # Persistent JAX compilation cache on each host's local disk.
        # run_multihost.sh sets up no cache at all (unlike run_in_docker.sh,
        # which rsyncs gs://ullm-ci-cache/jax_cache onto /mnt/disks/persist),
        # so without this every build recompiles from scratch. /tmp is the same
        # disk run_multihost.sh already puts HOST_HF_HOME on, so it is known to
        # exist on all four hosts; /mnt/disks/persist is not assumed here.
        # Bind-mounted rather than left inside the container because the `node`
        # containers are torn down at the end of every build.
        # --ulimit: libstreamer wants ~64 file descriptors per reader thread and
        # aborts with "Increase process fd limit or decrease the concurrency
        # level" if it cannot get them. At RUNAI_STREAMER_CONCURRENCY=64 that is
        # ~4096; 65536 leaves headroom. The serve script raises its own soft
        # limit too, but that only covers the head -- the three Ray workers load
        # weights as well and only get what `docker run` gives them.
        MULTIHOST_DOCKER_ARGS="-v /tmp/jax_cache_tpu7x:/root/jax_cache --ulimit nofile=65536:65536"

        # Ask every host in the slice two questions before committing to a
        # three-hour load: is there a locally-mounted copy of the checkpoint,
        # and is there room for the compilation cache. Both answers are
        # all-or-nothing across the slice -- see the script for why. It only
        # ever prints these three assignments, and defaults here cover the case
        # where it cannot run at all.
        CKPT_MOUNT=""; CACHE_MIN_FREE_MB=0; CACHE_WRITABLE=0
        eval "$$(bash .buildkite/dev/qwen38_2p4t_preflight.sh || true)"

        # A local copy of the weights is bind-mounted read-only at the same path
        # it has on the host, so every rank resolves the same MODEL_PATH. The
        # path is discovered, not written down: this file is public and the disk
        # is attached wherever the operator likes.
        CKPT_ENV=""
        if [ -n "$$CKPT_MOUNT" ]; then
          MULTIHOST_DOCKER_ARGS="$$MULTIHOST_DOCKER_ARGS -v $$CKPT_MOUNT:$$CKPT_MOUNT:ro"
          CKPT_ENV="MODEL_PATH=$$CKPT_MOUNT"
          echo "--- weights: local mount on all hosts ($$CKPT_MOUNT)"
        else
          echo "--- weights: no usable local mount, streaming from object storage"
        fi

        # Compilation-cache disk guard. SKIP_JAX_PRECOMPILE is off from this
        # build on, so the cache now takes an entry per shape bucket instead of
        # the handful the lazy path produced (tc#947: 8 entries, 90 MB). The
        # checkpoint disks are read-only, so the cache has nowhere to live but
        # the host root filesystem, which had 54 GB free on tc#947.
        #
        # MAX_GB makes JAX evict LRU entries itself -- its default is -1,
        # unlimited. MIN_FREE_GB is the point at which caching is abandoned
        # rather than risked: a cold recompile costs minutes, an ENOSPC three
        # hours into a load costs the build. The serve script re-checks both
        # from inside the container and runs a watchdog during the run.
        JAX_CACHE_MAX_GB=20
        JAX_CACHE_MIN_FREE_GB=25
        CACHE_ENV="$$(printf '%s\n' \
          'VLLM_XLA_CACHE_PATH=/root/jax_cache' \
          'JAX_COMPILATION_CACHE_DIR=/root/jax_cache' \
          "JAX_COMPILATION_CACHE_MAX_SIZE=$$((JAX_CACHE_MAX_GB * 1024 * 1024 * 1024))")"
        if [ "$$CACHE_WRITABLE" != "1" ] || [ "$$CACHE_MIN_FREE_MB" -lt "$$((JAX_CACHE_MIN_FREE_GB * 1024))" ]; then
          echo "--- :warning: persistent JAX cache DISABLED cluster-wide (writable=$$CACHE_WRITABLE min_free=$${CACHE_MIN_FREE_MB}MB floor=$$((JAX_CACHE_MIN_FREE_GB * 1024))MB)"
          CACHE_ENV="VLLM_DISABLE_COMPILE_CACHE=1"
        else
          echo "--- jax cache: enabled, cap $${JAX_CACHE_MAX_GB}GB, min free across slice $${CACHE_MIN_FREE_MB}MB"
        fi

        export MULTIHOST_DOCKER_ARGS

        # Benchmark shape: 8192 in / 1024 out, up from 1024/128. Three knobs
        # move together with it and none of them is optional.
        #
        # MAX_MODEL_LEN has to clear 8192+1024=9216 or every request is
        # rejected; 12288 leaves room for the accuracy leg's 2048-token
        # reasoning budget too.
        #
        # NUM_PROMPTS 64 -> 128 is the variance ask. Every request is exactly
        # 8192/1024 (RandomDataset range_ratio defaults to 0) and --ignore-eos
        # pins the output, so the sample is 16 full waves of identical work
        # rather than 4.
        #
        # MAX_NUM_SEQS 32 -> 80 and BENCH_SWEEP are this run's whole point: the
        # dedicated batch-size run the comment below has been deferring.
        #
        # The batch the server can hold is dp_size x max_num_seqs
        # (tpu_runner.py:1049), so 80 gives 160 -- the DP scheduler hands each
        # of the two ranks the full max_num_seqs (dp_scheduler.py:561) and half
        # the block pool (:591), i.e. 80 requests against 6144 blocks per rank.
        # A 9216-token request holds 72 blocks, so peak demand is 5760 of 6144
        # per rank: 94% utilisation, but preemption is impossible by
        # construction because no rank can admit an 81st request. That matters
        # here -- preemption under attn_dp>=2 leaks mamba slots.
        #
        # 160 is one step below the HBM ceiling of 172. Derivation, calibration
        # against tc#960 and build #2, and the formula for other configs are in
        # experiments/.../KV_HBM_BATCH_SIZE_MODEL.md; the short version is that
        # one recurrent slot costs 24.35 attention blocks, so each concurrent
        # request costs 72 + 24.35 = 96.35 block-equivalents out of a measured
        # budget of 16,757, and 160 spends 92.3% of it.
        #
        # BENCH_SWEEP runs two legs against the one server. Latency and
        # throughput are the same measurement read at two ends of the
        # concurrency curve: at conc 8 the TTFT/TPOT numbers are per-request
        # latency on a near-idle machine and directly comparable to
        # tc#953/tc#959/tc#960/tc#962/#2; at conc 160 they are queueing delay and
        # the throughput number is the one that means something. Keeping the
        # conc-8 leg is what makes the throughput gain attributable -- on its
        # own a saturated run cannot separate "decode got slower" from "the
        # batch got bigger". MAX_CONCURRENCY stays 8 so bench.json keeps
        # meaning what it meant in every earlier MANIFEST.
        #
        # n=640 at conc 160 is four full waves, matching the 16 waves the conc-8
        # leg gets from n=128. It is also the cheaper leg in wall-clock terms:
        # chunked prefill caps the engine at max_num_batched_tokens per rank per
        # step regardless of batch size, so 5x the prompts costs well under 5x
        # the time.
        #
        # This build finishes the standard-harness accuracy baseline that #20
        # started, so it is the mirror image of #17-#19: no load-time
        # quantization at all, and the whole accuracy budget spent on lm_eval
        # rather than on the perf sweep. QUANTIZE_BF16_LINEAR_PATTERNS is absent
        # below -- deliberately, see the note there -- so this is the stock
        # checkpoint exactly as build #12 and #20 ran it.
        #
        # #20 left two things unfinished, and this build changes exactly those.
        #
        # 1. GPQA_SAMPLING=spec. #20 ran greedy (temperature=0), as every run
        #    before it did. 21 of 198 generations then ran to the 32768-token
        #    wall and scored 0.143, pulling 0.881 down to 0.803; the 177 that
        #    finished averaged only 8120 output tokens, so this is a runaway
        #    tail, not a long-thinking model. Greedy is off-spec for Qwen3.8 --
        #    the card asks for temperature=1.0, top_p=0.95, top_k=20, min_p=0.0
        #    and names "endless repetition" as what greedy costs you. This is
        #    the single-variable test of that. Everything else about the leg is
        #    #20's, and lm_eval pins seed=1234 per request so the run is still
        #    reproducible. Qwen publishes no GPQA prompt or eval config, so the
        #    fork's "Answer with only the letter in parentheses" system prompt
        #    is not the sanctioned alternative and is deliberately not adopted:
        #    it would forfeit the comparability to a stock GPU run that is the
        #    entire point of this harness.
        #
        # 2. MMLU should actually run. In #20 the leg died before it started --
        #    lm_eval scores multiple_choice by loglikelihood, which reaches
        #    vLLM as prompt_logprobs, and compute_and_gather_prompt_logprobs
        #    returned arrays still sharded over the token axis. device_get on
        #    one of those under Ray multihost raises "Fetching value for
        #    jax.Array that spans non-addressable devices" and takes the engine
        #    with it. They are now replicated before the host copy, the same
        #    thing sample() has always done to next_tokens. If that fix is
        #    wrong the failure mode is unchanged -- the engine dies on the
        #    probe -- and MMLU stays last precisely so GPQA and GSM8K are
        #    already recorded when it does.
        #
        # EVAL_SUITE=none, STD_EVAL_SUITE=gpqa,gsm8k,mmlu: the accuracy leg is
        # qwen38_2p4t_eval_std.sh, not qwen38_2p4t_eval.sh. Our numbers so far
        # (GPQA 0.899-0.904 at xhigh across tc#962 and #2) come from this repo's
        # fork of benchmark_serving.py and are comparable to our own runs and to
        # nothing else. The point of this build is a set of numbers that can sit
        # next to a GPU run of the same checkpoint, which means stock lm_eval
        # task definitions: gpqa_diamond_cot_zeroshot, gsm8k 5-shot, and the
        # full 14042-question mmlu rather than the fork's 1000-question subset.
        # Running the whole of MMLU also sidesteps the fork's reproducibility
        # defect -- unsorted os.listdir plus unseeded truncation -- by not
        # truncating.
        #
        # BENCH_SWEEP is cut to one short leg for the same reason: #12 already
        # measured this exact configuration's perf, so re-measuring it costs
        # ~40 min of a 480 min build that MMLU needs. The leg is kept rather
        # than dropped because BENCH_SWEEP has no "off" -- an empty value falls
        # back to MAX_CONCURRENCY:NUM_PROMPTS -- and because a perf leg that
        # completes is the cheapest proof the server is healthy before three
        # hours of evals are queued against it.
        #
        # The three *_TIMEOUT_S below are caps, not estimates, and they are
        # sized so that the worst case still fits inside the job rather than so
        # that each leg gets what it might want. Two ceilings bound them:
        # timeout_in_minutes 660 and VLLM_ENGINE_READY_TIMEOUT_S 36000 (600
        # min), which covers serve for the whole job. Load plus precompile plus
        # the short perf leg is ~90 min, so the evals get 480: 10800 + 7200 +
        # 10800 = 480 exactly, and the expected case is far below it.
        # Measured on the fork harness at the same concurrency, GPQA at xhigh is
        # ~3300s (#17 3312, #19 3325, #2 3241) -- tc#960's 24935s was the KV
        # pool defect, not the workload -- and low-effort GSM8K was 765s. MMLU
        # here is loglikelihood, so its 56168 requests are prefill plus one
        # token each rather than generations. Expect ~4.5h total, not 9.5.
        #
        # NUM_GPU_BLOCKS_OVERRIDE is the fix for the defect that made tc#960's
        # eval unscoreable. The runner sizes the attention pool against mamba's
        # real footprint and allocates ~15,150 blocks, but it does so
        # worker-side, after engine-core has already built the scheduler's
        # block pool from vLLM's uniform hybrid sizing -- and the
        # `num_gpu_blocks_override` it sets never crosses the RPC boundary. So
        # tc#960 ran with 15,150 blocks of HBM reserved and 661 admitted against
        # (83,822 tokens, "Maximum concurrency ... 2.05x"), 13x oversubscribed
        # at conc 32, and lost 28 of 198 GPQA questions to preemption.
        # Passing it on the serve command line puts it in the engine-core
        # config, which is the only place get_kv_cache_config() reads it.
        #
        # 12288 is held fixed across the batch-size change so the attention pool
        # is identical to build #2 and max_num_seqs is the only variable. It
        # clears the 11,520 blocks that 160 concurrent 9216-token requests need,
        # and the extra 96 mamba slots (66 -> 162) cost 1.76 GB/device, putting
        # the run at a predicted 86.9 GB of the 94.74 GB physical wall. Note
        # that on the pinned path there is no software check for this: setting
        # the flag early-returns _maybe_set_compact_mamba_num_blocks_override
        # (kv_cache_manager.py:347) before `avail` is ever computed, so the
        # allocation either fits physically or the TPU allocator OOMs.
        # Since #3481 the worker takes its own tensor sizing *from*
        # kv_cache_config.num_blocks, so the two can no longer disagree in the
        # direction that matters -- but the flag is still required, because
        # that only makes the worker follow the scheduler, and nothing makes
        # the scheduler learn the compact-mamba pool size on its own.
        #
        # Setting the flag also used to trip an early return in
        # _maybe_set_compact_mamba_num_blocks_override that would have given
        # all 69 mamba layers 12288 slots (~7.2 TB) and OOM'd at KV init.
        # #3481 added a fallback that sizes mamba at max_num_reqs + 1
        # independently of that path, so the two are now safe together; the
        # observed layout is mamba=66, attention=12288.
        #
        # BENCH_REQUEST_TIMEOUT_S bounds a single request. The benchmark client
        # hardcoded a 6h aiohttp total, and that timeout is also how long a
        # stuck request holds its slot in the concurrency semaphore -- so on
        # tc#960, 28 requests that the engine had already dropped kept 28 of 32
        # slots occupied until the leg's own 8h wall clock ran out. The engine
        # went idle at 13:38 and the job burned another 3h56m, 57% of the leg,
        # with nothing running. 7200s is ~4x the measured P99 E2EL of 1622s and
        # covers a full 32768-token generation even at 200ms/token, so it
        # cannot truncate a legitimate answer; it just stops one wedged request
        # from costing four hours.
        #
        # MAX_NUM_BATCHED_TOKENS stays at 2048, so an 8192-token prompt is four
        # chunked-prefill passes. Raising it would grow the profiling peak that
        # vLLM subtracts from the KV budget, shrinking the pool that is already
        # the binding constraint. TTFT here is therefore a chunked number.
        #
        # MOE_STAGE_WEIGHTS_ON_HOST is what cut the weight load from 3h34m to
        # 33m: fp8 MoE expert weights are assembled in host memory and moved to
        # device once, instead of one device round-trip per expert slice. It
        # landed upstream in #3503 as opt-in (envs.py default False), so it has
        # to be set explicitly here -- without it this model silently goes back
        # to a 3.5-hour load and blows the health-wait budget.
        #
        # QUANTIZE_BF16_LINEAR_PATTERNS and QUANTIZE_BF16_LINEAR_BLOCK_SIZE are
        # deliberately NOT set. Every run from #17 on has carried them, and the
        # accuracy each produced is only interpretable against a number measured
        # on the same harness with them off. We do not have that number: the
        # 0.899-0.904 GPQA band those runs are compared to came from this repo's
        # benchmark_serving.py fork, which is a different prompt, a different
        # extractor and a different subset from anything a GPU run reports.
        #
        # So this build is the control. The model is the stock checkpoint --
        # 512 routed experts in block-wise fp8 as shipped, all 92 layers'
        # attention and gated-delta-net projections left in the bf16 the
        # checkpoint stores them in (4.27 GiB/chip, replicated x2 because they
        # shard on ATTN_HEAD, which excludes attn_dp). Nothing is requantized at
        # load time and no gmm_v2 block-size constraint is in play, which is the
        # point: whatever the three lm_eval legs report is attributable to the
        # model and the serving stack, not to a quantization decision.
        #
        # Everything the removed knobs encoded -- the 2.13 GiB/chip fp8 recovers,
        # the mxu_column_size=256 floor below which no fp8 matmul is issued, and
        # the block-256 rhs-scale bug that produced #18's GPQA 0.0 -- is recorded
        # in todo_gmm_v2_block_straddling and in the #19 build notes. Restoring
        # them is a one-line change; measuring against this baseline is the
        # reason to bother.
        #
        # Container environment for the head *and* all three workers. Env vars
        # inlined into the serve command would only reach the head process;
        # USE_BATCHED_RPA_KERNEL in particular is read at import time by
        # runner/kv_cache.py to pick the kernel module, so it has to be in the
        # environment of every Ray worker container.
        export MULTIHOST_ENV_VARS="$$(printf '%s\n' \
          'MODEL_IMPL_TYPE=vllm' \
          'NEW_MODEL_DESIGN=1' \
          'USE_BATCHED_RPA_KERNEL=1' \
          'USE_BATCHED_RPA_SEQ_ON_LANE=1' \
          'USE_MOE_EP_KERNEL=0' \
          'VLLM_INCREMENTAL_FP8_LOADING=1' \
          'MOE_STAGE_WEIGHTS_ON_HOST=1' \
          'VLLM_XLA_CHECK_RECOMPILATION=0' \
          'SKIP_JAX_PRECOMPILE=0' \
          'RUNAI_STREAMER_CONCURRENCY=64' \
          'RUNAI_STREAMER_MEMORY_LIMIT=128000000000' \
          'RUNAI_STREAMER_LOG_LEVEL=INFO' \
          'RUNAI_STREAMER_LOG_TO_STDERR=1' \
          'TPU_WEIGHT_LOAD_PROFILE=1' \
          'TPU_WEIGHT_LOAD_PROFILE_EVERY=10000' \
          'TENSOR_PARALLEL_SIZE=32' \
          'ATTN_DP_SIZE=2' \
          'MAX_MODEL_LEN=40960' \
          'MAX_NUM_SEQS=80' \
          'NUM_GPU_BLOCKS_OVERRIDE=12288' \
          'MAX_NUM_BATCHED_TOKENS=2048' \
          'GPU_MEMORY_UTILIZATION=0.92' \
          'BLOCK_SIZE=128' \
          'KV_CACHE_DTYPE=fp8' \
          'INPUT_LEN=8192' \
          'OUTPUT_LEN=1024' \
          'NUM_PROMPTS=32' \
          'MAX_CONCURRENCY=8' \
          'BENCH_SWEEP=8:32' \
          'NUM_WARMUPS=32' \
          'EVAL_SUITE=none' \
          'STD_EVAL_SUITE=gpqa,gsm8k,mmlu' \
          'GPQA_REASONING_EFFORT=xhigh' \
          'GPQA_SAMPLING=spec' \
          'GPQA_MAX_GEN_TOKS=32768' \
          'GPQA_CONCURRENCY=32' \
          'GPQA_TIMEOUT_S=10800' \
          'GSM8K_REASONING_EFFORT=low' \
          'GSM8K_CONCURRENCY=64' \
          'GSM8K_MAX_TOKENS=1024' \
          'GSM8K_TIMEOUT_S=7200' \
          'MMLU_BATCH_SIZE=8' \
          'MMLU_CONCURRENCY=8' \
          'MMLU_TIMEOUT_S=10800' \
          'BENCH_REQUEST_TIMEOUT_S=7200' \
          "JAX_CACHE_MAX_GB=$$JAX_CACHE_MAX_GB" \
          "JAX_CACHE_MIN_FREE_GB=$$JAX_CACHE_MIN_FREE_GB" \
          $$CACHE_ENV \
          $$CKPT_ENV)"
        echo "--- effective MULTIHOST_ENV_VARS"; printf '%s\n' "$$MULTIHOST_ENV_VARS"
        echo "--- effective MULTIHOST_DOCKER_ARGS: $$MULTIHOST_DOCKER_ARGS"

        # Three client legs against one server: perf, then each accuracy
        # harness. `&&`, not `;` -- if the perf leg cannot get a completion out
        # of the server there is nothing for the evals to score, and each eval
        # leg records its own per-dataset failures internally rather than
        # aborting on the first. The fork-based leg stays in the chain even
        # though EVAL_SUITE=none makes it a no-op here: it exits 0 immediately,
        # and leaving it wired up means flipping one variable brings the old
        # harness back for a side-by-side without editing the command.
        #
        # The run's exit status is stashed instead of propagated so the artifact
        # upload below still happens; without that, a failure here means no
        # serve log, no bench.json and no eval output to diagnose it with. The
        # last command in this step re-raises it.
        set +e
        .buildkite/scripts/run_multihost.sh \
          "bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_serve.sh" \
          "bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_client.sh && bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_eval.sh && bash /workspace/tpu_inference/.buildkite/dev/qwen38_2p4t_eval_std.sh"
        echo $$? > "$$PWD/dev_artifacts/.run_rc"
        set -e
      - sudo -n chown -R "$$(id -u):$$(id -g)" dev_artifacts 2>/dev/null || sudo -n chmod -R a+rX dev_artifacts || true
      - buildkite-agent artifact upload "dev_artifacts/**/*"
      - exit "$$(cat dev_artifacts/.run_rc 2>/dev/null || echo 1)"
