# The model suites on the Kueue fleet: every TPU step under models/, as the
# bare-metal nightly uploads them through upload_models_and_features.sh. Step
# keys match the bare-metal files' so the lanes read side by side. Thirteen
# files have no TPU step to migrate - their work sits on cpu behind a TODO.
#
# A build is one generation. The defaults are v6e; a v7x build sets
# TPU_VERSION=tpu7x, KUBE_SHAPE_SINGLE/KUBE_SHAPE_MULTI to tpu7x shapes and
# TENSOR_PARALLEL_SIZE_SINGLE=2, the values the uploader exports for its v7x
# group. Several models run only on v7x: on v6e their steps record themselves
# unverified, as they do on bare metal.
#
# Tests are not soft_fail here; each record step depends on its test with
# allow_failure instead. See pipeline_features_kube.yml.
#
# Chips, topology, Kueue queue, caches and deadlines come from the cluster-side
# profile registry in ci-infra; a step names only a shape and a command.
#
# Do not add a pipeline-level `env:` block: a name set there wins over one
# passed to `bk build create --env` and could no longer be overridden per
# build.

x-shape-single: &shape_single "${KUBE_SHAPE_SINGLE:-ct6e-standard-1t/1x1}"
x-shape-multi: &shape_multi "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"

# Carries the launcher and the service account that may submit a workload.
# Repeated per step rather than merged in, because a step's `plugins:` is a list
# and a YAML merge key would replace it wholesale.
x-kube-plugin: &kube_plugin
  kubernetes:
    podTemplate: tpu-launcher

steps:
  # The image comes from pipeline_build.yml, as on bare metal. There bootstrap.sh
  # uploads it after publishing the vLLM pin that setup_docker_env.sh reads from
  # build metadata; this pipeline does not run bootstrap.sh, so this step does
  # both. Each build there records its pushed tag as ci-image-<generation>,
  # which run.sh reads back.
  - label: ":pipeline: Upload the image build"
    agents:
      queue: "cpu"
    commands:
      - |
        source .buildkite/scripts/configs/pipeline_config.sh
        buildkite-agent meta-data set VLLM_COMMIT_HASH \
          "$${VLLM_COMMIT_HASH:-$$(get_vllm_commit_hash)}"
        buildkite-agent pipeline upload .buildkite/pipeline_build.yml

  # ---- Qwen_Qwen2_5-VL-7B-Instruct ----

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Unit tests for Qwen/Qwen2.5-VL-7B-Instruct"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_UnitTest"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: *shape_single
    plugins:
      - *kube_plugin
    commands:
      - |
        .buildkite/kubernetes/run.sh \
          bash -c 'python3 -m pytest -s -v -x /workspace/tpu_inference/tests/models/jax/test_qwen2_5_vl.py'

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record unit test result for Qwen/Qwen2.5-VL-7B-Instruct"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen2_5-VL-7B-Instruct_UnitTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_UnitTest"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen2.5-VL-7B-Instruct"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "multimodal"
    plugins:
      - *kube_plugin
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_UnitTest

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Accuracy for Qwen/Qwen2.5-VL-7B-Instruct"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen2_5-VL-7B-Instruct_UnitTest"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: *shape_single
      TEST_MODEL: "Qwen/Qwen2.5-VL-7B-Instruct"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE_SINGLE:-1}"
      MINIMUM_ACCURACY_THRESHOLD: "0.72"
    plugins:
      - *kube_plugin
    commands:
      - |
        .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record accuracy result for Qwen/Qwen2.5-VL-7B-Instruct"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen2_5-VL-7B-Instruct_Accuracy"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_Accuracy"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen2.5-VL-7B-Instruct"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "multimodal"
    plugins:
      - *kube_plugin
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_Accuracy

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Performance benchmarks for Qwen/Qwen2.5-VL-7B-Instruct"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen2_5-VL-7B-Instruct_Accuracy"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: *shape_single
      COMPILATION_CONFIG: "{\"cudagraph_mm_encoder\": true}"
    plugins:
      - *kube_plugin
    commands:
      - |
        if [ "${MODEL_IMPL_TYPE:-auto}" = "vllm" ]; then
          echo "Qwen2.5-VL-7B benchmarks are not supported on the vllm (torchax)" \
               "path. Its vision tower has no compiled route there -- the model is" \
               "not in vision_tower_jit's JITTABLE_ARCHS and vLLM's Qwen2_5_VL does" \
               "not declare supports_encoder_cudagraph, so MMEncoderJitManager" \
               "declines it -- and the encoder runs eager: 0.04 req/s on tpu7x" \
               "(vs 2.03 req/s on the JAX path) and an HBM OOM inside the ViT" \
               "attention on tpu6e. Recording as unverified until the torchax" \
               "multimodal path gets a compiled vision tower."
          buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_Benchmark" "unverified"
        else
          .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh
        fi

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record performance benchmark result for Qwen/Qwen2.5-VL-7B-Instruct"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen2_5-VL-7B-Instruct_Benchmark"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_Benchmark"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen2.5-VL-7B-Instruct"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "multimodal"
    plugins:
      - *kube_plugin
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen2_5-VL-7B-Instruct_Benchmark

