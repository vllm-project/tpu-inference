# RELEASE_MODE=nightly. Uploaded by bootstrap.py, which sets RELEASE_QUEUE to
# the queue it runs on; `?` makes the upload fail if it is unset. The agent
# doesn't substitute variables in `secrets`, so each cluster that can run this
# holds the Docker Hub token under this one name.
steps:
  - label: ":docker: Publish vllm/vllm-tpu nightly image"
    key: publish_nightly_image
    agents:
      queue: "${RELEASE_QUEUE?}"
    secrets:
      - DOCKERHUB_TOKEN_TPU_INFERENCE
    plugins:
      - docker-login#v3.0.0:
          username: tpuinference
          password-env: DOCKERHUB_TOKEN_TPU_INFERENCE
    command: python3 .buildkite/release/publish_image.py nightly
