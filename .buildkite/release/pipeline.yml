# tpu-inference-release: everything tpu-inference publishes. It runs only in
# the TPU Release Buildkite cluster, on the release-tpu-inference queue, whose
# agent alone can read the Docker Hub token and mint PyPI tokens.
#
# The pipeline's settings upload this file from main whatever branch a build is
# on, and every step runs main's release tooling against the build's own
# checkout. A release branch only supplies the code being released, so it never
# needs release tooling ported to it. README.md has the how-to.
#
#   main (scheduled)    nightly images: ci/dev/prod to GAR, dev to Docker Hub
#   releases/vX.Y.Z     a release: build the images and wheels once, check them,
#                       wait for approval, then publish those same bytes
#                       (plan_publish.py)

steps:
  - label: ":docker: Nightly images (GAR, and Docker Hub nightly)"
    key: nightly_images
    if: build.branch == "main"
    agents:
      queue: release-tpu-inference
    env:
      PUBLISH_DOCKERHUB: "1"
      DOCKERHUB_REPO: "vllm/vllm-tpu"
      DOCKERHUB_USERNAME: "vllm"
    secrets:
      - DOCKERHUB_TOKEN_TPU_INFERENCE
    commands:
      - bash .buildkite/scripts/publish_nightly_images.sh

  # --- A release ------------------------------------------------------------
  # Each command step starts by unpacking main's release tooling, pinned to the
  # commit this file was uploaded from, into $RELEASE_TOOLS.

  - label: ":clipboard: Preflight: version, CI, PyPI"
    key: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-tpu-inference
    commands:
      - &tools |
        T="$$(buildkite-agent meta-data get release-tools-commit)"
        git fetch -q origin "$$T"
        RELEASE_TOOLS="$$(mktemp -d)"
        git archive "$$T" .buildkite/release .buildkite/scripts | tar -x -C "$$RELEASE_TOOLS"
        export RELEASE_TOOLS="$$RELEASE_TOOLS/.buildkite"
      - bash "$$RELEASE_TOOLS/release/preflight.sh"

  - label: ":docker: Build and stage the images"
    key: build_images
    depends_on: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-tpu-inference
    timeout_in_minutes: 180
    commands:
      - *tools
      - bash "$$RELEASE_TOOLS/release/build_images.sh"

  # The wheels are built by the release checkout's own scripts, which belong
  # to the code being released; publish_wheel.sh, later, is main's.
  - label: ":package: Build the tpu-inference wheel"
    key: build_core_wheel
    depends_on: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-tpu-inference
    env:
      PUBLISH_PYPI: "tpu-inference"  # build_core_wheel.sh fails early if it's on PyPI
    commands:
      - bash .buildkite/scripts/build_core_wheel.sh

  - label: ":package: Build the vllm-tpu wheel"
    key: build_vllm_tpu
    depends_on: build_core_wheel
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-tpu-inference
    commands:
      - |
        set -euo pipefail
        CORE_VERSION="$$(buildkite-agent meta-data get CORE_RELEASE_VERSION)"
        bash .buildkite/scripts/build_vllm_tpu.sh "$$CORE_VERSION"
        buildkite-agent artifact upload "dist/vllm_tpu-*.whl"
        buildkite-agent artifact upload "dist/vllm_tpu-*.tar.gz"
        buildkite-agent meta-data set VLLM_TPU_RELEASE_VERSION "$$CORE_VERSION"

  - label: ":mag: Check the wheels install from PyPI"
    key: check_wheels
    depends_on: build_vllm_tpu
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-tpu-inference
    commands:
      - *tools
      - bash "$$RELEASE_TOOLS/release/check_wheels.sh"

  - label: ":pipeline: Plan the approval and publish"
    key: plan_publish
    depends_on:
      - build_images
      - check_wheels
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents:
      queue: release-tpu-inference
    commands:
      - *tools
      - python3 "$$RELEASE_TOOLS/release/plan_publish.py" | buildkite-agent pipeline upload --no-interpolation
