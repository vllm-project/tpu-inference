# tpu-inference-release: builds the vllm/vllm-tpu image of a release once,
# waits for approval, then publishes that same image to Docker Hub.
#
# The pipeline settings upload this file from the build's own checkout, for
# releases/v* branches only, so a release branch runs the release tooling it
# was cut with. plan_publish.py adds the approval and publish steps. README.md
# has the how-to.

steps:
  - label: ":clipboard: Preflight"
    key: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: &queue
      queue: release-tpu-inference
    commands:
      - bash .buildkite/release/preflight.sh

  - label: ":docker: Build and stage the image"
    key: build_images
    depends_on: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: *queue
    timeout_in_minutes: 180
    commands:
      - bash .buildkite/release/build_images.sh

  - label: ":pipeline: Plan the approval and publish"
    key: plan_publish
    depends_on: build_images
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: *queue
    commands:
      - python3 .buildkite/release/plan_publish.py | buildkite-agent pipeline upload --no-interpolation
