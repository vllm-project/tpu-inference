# tpu-inference-release: a release of tpu-inference, built once, approved, then
# published as those same bytes.
#
# The pipeline's settings upload this file from the build's own checkout, for
# builds of main and releases/v* only, so a release branch runs the release
# tooling it was cut with. README.md has the how-to.
#
#   releases/vX.Y.Z   settle the version, build, wait for approval, then
#                     publish (plan_publish.py)

steps:
  - label: ":clipboard: Preflight: version, PyPI"
    key: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: &queue
      queue: release-tpu-inference
    commands:
      - bash .buildkite/release/preflight.sh

  # Placeholder: building and staging the release image comes in a follow-up.
  - label: ":docker: Build and stage the image (placeholder)"
    key: build_images
    depends_on: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: *queue
    command: 'echo "Docker image: not handled by this pipeline yet."'

  - label: ":package: Build the tpu-inference wheel"
    key: build_tpu_inference_wheel
    depends_on: preflight
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: *queue
    env:
      PUBLISH_PYPI: "tpu-inference"  # build_tpu_inference_wheel.sh fails early if it's on PyPI
    commands:
      - bash .buildkite/scripts/build_tpu_inference_wheel.sh

  - label: ":package: Build the vllm-tpu wheel"
    key: build_vllm_tpu_wheel
    depends_on: build_tpu_inference_wheel
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: *queue
    commands:
      - |
        set -euo pipefail
        VERSION="$$(buildkite-agent meta-data get release-version)"
        bash .buildkite/scripts/build_vllm_tpu_wheel.sh "$$VERSION"
        buildkite-agent artifact upload "dist/vllm_tpu-*.whl"
        buildkite-agent artifact upload "dist/vllm_tpu-*.tar.gz"

  - label: ":mag: Check the wheels install from PyPI"
    key: check_wheels
    depends_on: build_vllm_tpu_wheel
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: *queue
    commands:
      - bash .buildkite/release/check_wheels.sh

  - label: ":pipeline: Plan the approval and publish"
    key: plan_publish
    depends_on:
      - build_images
      - check_wheels
    if: build.branch =~ /^releases\/v[0-9]+\.[0-9]+\.[0-9]+$/
    agents: *queue
    commands:
      - python3 .buildkite/release/plan_publish.py | buildkite-agent pipeline upload --no-interpolation
