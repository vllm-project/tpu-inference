# How much of CI runs on the kube fleet instead of the bare-metal TPU agents,
# read by .buildkite/scripts/ci_fleet.sh for every build that does not force a
# target (CI_FLEET on the pipeline or build, or a [ci kube] / [ci bare] tag).
#
# Each PR - or each commit, for builds outside a PR - hashes to a bucket 0-99
# and runs on kube when its bucket is below KUBE_PERCENT. A PR keeps its
# bucket across commits, so it does not flip between targets. Ramping up is a
# one-line change here; raising the number only adds builds to kube, and none
# that were there move back. A build reads this file from its own commit, so a
# PR follows a change here once it is rebased.

# 0-100.
KUBE_PERCENT=0

# Changing this reshuffles which PRs and commits fall under KUBE_PERCENT.
SALT=v1
