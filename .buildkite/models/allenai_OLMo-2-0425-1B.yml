steps:
  - label: "${TPU_VERSION:-tpu6e} Unit tests for allenai/OLMo-2-0425-1B"
    key: "${TPU_VERSION:-tpu6e}_allenai_OLMo-2-0425-1B_UnitTest"
    soft_fail: true
    agents:
      queue: "${TPU_QUEUE_SINGLE:-tpu_v6e_queue}"
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          bash -c 'OLMO2_TEST_MODEL=allenai/OLMo-2-0425-1B python3 -m pytest -s -v -x /workspace/tpu_inference/tests/models/jax/test_olmo2.py'
  - label: "${TPU_VERSION:-tpu6e} Record unit test result for allenai/OLMo-2-0425-1B"
    key: "${TPU_VERSION:-tpu6e}_record_allenai_OLMo-2-0425-1B_UnitTest"
    depends_on: "${TPU_VERSION:-tpu6e}_allenai_OLMo-2-0425-1B_UnitTest"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "allenai/OLMo-2-0425-1B"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_allenai_OLMo-2-0425-1B_UnitTest
