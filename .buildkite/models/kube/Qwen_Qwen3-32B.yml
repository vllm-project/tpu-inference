# The kube steps for ../Qwen_Qwen3-32B.yml, with the same keys. See README.md.

steps:
  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Unit tests for Qwen/Qwen3-32B"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_UnitTest"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_SINGLE:-ct6e-standard-1t/1x1}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh \
          bash -c 'python3 -m pytest -s -v -x /workspace/tpu_inference/tests/models/jax/test_qwen3.py'

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record unit test result for Qwen/Qwen3-32B"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-32B_UnitTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_UnitTest"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3-32B"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "text-only"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_UnitTest

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Accuracy for Qwen/Qwen3-32B"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-32B_UnitTest"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TEST_MODEL: "Qwen/Qwen3-32B"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE_MULTI:-8}"
      MINIMUM_ACCURACY_THRESHOLD: "0.74"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record accuracy result for Qwen/Qwen3-32B"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-32B_Accuracy"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_Accuracy"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3-32B"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "text-only"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_Accuracy

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Performance benchmarks for Qwen/Qwen3-32B"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-32B_Accuracy"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TEST_MODEL: "Qwen/Qwen3-32B"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE_MULTI:-8}"
      MINIMUM_THROUGHPUT_THRESHOLD: "12.46"
      INPUT_LEN: "1800"
      OUTPUT_LEN: "128"
      PREFIX_LEN: "0"
      MAX_MODEL_LEN: "2048"
      MAX_NUM_SEQS: "512"
      MAX_NUM_BATCHED_TOKENS: "4096"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/benchmark.sh

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record performance benchmark result for Qwen/Qwen3-32B"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-32B_Benchmark"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_Benchmark"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3-32B"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "text-only"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3-32B_Benchmark
