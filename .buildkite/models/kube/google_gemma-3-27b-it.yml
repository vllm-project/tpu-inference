# The kube steps for ../google_gemma-3-27b-it.yml, with the same keys. See README.md.

steps:
  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Unit tests for google/gemma-3-27b-it"
    key: "${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_UnitTest"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh \
          bash -c 'SKIP_JAX_PRECOMPILE=1 VLLM_XLA_CHECK_RECOMPILATION=0 python3 /workspace/tpu_inference/examples/offline_inference.py --model=google/gemma-3-27b-it --tensor_parallel_size=8 --max_model_len=1024 --max_num_seqs=1'

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record unit test result for google/gemma-3-27b-it"
    key: "${TPU_VERSION:-tpu6e}_record_google_gemma-3-27b-it_UnitTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_UnitTest"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "google/gemma-3-27b-it"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "text-only"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_UnitTest

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Accuracy for google/gemma-3-27b-it"
    key: "${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_google_gemma-3-27b-it_UnitTest"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TEST_MODEL: "google/gemma-3-27b-it"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE_MULTI:-8}"
      MINIMUM_ACCURACY_THRESHOLD: "0.56"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record accuracy result for google/gemma-3-27b-it"
    key: "${TPU_VERSION:-tpu6e}_record_google_gemma-3-27b-it_Accuracy"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_Accuracy"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "google/gemma-3-27b-it"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "text-only"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_Accuracy

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Performance benchmarks for google/gemma-3-27b-it"
    key: "${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_google_gemma-3-27b-it_Accuracy"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TEST_MODEL: "google/gemma-3-27b-it"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE_MULTI:-8}"
      MINIMUM_THROUGHPUT_THRESHOLD: "21"
      INPUT_LEN: "1000"
      OUTPUT_LEN: "100"
      PREFIX_LEN: "0"
      MAX_MODEL_LEN: "1280"
      MAX_NUM_SEQS: "512"
      MAX_NUM_BATCHED_TOKENS: "2048"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh bash /workspace/tpu_inference/tests/e2e/benchmarking/benchmark.sh

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record performance benchmark result for google/gemma-3-27b-it"
    key: "${TPU_VERSION:-tpu6e}_record_google_gemma-3-27b-it_Benchmark"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_Benchmark"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "google/gemma-3-27b-it"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "text-only"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_google_gemma-3-27b-it_Benchmark
