# The kube steps for ../Qwen_Qwen3-Embedding-8B.yml, with the same keys. See README.md.

steps:
  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Unit tests for Qwen/Qwen3-Embedding-8B"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_UnitTest"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_SINGLE:-ct6e-standard-1t/1x1}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/models/jax/test_qwen3.py::TestQwen3ForCausalLM::test_vocab_padding_for_sharding

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record unit test result for Qwen/Qwen3-Embedding-8B"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-Embedding-8B_UnitTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_UnitTest"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3-Embedding-8B"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "embedding"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_UnitTest

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Accuracy for Qwen/Qwen3-Embedding-8B"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-Embedding-8B_UnitTest"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_SINGLE:-ct6e-standard-1t/1x1}"
      TEST_MODEL: "Qwen/Qwen3-Embedding-8B"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE_SINGLE:-1}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh python3 -m pytest -s -v /workspace/tpu_inference/tests/e2e/test_step_pooling.py

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record accuracy result for Qwen/Qwen3-Embedding-8B"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-Embedding-8B_Accuracy"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_Accuracy"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3-Embedding-8B"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "embedding"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_Accuracy

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Performance benchmarks for Qwen/Qwen3-Embedding-8B"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-Embedding-8B_Accuracy"
    agents:
      queue: "kube"
    env:
      TEST_MODEL: "Qwen/Qwen3-Embedding-8B"
      TENSOR_PARALLEL_SIZE: "${TENSOR_PARALLEL_SIZE_SINGLE:-1}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_Benchmark" "unverified"

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record performance benchmark result for Qwen/Qwen3-Embedding-8B"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3-Embedding-8B_Benchmark"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_Benchmark"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3-Embedding-8B"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "embedding"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3-Embedding-8B_Benchmark
