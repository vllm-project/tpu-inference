# The kube steps for ../google_gemma-4-31B-it.yml, with the same keys. See README.md.

steps:
  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Unit tests for google/gemma-4-31B-it"
    key: "${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_UnitTest"
    depends_on: "build_docker_${TPU_VERSION:-tpu6e}"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh \
          bash -c 'USE_BATCHED_RPA_KERNEL=1 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" SKIP_JAX_PRECOMPILE=1 VLLM_XLA_CHECK_RECOMPILATION=0 python /workspace/tpu_inference/examples/offline_inference.py --model google/gemma-4-31B-it --tensor-parallel-size 8 --max-num-batched-tokens 4096 --max-model-len 4096'

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record unit test result for google/gemma-4-31B-it"
    key: "${TPU_VERSION:-tpu6e}_record_google_gemma-4-31B-it_UnitTest"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_UnitTest"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "google/gemma-4-31B-it"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "multimodal"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_UnitTest

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Accuracy for google/gemma-4-31B-it"
    key: "${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_google_gemma-4-31B-it_UnitTest"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TEST_MODEL: "google/gemma-4-31B-it"
      TENSOR_PARALLEL_SIZE: "8"
      MINIMUM_ACCURACY_THRESHOLD: "0.56"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/kubernetes/run.sh bash -c 'USE_BATCHED_RPA_KERNEL=1 bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh'

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record integration test result for google/gemma-4-31B-it"
    key: "${TPU_VERSION:-tpu6e}_record_google_gemma-4-31B-it_Accuracy"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_Accuracy"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "google/gemma-4-31B-it"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "multimodal"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_Accuracy

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Performance benchmarks for google/gemma-4-31B-it"
    key: "${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_google_gemma-4-31B-it_Accuracy"
    timeout_in_minutes: 1440
    agents:
      queue: "kube"
    env:
      SHAPE: "${KUBE_SHAPE_MULTI:-ct6e-standard-8t/2x4}"
      TEST_MODEL: "google/gemma-4-31B-it"
      TENSOR_PARALLEL_SIZE: "8"
      MINIMUM_THROUGHPUT_THRESHOLD: "1.8"
      GPU_MEMORY_UTILIZATION: "0.90"
      COMPILATION_CONFIG: "{\"cudagraph_mm_encoder\": true}"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        if [ "${TPU_VERSION:-tpu6e}" = "tpu6e" ]; then
          buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_Benchmark" "not enough HBM"
          exit 0
        fi
        # The torchax (MODEL_IMPL_TYPE=vllm) path is currently ~8-10% below
        # the jax-native throughput bar (dev 899: 26B 1.86 vs 2, 31B 1.62
        # vs 1.80). Hold it to measured x ~0.85 until optimized.
        if [ "${MODEL_IMPL_TYPE:-auto}" = "vllm" ]; then
          export MINIMUM_THROUGHPUT_THRESHOLD=1.35
        fi
        .buildkite/kubernetes/run.sh bash -c 'TIMEOUT_SECONDS=2400 BLOCK_SIZE=256 USE_BATCHED_RPA_KERNEL=1 JITTED_MM_MODULE_KEYS="model.vision_tower.encoder" REGISTER_MM_MODULE_CUSTOM_PYTREE_CLASSES="transformers.modeling_outputs.BaseModelOutputWithPast" /workspace/tpu_inference/tests/e2e/benchmarking/mm_bench_recipe.sh'

  - label: ":kubernetes: ${TPU_VERSION:-tpu6e} Record performance benchmark result for google/gemma-4-31B-it"
    key: "${TPU_VERSION:-tpu6e}_record_google_gemma-4-31B-it_Benchmark"
    depends_on:
      - step: "${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_Benchmark"
        allow_failure: true
    agents:
      queue: "kube"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "google/gemma-4-31B-it"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "multimodal"
    plugins:
      - kubernetes:
          podTemplate: tpu-launcher
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_google_gemma-4-31B-it_Benchmark
