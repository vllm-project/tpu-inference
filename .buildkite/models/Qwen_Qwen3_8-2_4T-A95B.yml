# Qwen3.8-2.4T-A95B-FP8 on a v7x-32 slice (4 hosts), through run_multihost.sh.
#
# Loading the 2.4 TB checkpoint and compiling takes about an hour, so the model
# is served once: the UnitTest step brings the server up, runs a smoke request,
# GSM8K and an 8k/1k random benchmark against it, and publishes the measurements
# as build meta-data. Accuracy and Benchmark are cheap gates over those
# measurements on cpu. Benchmark depends on UnitTest's record rather than
# Accuracy's so that an accuracy regression does not also hide the perf result.
#
# Every step runs only in the MODEL_IMPL_TYPE=vllm nightly. The model only has a
# vllm (torchax) implementation, so the auto nightly would repeat the same run,
# and the README model table is built from the vllm matrix. Every step is also
# limited to the v7x group: the UnitTest queue is a fixed v7x-32 queue, so in
# the v6e group (TPU_VERSION=tpu6e at upload) the steps would still wait on that
# agent. A false `if:` keeps them out of the build entirely.
#
# The serve configuration matches the daily benchmark case
# (.buildkite/benchmark/cases/daily/daily_qwen3_8_2p4t_fp8_tpu7x_32.json), whose
# history is the reference for the perf thresholds; keep the two in sync.
# --num-gpu-blocks-override pins the KV pool of this hybrid attention /
# linear-attention model, which the scheduler otherwise sizes far too small.

steps:
  - label: "${TPU_VERSION:-tpu6e} Unit tests for Qwen/Qwen3.8-2.4T-A95B-FP8"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_UnitTest"
    if: 'build.env("MODEL_IMPL_TYPE") == "vllm" && "${TPU_VERSION:-tpu6e}" == "tpu7x"'
    agents:
      queue: tpu_v7x_32_queue
    soft_fail: true
    timeout_in_minutes: 240
    env:
      # run_multihost.sh exits 0 without doing anything unless this is tpu7x.
      TPU_VERSION: "${TPU_VERSION:-tpu6e}"
    commands:
      - |
        set -euo pipefail
        ART="$$PWD/qwen38_nightly_artifacts"
        sudo -n rm -rf "$$ART" 2>/dev/null || rm -rf "$$ART"
        mkdir -p "$$ART"
        export EXTRA_DOCKER_ARGS="-v $$ART:/workspace/artifacts"
        # Container environment for every host: the Ray workers load and shard
        # the weights, so they need the same settings as the head.
        export MULTIHOST_ENV_VARS='MODEL_IMPL_TYPE=vllm
        NEW_MODEL_DESIGN=1
        MOE_HIERARCHICAL_DISPATCH=1
        MOE_STAGE_WEIGHTS_ON_HOST=1
        VLLM_INCREMENTAL_FP8_LOADING=1
        BF16_LINEAR_REQUANTIZE_BLOCK_SIZE=512
        BF16_LINEAR_REQUANTIZE_PATTERNS=re:.*self_attn\..*,re:.*linear_attn.(in_proj_qkv|in_proj_z|in_proj_b|in_proj_a|out_proj)$$,re:.*\.mlp\.shared_expert\.(gate_up_proj|gate_proj|up_proj|down_proj)$$
        USE_BATCHED_RPA_KERNEL=1
        USE_BATCHED_RPA_SEQ_ON_LANE=1
        RUNAI_STREAMER_MEMORY_LIMIT=128000000000'
        rc=0
        .buildkite/scripts/run_multihost.sh \
          "vllm serve gs://tpu-commons-ci/qwen/Qwen3.8-2.4T-A95B-FP8 \
            --served-model-name Qwen/Qwen3.8-2.4T-A95B-FP8 \
            --tokenizer Qwen/Qwen3.8-2.4T-A95B-FP8 \
            --load-format runai_streamer \
            --port 8000 \
            --seed 42 \
            --tensor-parallel-size 32 \
            --enable-expert-parallel \
            --additional-config '{\"sharding\": {\"sharding_strategy\": {\"enable_dp_attention\": true, \"attn_dp_size\": 8}}, \"compilation_sizes\": [384]}' \
            --max-model-len 40960 \
            --max-num-seqs 46 \
            --max-num-batched-tokens 512 \
            --block-size 128 \
            --kv-cache-dtype fp8 \
            --gpu-memory-utilization 0.98 \
            --num-gpu-blocks-override 27232 \
            --no-enable-prefix-caching \
            --async-scheduling" \
          "MODEL=Qwen/Qwen3.8-2.4T-A95B-FP8 OUT_DIR=/workspace/artifacts \
            GSM8K_REASONING_EFFORT=low \
            BENCH_INPUT_LEN=8192 BENCH_OUTPUT_LEN=1024 \
            BENCH_CONCURRENCY=368 BENCH_NUM_WARMUPS=368 \
            bash tests/e2e/benchmarking/eval_running_server.sh" \
          || rc=$$?
        # Files written by the container are root-owned.
        sudo -n chown -R "$$(id -u):$$(id -g)" "$$ART" 2>/dev/null || true
        (cd "$$ART" && buildkite-agent artifact upload "*.json;*.log;gsm8k/**/*") || true
        if [ -f "$$ART/metrics.json" ]; then
          buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_metrics" < "$$ART/metrics.json"
        else
          echo "No metrics.json: the server did not come up or the client never ran."
          [ "$$rc" -ne 0 ] || rc=1
        fi
        exit "$$rc"

  - label: "${TPU_VERSION:-tpu6e} Record unit test result for Qwen/Qwen3.8-2.4T-A95B-FP8"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3_8-2_4T-A95B_UnitTest"
    depends_on: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_UnitTest"
    if: 'build.env("MODEL_IMPL_TYPE") == "vllm" && "${TPU_VERSION:-tpu6e}" == "tpu7x"'
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3.8-2.4T-A95B"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_UnitTest

  # GSM8K reference on this configuration: 0.9795 flexible / 0.9788 strict and
  # 0.9795 / 0.9795 on two runs (stderr 0.0039). 0.96 sits about 5 stderr
  # below; a broken model scores near zero.
  - label: "${TPU_VERSION:-tpu6e} Accuracy for Qwen/Qwen3.8-2.4T-A95B-FP8"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3_8-2_4T-A95B_UnitTest"
    if: 'build.env("MODEL_IMPL_TYPE") == "vllm" && "${TPU_VERSION:-tpu6e}" == "tpu7x"'
    agents:
      queue: cpu
    soft_fail: true
    commands:
      - |
        buildkite-agent meta-data get "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_metrics" > metrics.json
        python3 tests/e2e/benchmarking/check_eval_thresholds.py metrics.json --min-gsm8k 0.96

  - label: "${TPU_VERSION:-tpu6e} Record accuracy result for Qwen/Qwen3.8-2.4T-A95B-FP8"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3_8-2_4T-A95B_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_Accuracy"
    if: 'build.env("MODEL_IMPL_TYPE") == "vllm" && "${TPU_VERSION:-tpu6e}" == "tpu7x"'
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3.8-2.4T-A95B"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_Accuracy

  # Perf reference on this configuration: 1076.2 output / 9686.1 total tok/s
  # (random 8192/1024, concurrency 368); the daily case varies by about 0.1%
  # run to run. The limits are 3% below.
  - label: "${TPU_VERSION:-tpu6e} Performance benchmarks for Qwen/Qwen3.8-2.4T-A95B-FP8"
    key: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3_8-2_4T-A95B_UnitTest"
    if: 'build.env("MODEL_IMPL_TYPE") == "vllm" && "${TPU_VERSION:-tpu6e}" == "tpu7x"'
    agents:
      queue: cpu
    soft_fail: true
    commands:
      - |
        buildkite-agent meta-data get "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_metrics" > metrics.json
        python3 tests/e2e/benchmarking/check_eval_thresholds.py metrics.json \
          --min-output-throughput 1045 --min-total-throughput 9395 --max-failed-requests 0

  - label: "${TPU_VERSION:-tpu6e} Record performance benchmark result for Qwen/Qwen3.8-2.4T-A95B-FP8"
    key: "${TPU_VERSION:-tpu6e}_record_Qwen_Qwen3_8-2_4T-A95B_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_Benchmark"
    if: 'build.env("MODEL_IMPL_TYPE") == "vllm" && "${TPU_VERSION:-tpu6e}" == "tpu7x"'
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "Qwen/Qwen3.8-2.4T-A95B"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_Qwen_Qwen3_8-2_4T-A95B_Benchmark
