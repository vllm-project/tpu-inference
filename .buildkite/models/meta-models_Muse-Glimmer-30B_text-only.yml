steps:
  - label: "${TPU_VERSION:-tpu6e} Unit tests for meta-models/Muse-Glimmer-30B"
    key: "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_UnitTest"
    soft_fail: true
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          bash -c 'JAX_PLATFORMS=cpu python3 -m pytest -s -v -x /workspace/tpu_inference/tests/models/jax/test_muse_glimmer.py'

  - label: "${TPU_VERSION:-tpu6e} Record unit test result for meta-models/Muse-Glimmer-30B"
    key: "${TPU_VERSION:-tpu6e}_record_meta-models_Muse-Glimmer-30B_UnitTest"
    depends_on: "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_UnitTest"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "meta-models/Muse-Glimmer-30B"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_UnitTest

  - label: "${TPU_VERSION:-tpu6e} Accuracy for meta-models/Muse-Glimmer-30B"
    key: "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_meta-models_Muse-Glimmer-30B_UnitTest"
    soft_fail: true
    agents:
      queue: cpu
    commands:
      - |
        buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Accuracy" "unverified"

  - label: "${TPU_VERSION:-tpu6e} Record accuracy result for meta-models/Muse-Glimmer-30B"
    key: "${TPU_VERSION:-tpu6e}_record_meta-models_Muse-Glimmer-30B_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Accuracy"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "meta-models/Muse-Glimmer-30B"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Accuracy

  - label: "${TPU_VERSION:-tpu6e} Performance benchmarks for meta-models/Muse-Glimmer-30B"
    key: "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_meta-models_Muse-Glimmer-30B_Accuracy"
    soft_fail: true
    agents:
      queue: cpu
    commands:
      - |
        buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Benchmark" "unverified"

  - label: "${TPU_VERSION:-tpu6e} Record performance result for meta-models/Muse-Glimmer-30B"
    key: "${TPU_VERSION:-tpu6e}_record_meta-models_Muse-Glimmer-30B_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Benchmark"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "meta-models/Muse-Glimmer-30B"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_meta-models_Muse-Glimmer-30B_Benchmark
